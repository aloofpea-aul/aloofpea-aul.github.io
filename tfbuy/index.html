<script>
/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thDate(iso){if(!iso)return '……………………';const[y,m,d]=iso.split('-').map(Number);return `${d} ${TM[m-1]} ${y+543}`}
function beYear(iso){return (iso?+iso.slice(0,4):new Date().getFullYear())+543}
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function bahtText(num){
  num=Math.round((+num||0)*100)/100;
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{let o='';s=String(+s);if(s==='0')return '';
    // handle millions
    if(s.length>6){return rd(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6))}
    const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
      if(p===0&&d===1&&L>1)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่';else if(p===1&&d===1)o+='';else o+=D[d];o+=P[p]}return o};
  const [b,s]=num.toFixed(2).split('.');let t=rd(b);if(t)t+='บาท';
  if(!t&&!+s)return 'ศูนย์บาทถ้วน';if(+s){t+=rd(s)+'สตางค์'}else t+='ถ้วน';return t}
const toThaiDigits=s=>s.replace(/[0-9]/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= ระบบจัดซื้อหม้อแปลง (ธุรกิจเสริม) — ส่วนเฉพาะของแอปนี้ ================= */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbyeZSYM_uYyC1ZD2q3SdjVPWClHNFRsc_yfUclwPD9mnvw70hU_TG75CXsvmQjsQAAu/exec';   // ← ลิงก์ Web app หลังบ้าน (…/exec) · ว่าง = โหมดทดลองเก็บในเครื่อง
const BOOK_API = 'https://script.google.com/macros/s/AKfycbxNSVvzUdqQC-_8ZKLJM1GFliAM4zWyJI8z8VzU0vhhSSBqq0JcxrUr_UyBkWol7ko1Rw/exec';   // ระบบออกเลขหนังสือ V4

const API_URL = () => lsr('tfbuy_api') || API_DEFAULT;
const LOCAL = () => !API_URL();

const nm = s => String(s || '').replace(/[\s​-‍﻿]/g, '').toLowerCase();

const REG1 = 'ข้อบังคับการไฟฟ้าส่วนภูมิภาคว่าด้วยการดำเนินธุรกิจเสริมของการไฟฟ้าส่วนภูมิภาค พ.ศ. 2567';

async function api(action, payload) {
  if (LOCAL()) return localApi(action, payload || {});
  const c = cred();
  if (!c.user) { const e = new Error('ยังไม่ได้เข้าสู่ระบบศูนย์รวมงาน'); e.code = 'unauthorized'; throw e; }
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 60000);
  let j;
  try {
    const r = await fetch(API_URL(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, user: c.user, pass: c.pass }, payload || {})), signal: ctrl.signal });
    j = await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต'); }
  finally { clearTimeout(t); }
  if (!j || !j.ok) { const e = new Error((j && (j.message || j.error)) || 'ไม่ทราบสาเหตุ'); e.code = j && j.error; e.latest = j && j.latest; throw e; }
  return j;
}
function localApi(action, b) {
  const all = store.get('tfbuy_local_jobs', {});
  const put = () => store.set('tfbuy_local_jobs', all);
  if (action === 'bootstrap') return { ok: true, me: { name: ME.name || 'ผู้ทดลอง', admin: true }, settings: Object.assign({}, DEFSET, store.get('tfbuy_local_settings', {})),
    jobs: Object.values(all).filter(j => !j._deleted).map(j => Object.assign(summaryOf(j), { updatedAt: j._at })).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))) };
  if (action === 'get') { const j = all[b.id]; if (!j) throw new Error('ไม่พบงานนี้'); return { ok: true, job: JSON.parse(JSON.stringify(j)) }; }
  if (action === 'save') {
    const job = JSON.parse(JSON.stringify(b.job)), old = job.id && all[job.id];
    if (!old) { job.id = 'TF' + Date.now().toString(36).toUpperCase(); job.rev = 1; job.createdBy = ME.name; job.createdAt = new Date().toISOString(); }
    else {
      if (b.baseRev != null && (old.rev || 0) !== b.baseRev && !b.force) { const e = new Error('มีผู้อื่นแก้ไขงานนี้หลังจากที่คุณเปิด'); e.code = 'conflict'; e.latest = old; throw e; }
      job.rev = (old.rev || 0) + 1;
      for (const k in old.docs || {}) if (old.docs[k].bookRef && !(job.docs[k] || {}).no) job.docs[k] = Object.assign(job.docs[k] || {}, { no: old.docs[k].no, bookRef: old.docs[k].bookRef });
    }
    job._at = new Date().toISOString(); all[job.id] = job; put();
    return { ok: true, job, rev: job.rev, summary: summaryOf(job) };
  }
  if (action === 'setDocNo') {
    const job = all[b.id]; if (!job) throw new Error('ไม่พบงานนี้');
    if (job.docs[b.docKey].no && !b.replace) throw new Error('ฉบับนี้มีเลขแล้ว');
    Object.assign(job.docs[b.docKey], { no: b.no, date: b.date || job.docs[b.docKey].date, bookRef: b.bookRef || '' });
    job.rev = (job.rev || 0) + 1; job._at = new Date().toISOString(); put();
    return { ok: true, job, rev: job.rev, summary: summaryOf(job) };
  }
  if (action === 'remove') { if (all[b.id]) all[b.id]._deleted = true; put(); return { ok: true }; }
  if (action === 'saveSettings') { store.set('tfbuy_local_settings', b.settings); return { ok: true, settings: b.settings }; }
  throw new Error('unknown action');
}

let saving = false, dirty = false, saveT = null, saveState = '';
function setSave(s) { saveState = s; const el = $('#saveSt'); if (el) { el.textContent = { wait: '● ยังไม่บันทึก', busy: '⟳ กำลังบันทึก…', ok: '✓ บันทึกแล้ว', err: '⚠ บันทึกไม่สำเร็จ — แตะเพื่อลองใหม่' }[s] || ''; el.className = 'savest ' + s; } }
function save() { if (!cur) return; dirty = true; setSave('wait'); clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
const clean = j => { const o = JSON.parse(JSON.stringify(j)); delete o._at; delete o._deleted; return o; };
async function flush() {
  clearTimeout(saveT);
  if (!cur || !dirty) return;
  if (saving) { saveT = setTimeout(flush, 500); return; }
  saving = true; dirty = false; setSave('busy');
  const j = cur;
  try {
    const r = await api('save', { job: clean(j), baseRev: j.rev });
    j.id = r.job.id; j.rev = r.rev; upsertList(r.summary || summaryOf(j));
    rememberPeople(j);
    setSave(dirty ? 'wait' : 'ok');
  } catch (e) {
    if (e.code === 'conflict') {
      const ok = await ask('มีผู้อื่นแก้ไขงานนี้ไปก่อน', `${esc(e.message)}<br><br><b>โหลดข้อมูลล่าสุด</b> = ใช้ข้อมูลของอีกฝ่าย (สิ่งที่คุณเพิ่งแก้จะหาย)<br><b>บันทึกของฉันทับ</b> = ใช้ข้อมูลในหน้าจอนี้`, ['โหลดข้อมูลล่าสุด', 'บันทึกของฉันทับ']);
      if (ok === 0 && e.latest) { cur = fixJob(e.latest); setSave('ok'); jobView(); }
      else { try { const r = await api('save', { job: clean(j), force: true }); j.rev = r.rev; upsertList(r.summary); setSave('ok'); } catch (e2) { dirty = true; setSave('err'); toast(e2.message); } }
    } else { dirty = true; setSave('err'); toast('บันทึกไม่สำเร็จ: ' + e.message); }
  } finally { saving = false; if (dirty && saveState !== 'err') saveT = setTimeout(flush, 1500); }
}
async function settle() { for (let i = 0; i < 120 && (saving || dirty); i++) { if (dirty && !saving) await flush(); else await new Promise(r => setTimeout(r, 250)); } return !dirty; }
function upsertList(s) { if (!s || !s.id) return; const i = LIST.findIndex(x => x.id === s.id); if (i >= 0) LIST[i] = Object.assign(LIST[i], s); else LIST.unshift(s); }
function rememberPeople(j) { store.set('tfbuy_last', { head: j.head, officer: j.officer, mgr: j.mgr, priceCm: j.priceCm, buyCm: j.buyCm, inspCm: j.inspCm }); }
addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

async function bookToken(again) {
  let t = again ? null : lsr('booknum_token_v1');
  if (t) return t;
  const code = await askText('เชื่อมระบบออกเลขหนังสือ', 'กรอก <b>รหัสสำนักงาน</b> (รหัสเดียวกับที่ใช้เข้าระบบออกเลขหนังสือ) — ทำครั้งเดียวต่อเครื่อง', 'รหัสสำนักงาน', true);
  if (!code) return null;
  const r = await book('login', [code]);
  if (!r || !r.ok) throw new Error(r && r.reason === 'SETUP_REQUIRED' ? 'ระบบออกเลขหนังสือยังไม่ได้ตั้งรหัสสำนักงาน' : 'รหัสสำนักงานไม่ถูกต้อง');
  lsr('booknum_token_v1', r.token);
  if (r.settings) lsr('booknum_settings_v1', JSON.stringify(r.settings));

}
async function bookCall(fn, args) {   // แนบ token อัตโนมัติ · หมดอายุ → ถามรหัสใหม่ 1 ครั้ง
  let t = await bookToken(false); if (!t) return null;
  try { return await book(fn, [t].concat(args)); }
  catch (e) {
    if (!/AUTH_REQUIRED|SETUP_REQUIRED/.test(e.message)) throw e;
    lsr('booknum_token_v1', null); t = await bookToken(true); if (!t) return null;
    return await book(fn, [t].concat(args));
  }
}

const E = (f, s) => `<span data-e="${f}">${s}</span>`;
const ovOf = (j, k) => ((j.docs[k] || {}).ov || {});

 <div class="subj"><div>เรียน</div><div>${esc(ov.attn || o.attn)}</div></div><div class="gap"></div>`; }
function extHead(j, k, o) { const d = j.docs[k] || {}, ov = ovOf(j, k);
  return `<div class="exth"><div class="exl"><div style="height:24mm"></div>ที่ ${docNo(j, k)}</div><div class="exc"><img class="logo" style="width:30mm;margin:0 auto" src="${LOGO}"></div>
 <div class="exr"><div style="height:24mm"></div>${esc(SET.officeFull)}<br>${esc(SET.addr1)}<br>${esc(SET.addr2)}</div></div><div class="gap"></div>

function approverBox(j, k, lines, extra) { const d = j.docs[k] || {}, ov = ovOf(j, k); const L = (ov.box || lines.join('\n')).split('\n');

function signer(p, extra) { return `<div class="sc">(${ef(withPre(p.name))})</div><div class="sc">${ef(p.pos)}</div>${(extra || []).map(x => `<div class="sc">${esc(x)}</div>`).join('')}`; }
function cmSign(list) { return list.map(m => `<div class="cms"><span>ลงชื่อ</span><span class="dl"></span><span>${ef(m.role)}</span></div><div class="cmn"><span></span><span>(${ef(withPre(m.name))})</span><span></span></div><div class="cmn"><span></span><span>${ef(m.pos)}</span><span></span></div><div class="gap"></div>`).join(''); }
function cmLines(list, pre, nw, pl, nmw) { return list.map((m, x) => `<div class="cml" style="--nw:${nw || '6mm'};--pl:${pl || '3cm'};--nm:${nmw || '45mm'}"><span>${pre}${x + 1}${pre ? '' : '.'}</span><span>${ef(withPre(m.name))}</span><span>${ef(m.pos)}</span><span>${ef(m.role)}</span></div>`).join(''); }
const closing = (j, k, def) => esc(ovOf(j, k).close || def);
const NUM_RE = /^(\(\d+\)|\d+(?:\.\d+)+|\d+\.)\s+/;
const numP = (s, c, extra) => { const m = c === 'in' && String(s).match(NUM_RE); return m ? `<p class="inn${extra}"><span class="nb">${m[1]}</span> ${s.slice(m[0].length)}</p>` : `<p class="${c === 'in' && hdoc ? 'inb' : c}${extra}">${s}</p>`; };
const P = (s, c = 'in') => numP(s, c, '');
const PK = (s, c = 'in') => `<p class="${c} kwn">${s}</p>`;
const H = s => { const m = String(s).match(/^(\d+\.)\s*(.*)$/); return `<p class="inh kwn"><b>${m ? `<span class="hn">${m[1]}</span>${m[2]}` : s}</b></p>`; };
let hdoc = false;
const sigRow = (j, k, boxLines, who, extra, boxExtra) => `<div class="sigst"><div class="sgn2">${signer(who, extra)}</div><div class="bx2">${approverBox(j, k, boxLines, boxExtra)}</div></div>`;

function thaiNumify(root) { if (!SET.thaiNum) return; const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while (n = tw.nextNode()) { if (/[0-9]/.test(n.nodeValue) && !n.parentNode.closest('.nothai')) n.nodeValue = toThaiDigits(n.nodeValue); } }

/* แบ่งหน้าอัตโนมัติ: เนื้อหาเกินหน้า → ยกส่วนท้ายขึ้นหน้าใหม่ · ตารางแบ่งข้ามหน้าได้ (ทำหัวตารางซ้ำ)
   หัวข้อไม่ค้างท้ายหน้า · หนังสือบันทึกข้อความใส่ "/คำแรกของหน้าถัดไป..." ท้ายหน้า และ "-๒-" หัวหน้าถัดไป ตามแบบเดิม */
function contWords(t){t=String(t).replace(/\s+/g,' ').trim();let out='';
 try{const seg=new Intl.Segmenter('th',{granularity:'word'});for(const x of seg.segment(t)){if(out.length>=20&&x.isWordLike)break;out+=x.segment;if(out.length>=30)break}}catch(e){out=t.slice(0,20)}
 return out.trim()}
function splitTable(tb,over){const rows=[...tb.rows];if(rows.length<3)return null;
 const t2=tb.cloneNode(false);const cg=tb.querySelector('colgroup');if(cg)t2.appendChild(cg.cloneNode(true));
 const body=document.createElement('tbody');t2.appendChild(body);let i=rows.length-1;
 while(over()&&i>=2){body.insertBefore(rows[i],body.firstChild);i--}
 if(over()||!body.rows.length){const tb2=rows[0].parentNode;[...body.rows].forEach(r=>tb2.appendChild(r));return null}
 body.insertBefore(rows[0].cloneNode(true),body.firstChild);return t2}
function paginate(box){
 [...box.querySelectorAll('.page')].forEach(pg=>{
  const memo=pg.dataset.flow!=='tor';let cur=pg,n=1,guard=0;
  while(cur.scrollHeight>cur.clientHeight+1&&cur.children.length>1&&guard++<20){
   const over=()=>cur.scrollHeight>cur.clientHeight+1,moved=[];
   const nx=document.createElement('div');nx.className='page';nx.dataset.flow=pg.dataset.flow||'';nx.style.paddingTop=memo?'15mm':(pg.style.paddingTop||'');cur.after(nx);
   const take=()=>{while(cur.children.length>1){const l=cur.lastElementChild;if(l.classList.contains('kwn')||l.classList.contains('gap')){moved.unshift(l);l.remove()}else break}};
   while(over()&&cur.children.length>1){const last=cur.lastElementChild;
    if(last.tagName==='TABLE'){const t2=splitTable(last,over);if(t2){moved.unshift(t2);break}}
    moved.unshift(last);last.remove()}
   take();
   if(memo){n++;const f=document.createElement('div');f.className='cont';cur.appendChild(f);
    const label=()=>{const fst=moved.find(m=>m.textContent.trim());f.textContent='/'+(fst?contWords(fst.textContent):'')+'...'};label();
    const take2=()=>{let q;while((q=f.previousElementSibling)&&cur.children.length>2&&(q.classList.contains('kwn')||q.classList.contains('gap'))){moved.unshift(q);q.remove()}};
    while(over()&&cur.children.length>2){const l=f.previousElementSibling;moved.unshift(l);l.remove();take2();label()}
    const no=String(n);nx.innerHTML='<div class="pgno">-'+(SET.thaiNum?toThaiDigits(no):no)+'-</div><div class="gap"></div>'}
   while(moved.length&&moved[0].classList&&moved[0].classList.contains('gap'))moved.shift();
   moved.forEach(m=>nx.appendChild(m));cur=nx}
 });
 box.querySelectorAll('.page').forEach(pg=>pg.classList.add('pinned'))}

function prevMissing(j, k) { const i = DK.indexOf(k); return DK.slice(0, i).filter(x => !(j.docs[x] || {}).no); }
function stepState(j, k) { if ((j.docs[k] || {}).no) return 'done'; return prevMissing(j, k).length ? 'wait' : 'ready'; }
function docSubject(j, k) {
  const box = document.createElement('div'); box.innerHTML = renderPages(j, [k]);
  const s = box.querySelectorAll('.subj')[0];
  return s ? s.children[1].textContent.replace(/\s+/g, ' ').trim() : (DOCS.find(d => d.k === k) || {}).short;
}
async function issueNo(k, btn) {
  const j = cur, d = j.docs[k], info = DOCS.find(x => x.k === k);
  if (d.no) return toast('ฉบับนี้มีเลขแล้ว');
  const miss = prevMissing(j, k);
  if (miss.length) return toast('ต้องออกเลขขั้นที่ ' + miss.map(x => DK.indexOf(x) + 1).join(', ') + ' ก่อน');
  if (info.ext) return toast('หนังสือภายนอก: กรอกเลขจากระบบสารบรรณในช่องเลขที่');
  if (!j.dept) return toast('เลือกแผนกในแท็บข้อมูลงานก่อน');
  if (LOCAL()) return toast('โหมดทดลอง: ยังไม่เชื่อมหลังบ้าน จึงยังออกเลขจริงไม่ได้ (พิมพ์เลขเองในช่องได้)');
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'กำลังเตรียม…';
  try {
    if (!(await settle())) throw new Error('บันทึกงานไม่สำเร็จ — ลองใหม่อีกครั้ง');
    if (!j.id) throw new Error('บันทึกงานก่อนออกเลข');
    let st = null; try { st = JSON.parse(lsr('booknum_settings_v1') || 'null'); } catch (e) {}
    if (!st || !(st.departments || []).length) { st = await bookCall('getSettings', []); if (!st) return; lsr('booknum_settings_v1', JSON.stringify(st)); }
    const code = j.deptCode.replace(/\s/g, '');
    let dept = (st.departments || []).find(x => String(x).replace(/\s/g, '').includes(code));
    if (!dept) { const i = await choose('เลือกแผนกในระบบออกเลขหนังสือ', st.departments || []); if (i < 0) return; dept = st.departments[i]; }
    const recs = st.recorders || [];
    let rec = [lsr('booknum_user_v1'), ME.name].find(x => x && recs.some(r => nm(r) === nm(x)));
    if (rec) rec = recs.find(r => nm(r) === nm(rec));
    else { const i = await choose('ผู้บันทึก (ชื่อในระบบออกเลขหนังสือ)', recs); if (i < 0) return; rec = recs[i]; lsr('booknum_user_v1', rec); }
    const date = d.date || today(), subject = docSubject(j, k);
    const go = await ask('ยืนยันออกเลขหนังสือ', `<div style="line-height:1.5"><b>ขั้นที่ ${DK.indexOf(k) + 1}. ${esc(info.short)}</b><br>เรื่อง: ${esc(subject)}<br>แผนก: ${esc(dept)} · วันที่ ${thDate(date)}<br>ผู้บันทึก: ${esc(rec)}</div><div class="muted" style="margin-top:6px">เลขจะถูกบันทึกในระบบออกเลขหนังสือทันที ยกเลิกภายหลังต้องแก้ที่ระบบออกเลข</div>`, ['ออกเลข', 'ยกเลิก']);
    if (go !== 0) return;
    btn.textContent = 'กำลังขอเลข…';
    let next = ''; try { const n = await bookCall('getNextInfo', ['หนังสือทั่วไป', date]); next = (n && n.nextBookNum) || ''; } catch (e) {}
    const res = await bookCall('saveData', [{ category: 'หนังสือทั่วไป', rowIndex: '', bookNum: next, department: dept, date, recorder: rec, subject,
      detail: 'ออกจากระบบจัดซื้อหม้อแปลง (ธุรกิจเสริม) · ' + j.id, medianPrice: '', paymentDocNum: '', paymentItem: '', paymentAmount: '', payee: '', paymentNote: '', contractor: '', procurement: 'ทั่วไป', startDate: '', endDate: '', orderDate: '', amount: '', retention: '' }]);
    if (!res) return;
    if (res.status !== 'success') throw new Error('ระบบออกเลขหนังสือ: ' + (res.message || 'บันทึกไม่สำเร็จ'));
    const ref = String(res.bookNum || '');
    const m = ref.match(/(\d+)\s*\/\s*\d{4}\s*$/) || ref.match(/(\d+)(?!.*\d)/);
    const no = m ? m[1] : ref;
    const r = await api('setDocNo', { id: j.id, docKey: k, no, date, bookRef: ref });
    j.docs[k].no = no; j.docs[k].date = date; j.docs[k].bookRef = ref; j.rev = r.rev; upsertList(r.summary);
    jobView(); toast('ได้เลขที่ ' + no + (res.changed ? ' (เลขที่ขอไว้มีผู้ใช้ก่อน ระบบให้เลขถัดไป)' : ''));
  } catch (e) { toast(e.message || String(e)); }
  finally { btn.disabled = false; btn.textContent = old; }
}

    const st = n >= 9 ? '<span class="tag ok">ออกเลขครบ 9 ฉบับ</span>' : `<span class="tag w">ขั้นที่ ${n + 1}/9 · ${DOCS[Math.min(n, 8)].short}</span>`;
    return `<div class="card job" data-id="${esc(x.id)}"><div class="ico">⚡</div><div style="flex:1;min-width:0"><div class="t">${esc(x.title || '(ยังไม่ตั้งชื่อ)')}</div>
    <div class="muted">${x.wbs ? esc(x.wbs) + ' · ' : ''}${x.vendor ? esc(x.vendor) + ' · ' : ''}<b style="color:var(--ink)">${money(x.total)}</b> บาท${x.nums ? ' · เลขที่ ' + esc(x.nums) : ''}</div>${st}
    <div class="steps">${DOCS.map((d, i) => `<i class="${i < n ? 'd' : ''}"></i>`).join('')}</div></div><div style="font-size:22px;color:var(--mute)">›</div></div>`; }).join('') ||
    `<div class="card muted" style="text-align:center;padding:30px">${LIST.length ? 'ไม่พบงานที่ค้นหา' : 'ยังไม่มีงาน — กด “＋ งานใหม่” เพื่อเริ่ม'}</div>`}
  <div style="height:80px"></div><button class="fab" id="newBtn">＋ งานใหม่</button>`;
  $('#q').oninput = e => store.set('tfbuy_q', e.target.value); $('#q').onchange = () => listView();
  document.querySelectorAll('.job').forEach(el => el.onclick = () => openJob(el.dataset.id));
  $('#newBtn').onclick = newJob;
  const rt = $('#retry'); if (rt) rt.onclick = () => boot();
  history.replaceState(null, '', location.pathname);
}
async function newJob() {
  const j = blankJob(), last = store.get('tfbuy_last', null);
  setDept(j, 'ผปร.');
  if (last) ['head', 'officer', 'mgr', 'priceCm', 'buyCm', 'inspCm'].forEach(k => { if (last[k]) j[k] = JSON.parse(JSON.stringify(last[k])); });
  busy(true);
  try { const r = await api('save', { job: j }); j.id = r.job.id; j.rev = r.rev; upsertList(r.summary); cur = j; tab = 'info'; setSave('ok'); jobView(); history.replaceState(null, '', '?id=' + j.id); }
  catch (e) { toast('สร้างงานไม่สำเร็จ: ' + e.message); }
  finally { busy(false); }
}
async function openJob(id) {
  busy(true);
  try { const r = await api('get', { id }); cur = fixJob(r.job); learnJob(cur); tab = 'info'; dirty = false; setSave('ok'); jobView(); history.replaceState(null, '', '?id=' + id); $('#main').scrollTop = 0; }
  catch (e) { toast('เปิดงานไม่สำเร็จ: ' + e.message); }
  finally { busy(false); }
}
async function backToList() { if (cur && !(await settle())) { const k = await ask('ยังบันทึกไม่สำเร็จ', 'ออกไปตอนนี้ สิ่งที่แก้ล่าสุดอาจหาย', ['อยู่ต่อ', 'ออกเลย']); if (k === 0) return; } dirty = false; editing = false; $('#app').classList.remove('editing'); listView(); }
async function delJob() {
  if (!cur) return;
  const why = await askText('ลบงานนี้', `ลบ “${esc(jobTitle(cur))}” — เลขหนังสือที่ออกไปแล้วจะไม่ถูกยกเลิกในระบบออกเลข`, 'เหตุผลที่ลบ (จำเป็น)');
  if (!why) return;
  try { await api('remove', { id: cur.id, reason: why }); LIST = LIST.filter(x => x.id !== cur.id); dirty = false; toast('ลบงานแล้ว'); listView(); }
  catch (e) { toast(e.message); }
}
function busy(on) { $('#busy').style.display = on ? 'flex' : 'none'; }

/* ---------------- ตั้งค่า ---------------- */
function settingsView() {
  if (cur) { settle(); } cur = null; setTop('ตั้งค่า', ME.admin ? 'ผู้ดูแลแก้ไขค่ากลางได้' : 'ดูค่ากลาง (แก้ได้เฉพาะผู้ดูแล)', true);
  const S = JSON.parse(JSON.stringify(SET)), ro = ME.admin ? '' : 'disabled';
  const f = (k, l, ta) => ta ? `<label class="f"><span>${l}</span><textarea data-s="${k}" rows="3" ${ro}>${esc(S[k])}</textarea></label>` : `<label class="f"><span>${l}</span><input data-s="${k}" value="${esc(S[k])}" ${ro}></label>`;
  $('#view').innerHTML = `<div class="card"><h3>ผู้ใช้</h3><div>${esc(ME.name || '-')} ${ME.admin ? '<span class="tag">ผู้ดูแล</span>' : ''}</div><label class="muted"><input type="checkbox" id="tn2" ${SET.thaiNum ? 'checked' : ''}> พิมพ์เอกสารเป็นเลขไทย (เฉพาะเครื่องนี้)</label></div>
  <div class="card"><h3>หน่วยงาน & เลขหนังสือ</h3><div class="row">${f('office', 'ชื่อย่อหน่วยงาน')}${f('officeFull', 'ชื่อเต็ม')}</div><div class="row">${f('bookPrefix', 'คำนำหน้าเลขหนังสือภายใน')}${f('extPrefix', 'คำนำหน้าเลขหนังสือภายนอก')}</div>
  <div class="row">${f('addr1', 'ที่อยู่ บรรทัด 1')}${f('addr2', 'ที่อยู่ บรรทัด 2')}${f('phone', 'โทรศัพท์')}</div></div>
  <div class="card"><h3>ระเบียบที่อ้างถึง</h3>${f('reg1', 'ข้อบังคับ', 1)}${f('reg2', 'ระเบียบ', 1)}${f('manual', 'เหตุผลวิธีเฉพาะเจาะจง (รายงานขอซื้อ ข้อ 6)', 1)}</div>
  <div class="card"><h3>ผู้จัดการเริ่มต้น</h3><div class="row"><label class="f"><span>ชื่อ-สกุล</span><input data-ap="name" list="staff" value="${esc(S.mgr.name)}" ${ro}></label><label class="f"><span>ตำแหน่ง</span><input data-ap="pos" value="${esc(S.mgr.pos)}" ${ro}></label></div></div>
  ${ME.admin ? `<button class="btn p" id="saveSet" style="width:100%;margin-bottom:12px">บันทึกตั้งค่า</button>` : ''}
  <div class="card"><h3>การเชื่อมต่อ</h3><div class="muted">หลังบ้าน: ${LOCAL() ? '<b style="color:#c27a00">ยังไม่เชื่อม (โหมดทดลอง)</b>' : 'เชื่อมแล้ว'} · ระบบออกเลขหนังสือ: ${lsr('booknum_token_v1') ? 'เชื่อมแล้วในเครื่องนี้' : 'จะถามรหัสสำนักงานตอนออกเลขครั้งแรก'} · รายชื่อพนักงาน ${STAFF.length} คน</div>
  ${ME.admin || LOCAL() ? `<label class="f"><span>ลิงก์หลังบ้าน (Web app …/exec) — ใช้เฉพาะเครื่องนี้ เว้นว่าง = ใช้ค่าในระบบ</span><input id="apiUrl" value="${esc(lsr('tfbuy_api') || '')}" placeholder="${esc(API_DEFAULT || 'https://script.google.com/macros/s/…/exec')}"></label><button class="btn sm" id="saveApi">ใช้ลิงก์นี้</button>` : ''}
  <button class="btn sm" id="reStaff">โหลดรายชื่อพนักงานใหม่</button> <button class="btn sm" id="reBook">ล้างการเชื่อมระบบออกเลข</button></div>`;
  $('#tn2').onchange = e => { SET.thaiNum = e.target.checked; store.set('tfbuy_thainum', SET.thaiNum); };
  document.querySelectorAll('[data-s]').forEach(el => el.oninput = () => { S[el.dataset.s] = el.value; });
  document.querySelectorAll('[data-ap]').forEach(el => el.oninput = () => { S.mgr[el.dataset.ap] = el.value; });
  const ss = $('#saveSet'); if (ss) ss.onclick = async () => { delete S.thaiNum; try { const r = await api('saveSettings', { settings: S }); applySettings(r.settings); toast('บันทึกตั้งค่าแล้ว'); } catch (e) { toast(e.message); } };
  const sa = $('#saveApi'); if (sa) sa.onclick = () => { const val = $('#apiUrl').value.trim(); if (val && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(val)) return toast('ลิงก์ต้องเป็น https://script.google.com/macros/s/…/exec'); lsr('tfbuy_api', val || null); boot(); };
  $('#reStaff').onclick = () => { loadStaff(true).then(() => { toast('รายชื่อพนักงาน ' + STAFF.length + ' คน'); }); };
  $('#reBook').onclick = () => { lsr('booknum_token_v1', null); lsr('booknum_settings_v1', null); toast('ล้างแล้ว — ออกเลขครั้งถัดไปจะถามรหัสสำนักงาน'); settingsView(); };
}
function applySettings(s) { const tn = SET.thaiNum; SET = Object.assign({}, DEFSET, s || {}); SET.thaiNum = tn; DEPTS = SET.depts; store.set('tfbuy_settings', Object.assign({}, SET, { thaiNum: undefined })); }

/* ---------------- เริ่มต้น ---------------- */
async function boot() {
  ME.name = cred().user;
  loadErr = ''; busy(true);
  try { const r = await api('bootstrap'); ME = r.me || ME; applySettings(r.settings); LIST = r.jobs || []; store.set('tfbuy_list_cache', LIST); }
  catch (e) { LIST = store.get('tfbuy_list_cache', []); loadErr = 'โหลดรายการงานไม่สำเร็จ: ' + e.message; }
  finally { busy(false); }
  const id = new URLSearchParams(location.search).get('id');
  if (id && !loadErr) openJob(id); else listView();
}
fillStaff();
$('#backBtn').onclick = backToList; $('#setBtn').onclick = settingsView; $('#delBtn').onclick = delJob;
document.addEventListener('click', e => { if (e.target && e.target.id === 'saveSt' && saveState === 'err') { dirty = true; flush(); } });
document.querySelectorAll('.bnav button').forEach(b => b.onclick = () => { tab = b.dataset.t; jobView(); $('#main').scrollTop = 0; });
addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (cur) drawSheets(); }, 200); });
document.fonts && document.fonts.ready.then(() => { if (cur) drawSheets(); });
(function wait(n) { if (cred().user || LOCAL() || n > 600) { boot(); loadStaff(); } else setTimeout(() => wait(n + 1), 500); })(0);

</script>
</body>
