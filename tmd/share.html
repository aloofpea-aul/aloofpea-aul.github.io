<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แชร์ประกาศเตือนภัย</title>
<meta name="theme-color" content="#0E4A6E">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F6F8;color:#17212B;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.st{font-size:14px;color:#5A6670;text-align:center}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #DCE3E9}
.hd{padding:14px;color:#fff}
.hd .a{font-size:12px;opacity:.85}.hd .b{font-weight:700;font-size:17px;line-height:1.4}
.bd{padding:12px 14px;font-size:14px;line-height:1.6;color:#4A4450}
.bd .w{font-weight:700;color:#1E1A22;font-size:15px}
.btn{display:block;width:100%;height:52px;border:0;border-radius:14px;background:#06C755;color:#fff;font-size:17px;font-weight:700;font-family:inherit}
.btn2{background:#fff;color:#17212B;border:1px solid #DCE3E9;height:46px;font-size:15px;font-weight:600}
.err{color:#8A2B2B;background:#FBE3E1;border-radius:12px;padding:12px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="st" id="st">กำลังโหลดประกาศ…</div>
  <div id="preview"></div>
  <button class="btn" id="share" style="display:none">แชร์เข้ากลุ่ม / แชท LINE</button>
  <button class="btn btn2" id="close" style="display:none">ปิด</button>
  <div class="err" id="err"></div>
  <div id="dbg" style="font-size:11px;color:#8A949C;text-align:center;word-break:break-all"></div>
</div>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';
  var LIFF_ID = '2012182540-CRgflPne';
  var API = 'https://script.google.com/macros/s/AKfycbyF7Am81Ut4aUbzTbACUFpJhIQ2q3iKiiTxoLM8IoGvANQ8NQpaM5BvokCeyOWiAqrwNA/exec';
  var PAGE = 'https://aloofpea-aul.github.io/tmd/';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var key = new URLSearchParams(location.search).get('k') || '';
  var msg = null;

  function fail(t) { $('st').style.display = 'none'; var e = $('err'); e.textContent = t; e.style.display = 'block'; $('close').style.display = 'block'; }

  /* การ์ดเดียวกับที่บอทส่ง (ไม่มีปุ่มแชร์ซ้ำ) */
  function bubble(d) {
    var color = d.severity === 'สูง' ? '#8A2B2B' : d.severity === 'กลาง' ? '#B4570B' : '#455A64';
    var where = d.focus === 'กระบี่' ? 'กระบี่ อยู่ในพื้นที่ได้รับผลกระทบ' : d.focus === 'ภาคใต้' ? 'ภาคใต้ได้รับผลกระทบ (ไม่ระบุกระบี่)' : '';
    var desc = String(d.description || '');
    var lines = [where || d.title].concat(d.krabiDetail ? String(d.krabiDetail).split('\n') : [])
      .concat([[d.issueNo, d.announceTime].filter(Boolean).join(' · '), desc.length > 250 ? desc.slice(0, 250) + '…' : desc])
      .filter(Boolean);
    var body = lines.map(function (t, i) {
      return { type: 'text', text: String(t), wrap: true, size: i === 0 ? 'md' : 'sm', weight: i === 0 ? 'bold' : 'regular', color: i === 0 ? '#1E1A22' : '#4A4450' };
    });
    var btn = [];
    if (d.pdfUrl) btn.push({ type: 'button', style: 'primary', color: color, height: 'sm', action: { type: 'uri', label: 'เปิดประกาศ', uri: d.pdfUrl } });
    btn.push({ type: 'button', style: 'secondary', height: 'sm', action: { type: 'uri', label: 'ค้นหาทั้งหมด', uri: PAGE } });
    return {
      preview: { color: color, title: d.title, lines: lines },
      flex: { type: 'flex', altText: 'เตือนภัย: ' + d.title, contents: {
        type: 'bubble', size: 'kilo',
        header: { type: 'box', layout: 'vertical', backgroundColor: color, paddingAll: '12px', contents: [
          { type: 'text', text: 'ประกาศกรมอุตุนิยมวิทยา', size: 'xs', color: '#FFFFFFCC' },
          { type: 'text', text: d.title, size: 'lg', weight: 'bold', color: '#FFFFFF', wrap: true }] },
        body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: body },
        footer: { type: 'box', layout: 'horizontal', spacing: 'sm', contents: btn } } }
    };
  }

  function render(p) {
    $('preview').innerHTML = '<div class="card"><div class="hd" style="background:' + p.color + '"><div class="a">ประกาศกรมอุตุนิยมวิทยา</div><div class="b">' + esc(p.title) + '</div></div>' +
      '<div class="bd">' + p.lines.map(function (l, i) { return '<div' + (i === 0 ? ' class="w"' : '') + '>' + esc(l) + '</div>'; }).join('') + '</div></div>';
  }

  function share() {
    var info = 'inClient=' + liff.isInClient() + ' · OS=' + liff.getOS() + ' · LINE=' + (liff.getLineVersion() || '-') + ' · LIFF=' + liff.getVersion() + ' · stp=' + liff.isApiAvailable('shareTargetPicker');
    $('dbg').textContent = info;
    liff.shareTargetPicker([msg.flex], { isMultiple: true }).then(function (res) {
      if (res) { $('st').textContent = 'แชร์แล้ว ✓'; $('st').style.display = 'block'; setTimeout(function () { try { liff.closeWindow(); } catch (e) {} }, 800); }
    }).catch(function (e) { fail('แชร์ไม่สำเร็จ: ' + (e && (e.code ? e.code + ' — ' : '') + (e.message || e))); });
  }

  function load() {
    var q = key ? '?action=list&limit=300' : '?action=latest&focus=' + encodeURIComponent('ภาคใต้');
    return fetch(API + q).then(function (r) { return r.json(); }).then(function (r) {
      var d = (r.data || []).filter(function (x) { return !key || x.key === key; })[0];
      if (!d) throw new Error('ไม่พบประกาศ');
      return d;
    });
  }

  Promise.all([liff.init({ liffId: LIFF_ID }), load()]).then(function (v) {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    msg = bubble(v[1]); render(msg.preview);
    $('st').textContent = 'เลือกกลุ่มหรือแชทที่จะส่งต่อ';
    $('share').style.display = 'block'; $('close').style.display = 'block';
    $('share').onclick = share;
    share();   // เปิดหน้าเลือกแชททันที
  }).catch(function (e) { fail('โหลดไม่สำเร็จ: ' + (e && e.message || e)); });

  $('close').onclick = function () { try { liff.closeWindow(); } catch (e) { history.back(); } };
})();
</script>
</body>
</html>
