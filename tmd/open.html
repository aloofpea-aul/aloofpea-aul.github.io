<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เปิดประกาศเตือนภัย</title>
<meta name="theme-color" content="#0E4A6E">
<link rel="icon" href="/icon-192.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F6F8;color:#17212B;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;padding:24px;text-align:center}
.box{max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center}
.sp{width:36px;height:36px;border:4px solid #DCE3E9;border-top-color:#0E4A6E;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.t{font-size:16px;line-height:1.6}.m{font-size:13px;color:#5A6670}
a.b{display:block;width:100%;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid #DCE3E9;color:#17212B;background:#fff}
a.p{background:#0E4A6E;color:#fff;border-color:#0E4A6E}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="sp" id="sp"></div>
  <div class="t" id="t">กำลังเปิดประกาศจากกรมอุตุนิยมวิทยา…</div>
  <div class="m" id="m"></div>
  <a class="b p hide" id="a1" href="#">เปิดจากกรมอุตุฯ</a>
  <a class="b hide" id="a2" href="#">เปิดสำเนาสำรอง (Google Drive)</a>
</div>
<script>
/* เปิด PDF ประกาศ: ใช้ของกรมอุตุฯ เป็นหลัก — ถ้าเว็บกรมอุตุฯ ไม่ตอบภายใน 4 วินาที ให้เปิดสำเนาใน Google Drive แทน
   ใช้: open.html?t=<ลิงก์ PDF กรมอุตุฯ>&d=<ลิงก์ Google Drive> */
(function () {
  'use strict';
  var p = new URLSearchParams(location.search);
  var ok = function (u) { return /^https:\/\/(www\.)?(tmd\.go\.th|drive\.google\.com)\//.test(u || '') ? u : ''; };
  var tmd = ok(p.get('t')), drv = ok(p.get('d'));
  var $ = function (id) { return document.getElementById(id); };
  var gone = false;
  function go(u) { if (gone || !u) return; gone = true; location.replace(u); }
  function backup(reason) {
    if (gone) return;
    if (drv) { $('t').textContent = 'เว็บกรมอุตุฯ ' + reason + ' — เปิดสำเนาสำรองแทน'; setTimeout(function () { go(drv); }, 600); }
    else { $('sp').classList.add('hide'); $('t').textContent = 'เว็บกรมอุตุฯ ' + reason; $('m').textContent = 'ฉบับนี้ยังไม่มีสำเนาสำรอง ลองใหม่อีกครั้งภายหลัง'; showLinks(); }
  }
  function showLinks() {
    if (tmd) { $('a1').href = tmd; $('a1').classList.remove('hide'); }
    if (drv) { $('a2').href = drv; $('a2').classList.remove('hide'); }
  }
  setTimeout(showLinks, 6000);   // ถ้ายังค้าง ให้กดเองได้

  if (!tmd) return drv ? go(drv) : ($('t').textContent = 'ไม่พบลิงก์ประกาศ');
  if (!navigator.onLine) return backup('ติดต่อไม่ได้ (ไม่มีอินเทอร์เน็ต)');

  var timer = setTimeout(function () { backup('ไม่ตอบสนอง'); }, 4000);
  fetch(tmd, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
    .then(function () { clearTimeout(timer); go(tmd); })
    .catch(function () { clearTimeout(timer); backup('ติดต่อไม่ได้'); });
})();
</script>
</body>
</html>
