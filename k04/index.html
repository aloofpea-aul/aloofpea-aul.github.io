<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/pea-hub.js?v=2026110201" data-app="k04" data-gate="off" data-name="แผนปฏิบัติการ K04"></script>
<title>K04 แผนปฏิบัติการ 2569 · กฟส.อ่าวลึก</title>
<meta name="theme-color" content="#6a1b9a">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6b6f76;--muted:#9a9ea6;--line:#e6e8eb;
--pea:#6a1b9a;--pea-bg:#f3e8fa;--ok:#1e7d45;--ok-bg:#e5f5ec;--low:#9a5b00;--low-bg:#fff2dc;
--na:#5f636b;--na-bg:#eef0f2;--mine:#1557b0;--mine-bg:#e6effc;--bad:#b3261e;--bad-bg:#fde8e7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--pea);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.hback{color:#fff;text-decoration:none;font-size:24px;line-height:1;padding:0 6px 0 0}
.top h1{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.top .sync{font-size:12px;opacity:.85}
.iconbtn{background:none;border:0;color:inherit;font-size:20px;padding:4px 6px;cursor:pointer;line-height:1}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
select.office{font:inherit;font-size:14px;border:0;border-radius:16px;padding:4px 10px;background:#fff;color:var(--pea);max-width:60%}
.qchip{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:14px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.qchip.on{background:#fff;color:var(--pea);border-color:#fff}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.big{font-size:28px;font-weight:600}
.small{font-size:12.5px;color:var(--sub)}
.muted{color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat{border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:18px;font-weight:600}
.stat span{font-size:11.5px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;white-space:nowrap;font-weight:500}
.ok{background:var(--ok-bg);color:var(--ok)}.low{background:var(--low-bg);color:var(--low)}
.na,.none{background:var(--na-bg);color:var(--na)}.pending{background:var(--na-bg);color:var(--na)}
.mine{background:var(--mine-bg);color:var(--mine)}.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.sec{font-size:13px;color:var(--sub);margin:14px 4px 6px;font-weight:500}
.search{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.q{width:100%;border-collapse:collapse;font-size:14px}
table.q th{font-weight:500;color:var(--sub);font-size:12.5px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.q td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q tr.cur td{background:#faf6fd}
.cmp{display:grid;grid-template-columns:92px 1fr 54px;gap:5px 8px;align-items:center;font-size:13px}
.cmp .b{height:8px;border-radius:4px;background:#c9b3dc}
.cmp .b.me{background:var(--pea)}
.btn{display:block;width:100%;font:inherit;font-weight:500;border-radius:12px;padding:11px;border:1px solid var(--line);background:#fff;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--pea);border-color:var(--pea);color:#fff}
.btn.danger{color:var(--bad)}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input.f,textarea.f{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input.f{font-size:20px}
.err{color:var(--bad);font-size:13px;margin-top:4px;min-height:18px}
.note{font-size:12.5px;border-radius:10px;padding:8px 10px;margin-top:8px}
.back{display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px;margin:2px 0 6px;cursor:pointer}
.desc{font-size:13.5px;color:var(--sub);margin:4px 0 0;padding-left:0;list-style:none}
.desc li{margin:2px 0}
.loading{text-align:center;color:var(--sub);padding:40px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.92}
</style>
</head>
<body>
<div class="top">
  <h1><a class="hback" href="/index.html" aria-label="กลับศูนย์รวมงาน">‹</a><span style="flex:1">K04 แผนปฏิบัติการ 2569</span>
    <button class="iconbtn" id="btnSync" aria-label="ซิงค์จากต้นฉบับ" title="ซิงค์จากต้นฉบับ">⟳</button></h1>
  <div class="sync" id="syncText">กำลังโหลด…</div>
  <div class="bar">
    <select class="office" id="office" aria-label="เลือก กฟฟ."></select>
    <span id="qchips"></span>
  </div>
</div>
<main id="app"><div class="loading">กำลังโหลดข้อมูล…</div></main>
<div class="toast" id="toast"></div>

<script>
/* URL ของ Web app หลังบ้าน (k04/gas/Code.gs) — ใส่ครั้งเดียวที่นี่ หรือเปิดหน้านี้ด้วย ?api=URL */
var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbzPHT_oHJEDbCXQAIswkwOeSEWtSYuMb1xtG3KdgVYIJuzFJ_9qbVHqw8myYG9rtbpHiQ/exec';
(function(){ var p=new URLSearchParams(location.search); if(p.get('api')){ try{localStorage.setItem('k04_api',p.get('api'));}catch(e){} p.delete('api');
  try{history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''));}catch(e){} } })();
var API = DEFAULT_API || (function(){try{return localStorage.getItem('k04_api')||'';}catch(e){return '';}})();
function apiGet(){ return fetch(API+'?action=data').then(function(r){return r.json();}).then(function(r){ if(r&&r.error) throw new Error(r.error); return r; }); }
function apiPost(body){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){return r.json();}).then(function(r){ if(r&&r.error) throw new Error(r.error); return r; }); }
function myName(){ try{return localStorage.getItem('pea_aoluek_username')||'';}catch(e){return '';} }

var D = null, OV = {}, ST = { office: '', q: 3, view: 'home', sheet: null, act: null, filter: 'all', search: '', showAll: false };
var LS_KEY = 'k04_aoluek_cache_v1', LS_PREF = 'k04_aoluek_pref_v1';
var QN = ['Q1', 'Q2', 'Q3', 'Q4'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sameNum(a,b){ var x=num(a), y=num(b); return (x===null||y===null) ? String(a||'').trim()===String(b||'').trim() : Math.abs(x-y)<1e-9; }
function pendingKeys(){ return Object.keys(OV).filter(function(k){ var o=OV[k]; return o && o.value!=='' && o.push!=='ส่งแล้ว' && o.push!=='คงต้นฉบับ'; }); }
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n;}
function blank(v){v=String(v==null?'':v).trim();return v===''||v==='-'||v==='–';}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function fmtDate(iso){if(!iso)return '—';var d=new Date(isNaN(iso)?iso:Number(iso));if(isNaN(d))return iso;
  return d.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}

/* ---------- โหลดข้อมูล ---------- */
function load(){
  var cached = lsGet(LS_KEY), pref = lsGet(LS_PREF) || {};
  if (pref.office) ST.office = pref.office;
  if (cached) { setData(cached, true); }
  if (!API) { document.getElementById('app').innerHTML='<div class="card">ยังไม่ได้ตั้งค่า URL หลังบ้าน<br><span class="small">เปิดหน้านี้ด้วย ?api=URL ของ Web app ครั้งเดียว</span></div>'; return; }
  apiGet().then(function(d){ lsSet(LS_KEY,d); setData(d,false); })
    .catch(function(e){ if(!D) document.getElementById('app').innerHTML='<div class="card bad">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</div>'; else toast('ออฟไลน์ — แสดงข้อมูลที่เก็บไว้'); });
}
function setData(d, fromCache){
  var first = !D; D = d; OV = d.overrides || {};
  if (!ST.office || D.offices.indexOf(ST.office) < 0) ST.office = D.offices.indexOf(D.defaultOffice) >= 0 ? D.defaultOffice : D.offices[0];
  if (first) ST.q = latestQuarter();
  document.getElementById('syncText').textContent = 'ข้อมูลต้นฉบับ ณ ' + fmtDate(D.srcUpdated) + ' · ซิงค์ ' + fmtDate(D.lastSync) + (fromCache ? ' · กำลังอัปเดต…' : '');
  var sel = document.getElementById('office');
  sel.innerHTML = D.offices.map(function(o){return '<option'+(o===ST.office?' selected':'')+'>'+esc(o)+'</option>';}).join('');
  renderQ(); render();
}
function latestQuarter(){
  var best = 1;
  D.sheets.forEach(function(s){s.activities.forEach(function(a){a.rows.forEach(function(r){
    if (r.scope !== 'office') return;
    r.q.forEach(function(q,i){ if(!blank(q.r) && i+1>best) best=i+1; });
  });});});
  return best;
}

/* ---------- ตรรกะสถานะ ---------- */
function ovKey(act, row, qi){ return act.key + '|' + row.office + '|' + (row.gk||'') + '|Q' + (qi+1); }
function cellInfo(act, row, qi){
  var q = row.q[qi];
  var o = row.scope === 'office' ? OV[ovKey(act, row, qi)] : null;
  var info = { t:q.t, r:q.r, score:q.score, full:q.full, note:q.note, mine:false, conflict:false, status:'none' };
  if (o && o.push === 'ส่งแล้ว' && sameNum(o.value, q.r)) o = null;   // ส่งต้นฉบับแล้วและซิงค์กลับมาตรงกัน = ใช้ค่าต้นฉบับตามปกติ
  if (o) {
    info.mine = true; info.r = o.value; info.ov = o;
    info.conflict = String(o.srcAtEdit||'') !== String(q.r||'');
    info.status = 'mine';
    return info;
  }
  if (blank(q.t) && blank(q.r)) { info.status = 'none'; return info; }
  if (blank(q.r)) { info.status = blank(q.t) ? 'none' : 'pending'; return info; }
  var s = num(q.score), f = num(q.full);
  if (s !== null && f !== null && f > 0) info.status = s + 1e-9 >= f ? 'ok' : 'low';
  else info.status = 'ok';
  return info;
}
function rowsFor(act){
  var mine = act.rows.filter(function(r){return r.scope==='office' && r.office===ST.office;});
  if (mine.length) return { rows: mine, level: 'office' };
  var prov = act.rows.filter(function(r){return r.scope==='province';});
  if (prov.length) return { rows: prov, level: 'province' };
  return { rows: act.rows.filter(function(r){return r.scope==='all';}), level: 'all' };
}
function actStatus(act, qi){
  var rf = rowsFor(act);
  if (!rf.rows.length) return { status:'none', level:rf.level };
  var order = { mine:5, low:4, pending:3, ok:2, none:1 }, best = 'none', info = null;
  rf.rows.forEach(function(r){ var i = cellInfo(act, r, qi); if (order[i.status] > order[best]) { best = i.status; info = i; } });
  return { status: best, level: rf.level, info: info || cellInfo(act, rf.rows[0], qi) };
}
var LABEL = { ok:'ผ่าน', low:'ต่ำกว่าเป้า', pending:'ยังไม่รายงาน', none:'ไม่มีเป้ารอบนี้', mine:'แก้โดยเรา' };
function chip(st, text){ return '<span class="chip '+st+'">'+esc(text||LABEL[st])+'</span>'; }
function relevant(act){ return ST.showAll || rowsFor(act).level !== 'all'; }

/* ---------- หน้าจอ ---------- */
function renderQ(){
  document.getElementById('qchips').innerHTML = QN.map(function(q,i){
    return '<button class="qchip'+(ST.q===i+1?' on':'')+'" onclick="setQ('+(i+1)+')">'+q+'</button>';}).join(' ');
}
function setQ(q){ ST.q=q; renderQ(); render(); }
function go(view, sheet, act, push, ri){
  ST.view=view; ST.sheet=sheet; ST.act=act; ST.ri=ri;
  if (push!==false) history.pushState({view:view,sheet:sheet,act:act,ri:ri},'');
  render(); window.scrollTo(0,0);
}
window.onpopstate = function(e){ var s=e.state||{view:'home'}; ST.view=s.view; ST.sheet=s.sheet; ST.act=s.act; ST.ri=s.ri; render(); };

function render(){
  if (!D) return;
  var el = document.getElementById('app');
  if (ST.view==='list') el.innerHTML = viewList();
  else if (ST.view==='detail') el.innerHTML = viewDetail();
  else if (ST.view==='edit') el.innerHTML = viewEdit();
  else if (ST.view==='push') el.innerHTML = viewPush();
  else el.innerHTML = viewHome();
}
function openSheet(si){ go('list', D.sheets[si].name, null); }
function openAct(si, ai, view, ri){ var s=D.sheets[si]; go(view, s.name, s.activities[ai].key, true, ri); }
function findSheet(n){ return D.sheets.filter(function(s){return s.name===n;})[0]; }
function findAct(s,k){ return s && s.activities.filter(function(a){return a.key===k;})[0]; }
function countFor(s, qi){
  var c = { ok:0, low:0, pending:0, mine:0, none:0, total:0 };
  s.activities.forEach(function(a){ if (!relevant(a) || a.flag==='ยกเลิก') return; var st=actStatus(a,qi).status; c[st]++; c.total++; });
  return c;
}

function viewHome(){
  var qi = ST.q-1, h = '';
  var pk = pendingKeys();
  if (pk.length) {
    var last = pk.map(function(k){return OV[k].at||'';}).sort().pop();
    h += '<div class="card" style="background:var(--mine-bg);border-color:#c9dbf5"><div style="font-weight:600;color:var(--mine)">☁︎ ค่าของเรารอส่งต้นฉบับ '+pk.length+' รายการ</div>'+
      '<div class="small">บันทึกล่าสุด '+esc(last)+'</div>'+
      '<button class="btn primary" onclick="PUSH={step:\'pin\'};go(\'push\')">ตรวจก่อนส่งต้นฉบับ</button>'+
      '<div class="small" style="margin-top:6px">ระบบจะอ่านต้นฉบับสดๆ ตอนตรวจ ยังไม่เขียนอะไรจนกว่าจะกดยืนยัน</div></div>';
  }
  var sm = D.summary;
  if (sm && sm.total) {
    var col = Math.min(qi, 3), label = (sm.header[col]||'').replace('ไตรมาส','Q');
    var val = sm.total[col];
    h += '<div class="card"><div class="small">ความสำเร็จภาพรวม กฟจ.กระบี่ และสังกัด (สะสม '+esc(label)+')</div>';
    h += '<div class="big">'+(blank(val)?'<span class="muted">ยังไม่ประเมิน</span>':esc(val)+'%')+'</div>';
    h += '<div class="small" style="margin-top:4px">'+sm.items.map(function(it){return esc(it.code)+' '+(blank(it.q[col])?'—':esc(it.q[col]));}).join(' · ')+'</div></div>';
  }
  var tot = { ok:0, low:0, pending:0, mine:0 };
  D.sheets.forEach(function(s){ var c=countFor(s,qi); tot.ok+=c.ok; tot.low+=c.low; tot.pending+=c.pending; tot.mine+=c.mine; });
  h += '<div class="card"><div class="small">'+esc(ST.office)+' · '+QN[qi]+'</div><div class="grid4">';
  ['low','pending','ok','mine'].forEach(function(k){
    h += '<div class="stat '+k+'" onclick="ST.filter=\''+k+'\';go(\'list\',null,null)"><b>'+tot[k]+'</b><span>'+LABEL[k]+'</span></div>';
  });
  h += '</div></div>';
  h += '<div class="sec">มุมมอง BSC</div><div class="card">';
  D.sheets.forEach(function(s){
    var c = countFor(s, qi);
    var badge = c.low ? chip('low', c.low+' ต่ำกว่าเป้า') : (c.pending ? chip('pending', c.pending+' รอรายงาน') : (c.total ? chip('ok','ครบ') : chip('none','ระดับเขต/จังหวัด')));
    h += '<div class="row" onclick="ST.filter=\'all\';openSheet('+D.sheets.indexOf(s)+')"><div class="t"><div>'+esc(s.name)+'</div><div class="small">'+c.total+' กิจกรรมที่เกี่ยวข้อง</div></div>'+badge+' ›</div>';
  });
  h += '</div>';
  if (D.report && D.report.length) {
    h += '<div class="sec">สถานะการรายงานผล (%)</div><div class="card"><table class="q"><tr><th>ด้าน</th>'+['Q1','Q1-2','Q1-3','Q1-4'].map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
    D.report.forEach(function(r){ h += '<tr><td>'+esc(r.code||'ภาพรวม')+'</td>'+r.q.map(function(v){return '<td>'+(blank(v)?'—':esc(v))+'</td>';}).join('')+'</tr>'; });
    h += '</table></div>';
  }
  h += '<label class="small" style="display:flex;gap:6px;align-items:center;margin:8px 4px"><input type="checkbox" '+(ST.showAll?'checked':'')+' onchange="ST.showAll=this.checked;render()"> นับรวมกิจกรรมระดับเขตที่ไม่มีแถว กฟฟ.</label>';
  return h;
}

function viewList(){
  var qi = ST.q-1, sheets = ST.sheet ? [findSheet(ST.sheet)] : D.sheets, h = '';
  h += '<div class="back" onclick="history.back()">‹ '+esc(ST.sheet || 'ทุกด้าน')+'</div>';
  h += '<input class="search" placeholder="ค้นหา เช่น WMS, SAIFI, 1.2.3" value="'+esc(ST.search)+'" oninput="ST.search=this.value;document.getElementById(\'lst\').innerHTML=listBody()">';
  h += '<div class="filters">'+[['all','ทั้งหมด'],['low','ต่ำกว่าเป้า'],['pending','ยังไม่รายงาน'],['ok','ผ่าน'],['mine','แก้โดยเรา']].map(function(f){
    return '<button class="'+(ST.filter===f[0]?'on':'')+'" onclick="ST.filter=\''+f[0]+'\';render()">'+f[1]+'</button>';}).join('')+'</div>';
  h += '<div id="lst">'+listBody()+'</div>';
  return h;
}
function listBody(){
  var term = ST.search.trim().toLowerCase();
  var qi = ST.q-1, sheets = ST.sheet && !term ? [findSheet(ST.sheet)] : D.sheets, h = '', n = 0;   // ค้นหา = ค้นทุกด้าน
  sheets.forEach(function(s){
    var plan = null, block = '';
    s.activities.forEach(function(a){
      if (!relevant(a)) return;
      var st = actStatus(a, qi);
      if (ST.filter !== 'all' && st.status !== ST.filter) return;
      if (term && (a.code+' '+a.title+' '+a.plan+' '+a.desc.join(' ')).toLowerCase().indexOf(term) < 0) return;
      if (a.plan !== plan) { plan = a.plan; block += '</div><div class="sec">'+esc(plan||s.name)+'</div><div class="card">'; }
      var i = st.info || {}, unit = (rowsFor(a).rows[0]||{}).unit || '';
      var line = blank(i.t) && blank(i.r) ? 'ไม่มีเป้ารอบ '+QN[qi] : QN[qi]+' ผล '+(blank(i.r)?'—':esc(i.r))+' / เป้า '+(blank(i.t)?'—':esc(i.t))+' '+esc(unit);
      var lvl = st.level==='province' ? ' · ระดับจังหวัด' : (st.level==='all' ? ' · ระดับเขต' : '');

  return n ? h : '<div class="card muted">ไม่พบกิจกรรมตามเงื่อนไข</div>';
}

    vals.sort(function(x,y){return (y.v==null?-1e18:y.v)-(x.v==null?-1e18:x.v);});

    vals.forEach(function(x){

    extra.forEach(function(r){ h += '<tr><td style="max-width:120px">'+esc(r.label)+'</td>'+r.q.map(function(q){return '<td>'+(blank(q.t)?'—':esc(q.t))+(blank(q.r)?'':'<br><span class="small">ผล '+esc(q.r)+'</span>')+'</td>';}).join('')+'</tr>'; });
    h += '</table></div>';

function sessionPin(){ try{return sessionStorage.getItem('k04pin')||'';}catch(e){return '';} }
function hint(){
  var el=document.getElementById('v'); if(!el) return;
  var s=findSheet(ST.sheet), a=findAct(s,ST.act), r=a.rows[ST.ri], q=r.q[ST.q-1];

function save(){
  var s=findSheet(ST.sheet), a=findAct(s,ST.act), qi=ST.q-1;
  var r=a.rows[ST.ri];
  var v=document.getElementById('v').value.trim().replace(/,/g,'');
  var err=document.getElementById('verr');
  if (v==='') { err.textContent='กรอกผลก่อนบันทึก'; return; }
  if (!/^-?\d+(\.\d+)?$/.test(v)) { err.textContent='ใส่เป็นตัวเลข เช่น 24.5'; return; }
  var pinEl=document.getElementById('pin'), pin=pinEl?pinEl.value:'';
  if (D.needPin && !pin) { err.textContent='ใส่ PIN ก่อน'; return; }
  var btn=document.getElementById('save'); btn.disabled=true; btn.textContent='กำลังบันทึก…';
  apiPost({ action:'save', sheet:s.name, actKey:a.key, gk:r.gk||'', group:r.group||'', code:a.code, title:a.title, office:r.office, q:ST.q, value:v,
    note:document.getElementById('n').value, srcValue:r.q[qi].r, pin:pin, by:myName() }).then(function(res){
    OV[res.key]=res.rec; D.overrides=OV; lsSet(LS_KEY,D);
    try{ if(pin) sessionStorage.setItem('k04pin',pin);}catch(e){}
    toast('บันทึกแล้ว'); history.back();
  }).catch(function(e){ btn.disabled=false; btn.textContent='บันทึก'; err.textContent=e.message; });
}
function removeOv(){
  var s=findSheet(ST.sheet), a=findAct(s,ST.act), key=ovKey(a,a.rows[ST.ri],ST.q-1);
  if (!confirm('ลบค่าที่เราบันทึกไว้ของ '+QN[ST.q-1]+' ?')) return;
  var pinEl=document.getElementById('pin'), pin=pinEl?pinEl.value:'';
  apiPost({ action:'delete', key:key, pin:pin }).then(function(){ delete OV[key]; lsSet(LS_KEY,D); toast('ลบแล้ว'); history.back(); })
    .catch(function(e){ document.getElementById('verr').textContent=e.message; });
}

/* ---------- ส่งค่าของเรากลับต้นฉบับ ---------- */
var PUSH = { step:'pin' };
function pushPin(){ try{return sessionStorage.getItem('k04pushpin')||'';}catch(e){return '';} }
var ST_LABEL = { diff:'ไม่ตรงกัน', empty:'ช่องว่างในต้นฉบับ', same:'เท่ากันแล้ว', blocked:'ส่งไม่ได้' };
function viewPush(){
  var h = '<div class="back" onclick="history.back()">‹ ส่งค่าของเรากลับต้นฉบับ</div>';
  if (PUSH.step==='pin' || PUSH.step==='loading') {
    h += '<div class="card"><div class="small">รอส่ง '+pendingKeys().length+' รายการ · ไฟล์ต้นฉบับของ กฟจ.กระบี่</div>';
    if (D.needPushPin) h += '<label class="f" for="ppin">PIN สำหรับส่งต้นฉบับ</label><input class="f" id="ppin" type="password" inputmode="numeric" value="'+esc(pushPin())+'">';
    else h += '<div class="note bad">ยังไม่ได้ตั้ง PIN สำหรับส่งต้นฉบับ — ส่งไม่ได้จนกว่าจะตั้ง</div>';
    h += '<div class="err" id="perr">'+esc(PUSH.err||'')+'</div>';

    return h;
  }
  if (PUSH.step==='review') {
    var g = { diff:[], empty:[], same:[], blocked:[] };
    PUSH.items.forEach(function(it){ (g[it.status]||g.blocked).push(it); });
    var nSend = g.empty.length + g.diff.filter(function(it){return PUSH.dec[it.key]==='ours';}).length;
    h += '<div class="small" style="margin:0 4px 8px">ตรวจกับต้นฉบับเมื่อ '+fmtDate(PUSH.checkedAt)+' · ยังไม่มีการเขียน</div>';
    function name(it){ return '<div style="font-weight:500">'+esc(it.code)+' '+esc(String(it.title).slice(0,70))+'</div><div class="small">'+esc(it.office)+' · Q'+it.q+(it.cell?' · '+esc(it.cell):'')+(it.target?' · เป้า '+esc(it.target):'')+'</div>'; }
    if (g.diff.length) {
      h += '<div class="sec">ไม่ตรงกัน — เลือกค่าที่จะใช้ ('+g.diff.length+')</div><div class="card">';
      g.diff.forEach(function(it){
        var d = PUSH.dec[it.key]||'';
        h += '<div class="row" style="cursor:default;display:block">'+name(it)+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">'+
          '<div class="note '+(d==='keep'?'ok':'none')+'" style="margin:0;cursor:pointer" onclick="pushDec('+PUSH.items.indexOf(it)+',\'keep\')"><div class="small">ต้นฉบับตอนนี้</div><div style="font-size:18px;font-weight:600">'+esc(it.src)+'</div>'+
            (it.changedSince?'<div class="small" style="color:var(--bad)">เปลี่ยนหลังเราบันทึก (เดิม '+(blank(it.srcAtEdit)?'ว่าง':esc(it.srcAtEdit))+')</div>':'')+'<div class="small">'+(d==='keep'?'✓ คงค่าต้นฉบับ':'แตะเพื่อคงค่านี้')+'</div></div>'+
          '<div class="note '+(d==='ours'?'mine':'none')+'" style="margin:0;cursor:pointer" onclick="pushDec('+PUSH.items.indexOf(it)+',\'ours\')"><div class="small">ค่าของเรา</div><div style="font-size:18px;font-weight:600">'+esc(it.ours)+'</div>'+
            '<div class="small">'+(d==='ours'?'✓ ใช้ค่าของเรา':'แตะเพื่อใช้ค่านี้')+'</div></div></div></div>';
      });
      h += '</div>';
    }
    if (g.empty.length) {
      h += '<div class="sec">ช่องว่างในต้นฉบับ — จะเขียนให้ ('+g.empty.length+')</div><div class="card">';
      g.empty.forEach(function(it){ h += '<div class="row" style="cursor:default"><div class="t">'+name(it)+'</div><b>'+esc(it.ours)+'</b></div>'; });
      h += '</div>';
    }
    if (g.same.length) {
      h += '<div class="sec">เท่ากันแล้ว — ข้าม ('+g.same.length+')</div><div class="card">';
      g.same.forEach(function(it){ h += '<div class="row" style="cursor:default"><div class="t">'+name(it)+'</div>'+chip('ok',esc(it.src)+' = '+esc(it.ours))+'</div>'; });
      h += '</div>';
    }
    if (g.blocked.length) {
      h += '<div class="sec">ส่งไม่ได้ ('+g.blocked.length+')</div><div class="card">';
      g.blocked.forEach(function(it){ h += '<div class="row" style="cursor:default;display:block">'+name(it)+'<div class="small" style="color:var(--bad)">'+esc(it.reason)+'</div></div>'; });
      h += '</div>';
    }
    h += '<div class="err" id="perr">'+esc(PUSH.err||'')+'</div>';
    if (g.diff.length || g.empty.length || g.same.length)
      h += '<button class="btn primary" id="pgo" onclick="pushCommit()">'+(nSend?'ยืนยันส่ง '+nSend+' รายการ':'ยืนยัน')+'</button>';
    h += '<button class="btn" onclick="history.back()">ยกเลิก (ไม่เขียนอะไร)</button>';
    return h;
  }
  if (PUSH.step==='sending') return h + '<div class="card loading">กำลังเขียนต้นฉบับ… อย่าเพิ่งปิดหน้านี้</div>';
  if (PUSH.step==='done') {
    var lbl = { written:['ok','เขียนแล้ว'], same:['none','ตรงกันอยู่แล้ว'], kept:['none','คงค่าต้นฉบับ'], changed:['low','ต้นฉบับเปลี่ยน'], error:['bad','ไม่สำเร็จ'], skip:['none','ข้าม'] };
    var byKey = {}; (PUSH.items||[]).forEach(function(it){ byKey[it.key]=it; });
    h += '<div class="card"><div style="font-weight:600">'+(PUSH.res.wrote?'ส่งต้นฉบับแล้ว '+PUSH.res.wrote+' รายการ':'ไม่มีการเขียนต้นฉบับ')+'</div>';
    PUSH.res.results.forEach(function(r){
      var it = byKey[r.key]||{}, l = lbl[r.status]||['none',r.status];
      h += '<div class="row" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>'+esc(it.code||'')+' · '+esc(it.office||'')+' · Q'+(it.q||'')+(r.status==='written'?' → '+esc(r.after):'')+'</span>'+chip(l[0],l[1])+'</div>'+
        (r.reason?'<div class="small" style="color:var(--bad)">'+esc(r.reason)+'</div>':'')+(r.status==='written'?'<div class="small">เดิม '+(blank(r.before)?'ว่าง':esc(r.before))+' · '+esc(r.cell)+'</div>':'')+'</div>';
    });
    h += '<div class="small" style="margin-top:8px">ค่าเดิมของต้นฉบับเก็บไว้ในชีต _ประวัติส่งต้นฉบับ · ไฟล์ของเราจะดึงค่าที่ส่งกลับมาในอีกราว 1-2 นาที</div>';
    h += '<button class="btn primary" onclick="load();go(\'home\')">กลับหน้าแรก</button></div>';
    return h;
  }
  return h;
}
function pushDec(i, d){ PUSH.dec[PUSH.items[i].key]=d; PUSH.err=''; var y=window.scrollY; render(); window.scrollTo(0,y); }
function pushPreview(){
  var el=document.getElementById('ppin'), pin=el?el.value.trim():'';
  if (D.needPushPin && !pin) { PUSH.err='ใส่ PIN ก่อน'; render(); return; }
  PUSH = { step:'loading', pin:pin }; render();
  apiPost({ action:'pushPreview', pin:pin }).then(function(r){
    try{ sessionStorage.setItem('k04pushpin',pin);}catch(e){}
    PUSH = { step:'review', pin:pin, items:r.items, checkedAt:r.checkedAt, dec:{} }; render();
  }).catch(function(e){ PUSH = { step:'pin', err:e.message }; render(); });
}
function pushCommit(){
  var undecided = PUSH.items.filter(function(it){ return it.status==='diff' && !PUSH.dec[it.key]; });
  if (undecided.length) { PUSH.err='เลือกค่าที่จะใช้ให้ครบทุกรายการที่ไม่ตรงกันก่อน ('+undecided.length+' รายการ)'; render(); return; }
  var items = PUSH.items.filter(function(it){ return it.status!=='blocked'; }).map(function(it){
    return { key:it.key, expect:it.src, decision: it.status==='diff' ? PUSH.dec[it.key] : (it.status==='same' ? 'same' : 'ours') };
  });
  var keepItems = PUSH.items; PUSH.step='sending'; render();
  apiPost({ action:'pushCommit', pin:PUSH.pin, by:myName(), items:items }).then(function(r){
    PUSH = { step:'done', res:r, items:keepItems };
    r.results.forEach(function(x){ var o=OV[x.key]; if(!o) return;
      if (x.status==='written'||x.status==='same') o.push='ส่งแล้ว'; else if (x.status==='kept') delete OV[x.key]; });
    lsSet(LS_KEY,D); render();
  }).catch(function(e){ PUSH.step='review'; PUSH.err=e.message; render(); });
}

  toast('กำลังเช็กต้นฉบับ…');
  apiPost({ action:'sync', pin:pin }).then(function(r){ toast(r.status==='unchanged'?'ต้นฉบับยังไม่เปลี่ยน':'ซิงค์แล้ว'); load(); })
    .catch(function(e){ toast('ซิงค์ไม่สำเร็จ: '+e.message); });
};
history.replaceState({view:'home'},'');
load();
</script>
</body>
</html>
