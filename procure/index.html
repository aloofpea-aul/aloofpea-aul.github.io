<!DOCTYPE html>
<html lang="th">
<head>
<script src="/pea-hub.js" data-app="procure" data-perm="login" data-name="ระบบงานจัดซื้อจัดจ้าง"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบงานจัดซื้อจัดจ้าง · กฟส.อ่าวลึก</title>
<meta name="theme-color" content="#6b1f7c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<style>
@font-face{font-family:'Sarabun16';src:url('fonts/THSarabunNew.woff') format('woff');font-weight:400}
@font-face{font-family:'Sarabun16';src:url('fonts/THSarabunNew-Bold.woff') format('woff');font-weight:700}
:root{--pea:#6b1f7c;--pea2:#8e3aa0;--bg:#f3f1f6;--card:#fff;--line:#e3dfe8;--ink:#2b2433;--mute:#7a7184;--ok:#1f8a4c;--warn:#c27a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%}
.top{background:linear-gradient(135deg,var(--pea),var(--pea2));color:#fff;padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px;flex:none}
.top h1{font-size:17px;margin:0;font-weight:700;line-height:1.1}
.top small{display:block;font-weight:400;opacity:.85;font-size:12.5px}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:6px 11px;cursor:pointer;font-size:16px}
.main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1500px;margin:0 auto;padding:12px}
.bnav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:6px 0 4px;color:var(--mute);font-size:12px;cursor:pointer;line-height:1.3}
.bnav button b{display:block;font-size:18px;font-weight:400}
.bnav button.on{color:var(--pea);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,10,50,.06)}
.card h3{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--pea)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
label.f{display:block;margin:4px 0 8px}
label.f>span{display:block;font-size:12.5px;color:var(--mute);line-height:1.35;margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;line-height:1.4;font-size:14.5px}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--pea2);border-color:transparent}
.btn{border:0;border-radius:10px;padding:7px 14px;cursor:pointer;background:#efe8f3;color:var(--pea);font-weight:600;font-size:14px}
.btn.p{background:var(--pea);color:#fff}
.btn.g{background:#e3f4ea;color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:13px}
.muted{color:var(--mute);font-size:13px}
.seg{display:inline-flex;background:#efe8f3;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:5px 14px;cursor:pointer;color:var(--pea);font-size:14px}
.seg button.on{background:var(--pea);color:#fff;font-weight:600}
.segrow{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}.segrow>span{min-width:80px;color:var(--mute);font-size:13px}
.tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;background:#efe8f3;color:var(--pea)}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.w{background:#fff3dc;color:var(--warn)}
/* list */
.job{display:flex;gap:12px;align-items:center;cursor:pointer}
.job .ico{width:42px;height:42px;border-radius:12px;background:#efe8f3;display:grid;place-items:center;font-size:21px;flex:none}
.job .t{font-weight:600;line-height:1.35}
.steps{display:flex;gap:3px;margin-top:5px}
.steps i{flex:1;height:6px;border-radius:4px;background:#e6e1ea}
.steps i.d{background:var(--ok)}.steps i.c{background:var(--warn)}
.fab{position:fixed;right:18px;bottom:78px;background:var(--pea);color:#fff;border:0;border-radius:30px;padding:10px 20px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(107,31,124,.4);cursor:pointer}
/* items table */
.it{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fcfbfd}
.it .hd{display:flex;align-items:center;gap:8px}
.it .no{width:26px;height:26px;font-size:13px;border-radius:50%;background:var(--pea);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:14.5px}
.sum b{text-align:right}
/* person */
.pc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#d9c6e0,#efe8f3);display:grid;place-items:center;color:var(--pea);font-weight:600;flex:none;font-size:15px}
.pc .body{flex:1}
.role{font-size:12px;color:#fff;background:var(--pea2);border-radius:6px;padding:0 7px;display:inline-block}
/* docs */
.doc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.doc .n{width:30px;height:30px;font-size:14px;border-radius:9px;background:#efe8f3;color:var(--pea);display:grid;place-items:center;font-weight:700;flex:none}
.doc .b{flex:1;min-width:0}
.doc .ttl{font-weight:600;line-height:1.35}
.doc .row>*{flex:0 0 auto}
.it .row{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.3fr;gap:6px}.it .row>*{min-width:0}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 130px)}
.doc input{border:1px solid var(--line);border-radius:8px;padding:4px 7px;width:150px;font-size:14px}
.doc input.num{width:96px}
details.more{margin-top:4px}
details.more summary{color:var(--pea);cursor:pointer;font-size:12.5px}
/* layout: editor + preview */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:1100px){.split{grid-template-columns:minmax(420px,560px) minmax(0,1fr)}.split .pv{position:sticky;top:0;max-height:calc(100vh - 90px);overflow:auto}.bnav .pvbtn{display:none}}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:10px}
.pvbar .sp{flex:1}
.sheetbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:30px}
.sheetwrap{box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative}
.ovf::after{content:'⚠ เนื้อหาเกินหน้ากระดาษ';position:absolute;top:6px;right:6px;background:#c62828;color:#fff;font:13px 'IBM Plex Sans Thai',sans-serif;padding:0 8px;border-radius:6px}
.savest{font-size:12px;opacity:.9;margin-left:6px;white-space:nowrap}.savest.err{background:#fff3;border-radius:6px;padding:0 6px;cursor:pointer;color:#ffe08a}
.warnbox{background:#fff6e0;color:#7a4b00}
.mdl{position:fixed;inset:0;background:rgba(30,10,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.mbox{background:#fff;border-radius:16px;padding:14px 16px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 8px;color:var(--pea);font-size:17px}.mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.minp{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px;font-size:15px}
.mlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}.mlist button{border:1px solid var(--line);background:#fcfbfd;border-radius:10px;padding:8px 12px;font-size:14px;text-align:left;cursor:pointer}.mlist button:hover{background:#efe8f3}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;z-index:15}
.spin{width:42px;height:42px;border:4px solid #e3d6e8;border-top-color:var(--pea);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{z-index:30;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2433;color:#fff;padding:6px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.editing .page [data-e]{outline:1px dashed #b07cc0;background:#fbf5fd}

/* ================= A4 PAGE (print) ================= */
.page{width:210mm;height:297mm;background:#fff;color:#000;padding:12mm 22.4mm 6mm 25mm;font-family:'Sarabun16';font-size:calc(16pt / 1.5283);line-height:18.1pt;overflow:hidden;position:relative}
/* กรอบอนุมัติ/ช่องลงนาม ชิดโซนล่างของหน้าเสมอ เว้นขอบล่าง 5 มม. + ขอบกระดาษ 6 มม. ≈ 11 มม. (ต้นฉบับ ≈ 12 มม.)
   แบ่งหน้าด้วยการจัดวางปกติก่อน แล้วค่อยใส่ .pinned ให้ดันลงล่าง */
.page .tobottom{padding-bottom:5mm}
.page.pinned{display:flex;flex-direction:column}.page.pinned>*{flex-shrink:0}.page.pinned>.tobottom{margin-top:auto}
/* ช่องลงนามอยู่ที่เดิม (ต่อจากข้อความ) · เฉพาะกรอบอนุมัติที่ลงไปชิดล่าง */
.page.pinned>.sig.tobottom{margin-top:0;flex-grow:1}.sig>.sgn{align-self:start}.sig>.bxc{align-self:end}
.page p{margin:0;text-align:justify;text-justify:inter-character}
.page .in{text-indent:2.5cm}
.page .in2{padding-left:2.5cm}
.page .in3{padding-left:3.2cm}
.page .c{text-align:center}
.page b{font-weight:700}
.logo{width:42mm;display:block;margin-left:0}
.mh{display:grid;grid-template-columns:12.5mm 67.5mm 10mm 1fr}
.mh>div{white-space:nowrap}
.mh .lb{font-weight:400}
.subj{display:grid;grid-template-columns:12.5mm 1fr}
.gap{height:6pt}
.gap2{height:18pt}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:.75pt solid #000;padding:0 4px;vertical-align:top;line-height:18pt}
/* ทุกตาราง 16pt เท่าเนื้อความ (ฟอนต์เว็บใหญ่กว่า TH SarabunIT๙ 1.5283 เท่า) */
table.t th{font-weight:700;text-align:center}
.r{text-align:right}.ctr{text-align:center}
.sig{display:grid;grid-template-columns:79mm 1fr;gap:0 4mm;align-items:start}
.box{border:.75pt solid #000;padding:1.5mm 3mm 2mm}
.box .l{padding-left:12mm}
.sc{text-align:center}
.pgno{text-align:center}
.cont{text-align:right;margin-top:2mm}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .app,.toast,#busy,.mdl{display:none!important}
  #printArea{display:block!important}
  #printArea .page{break-after:page}
  #printArea .page:last-child{break-after:auto}
}
#printArea{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="ibtn" id="backBtn" style="display:none">‹</button>
    <div><h1 id="ttl">ระบบงานจัดซื้อ</h1><small id="sub">กฟส.อ่าวลึก · วิธีเฉพาะเจาะจง</small></div>
    <div class="sp"></div>
    <button class="ibtn" id="delBtn" title="ลบงานนี้" style="display:none">🗑</button>
    <button class="ibtn" id="setBtn" title="ตั้งค่า">⚙</button>
  </div>
  <div class="main" id="main"><div class="wrap" id="view"></div></div>
  <div class="bnav" id="bnav" style="display:none">
    <button data-t="info"><b>📝</b>ข้อมูลงาน</button>
    <button data-t="items"><b>📦</b>รายการพัสดุ</button>
    <button data-t="people"><b>👥</b>ผู้ลงนาม</button>
    <button data-t="docs"><b>🔢</b>เอกสาร/ออกเลข</button>
    <button data-t="pv" class="pvbtn"><b>🖨</b>ดู/พิมพ์</button>
  </div>
</div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<div id="busy"><div class="spin"></div></div>
<datalist id="staff"></datalist>

<script>
/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thDate(iso){if(!iso)return '……………………';const[y,m,d]=iso.split('-').map(Number);return `${d} ${TM[m-1]} ${y+543}`}
function beYear(iso){return (iso?+iso.slice(0,4):new Date().getFullYear())+543}
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function bahtText(num){
  num=Math.round((+num||0)*100)/100;
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{let o='';s=String(+s);if(s==='0')return '';
    // handle millions
    if(s.length>6){return rd(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6))}
    const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
      if(p===0&&d===1&&L>1)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่';else if(p===1&&d===1)o+='';else o+=D[d];o+=P[p]}return o};
  const [b,s]=num.toFixed(2).split('.');let t=rd(b);if(t)t+='บาท';
  if(+s){t+=rd(s)+'สตางค์'}else t+='ถ้วน';return t||'ศูนย์บาทถ้วน'}
const toThaiDigits=s=>s.replace(/[0-9]/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------------- ตั้งค่าการเชื่อมต่อ ---------------- */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwJEHg7z1xtXk4xWntweZ1MBzdz34l0KuPLyQ7iCe5Bm5isvWENHwnGn4MmVJ_MIyqZjQ/exec';   // ← ลิงก์ Web app หลังบ้านระบบงานจัดซื้อจัดจ้าง (…/exec) · ว่าง = โหมดทดลองเก็บในเครื่อง
const BOOK_API = 'https://script.google.com/macros/s/AKfycbxNSVvzUdqQC-_8ZKLJM1GFliAM4zWyJI8z8VzU0vhhSSBqq0JcxrUr_UyBkWol7ko1Rw/exec';   // ระบบออกเลขหนังสือ V4
const ST_API = 'https://script.google.com/macros/s/AKfycbyfGC_-vovohq24RWL91hUEYWXxdiL8UkvJ5VOabKe2dGt9vERuCKocEieny86rhOBJXw/exec';     // ฐานข้อมูลพนักงาน (Safety Talk)
const LOGO = 'pea-logo.png';
const lsr = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const API_URL = () => lsr('procure_api') || API_DEFAULT;
const LOCAL = () => !API_URL();
const cred = () => ({ user: lsr('pea_aoluek_username') || '', pass: lsr('pea_aoluek_password') || '' });
const nm = s => String(s || '').replace(/[\s​-‍﻿]/g, '').toLowerCase();

/* ---------------- ข้อมูลกลาง ---------------- */
const DEFSET = { office: 'กฟส.อ่าวลึก', bookPrefix: 'ต.2 กฟส.อล.', authNo: 'พ.(ม)28/2568', authDate: '2025-11-17', authLimit: '1,000,000.-บาท (หนึ่งล้านบาทถ้วน)',
  approver: { name: '', pos: 'ผจก.กฟส.อ่าวลึก' },
  depts: { 'ผปร.': { code: '(ปร.)', head: 'หผ.ปร.', cc: '', acc: '', accName: '' }, 'ผบง.': { code: '(บง.)', head: 'หผ.บง.', cc: '', acc: '', accName: '' }, 'ผบค.': { code: '(บค.)', head: 'หผ.บค.', cc: '', acc: '', accName: '' } } };
let SET = Object.assign({}, DEFSET, store.get('procure_settings', {}));
SET.thaiNum = store.get('procure_thainum', true);
let STAFF = store.get('procure_staff', { list: [] }).list || [];
let ME = { name: cred().user, admin: false };
let LIST = [];

const DOCS = [
 { k: 'd1', short: 'แต่งตั้งเจ้าหน้าที่จัดทำ TOR/ราคากลาง', num: true },
 { k: 'd2', short: 'ขอความเห็นชอบร่าง TOR', num: true },
 { k: 'd3', short: 'ร่างขอบเขตงาน (TOR) 2 หน้า', num: false },
 { k: 'd4', short: 'รายงานขอซื้อ 2 หน้า', num: true },
 { k: 'd5', short: 'ขออนุมัติจัดซื้อ', num: true },
 { k: 'd6', short: 'รายงานการตรวจรับงานซื้อ', num: false },
 { k: 'd7', short: 'ขออนุมัติจ่ายเงิน', num: true }];

const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function blankJob() {
  const t = today();
  return { kind: 'buy', inspect: 'committee', title: '', purpose: '', dept: '', deptFull: '', deptCode: '', headShort: '', headAbbr: '',
    budgetType: 'งบทำการ', cc: '', acc: '', accName: '',
    background: '', objective: '', reason: '',
    bidderQual: 'เป็นบุคคลธรรมดาหรือนิติบุคคลผู้มีอาชีพขายหรือรับจ้างงานที่จัดซื้อจัดจ้างนี้',
    vendor: '', vendorAddr: '', bank: '', bankAcc: '', days: 7, penalty: '0.10', vatIncl: true, invBook: '', invNo: '', invDate: '',
    items: [{ name: '', qty: 1, unit: '', price: 0, spec: '' }],
    officer: { name: '', pos: '' }, head: { name: '', pos: '' }, approver: Object.assign({}, SET.approver),
    committee: [{ name: '', pos: '', role: 'ประธานกรรมการ' }, { name: '', pos: '', role: 'กรรมการ' }, { name: '', pos: '', role: 'กรรมการ' }],
    docs: { d1: { no: '', date: t }, d2: { no: '', date: t }, d3: { date: t }, d4: { no: '', date: t }, d5: { no: '', date: '' }, d6: { date: '' }, d7: { no: '', date: '' } },
    printed: {} };
}
function fixJob(j) {   // งานเก่า/ข้อมูลไม่ครบ → เติมช่องที่ขาด
  const b = blankJob();
  for (const k in b) if (j[k] === undefined) j[k] = b[k];
  for (const k in b.docs) j.docs[k] = j.docs[k] || {};
  j.printed = j.printed || {};
  if (!j.committee.length) j.committee.push({ name: '', pos: '', role: 'ประธานกรรมการ' });
  return j;
}
function summaryOf(j) {
  const c = calc(j), keys = DOCS.map(d => d.k);

    total: c.total, step: done + ' จาก 7', nums: keys.map(k => (j.docs[k] || {}).no).filter(Boolean).join(', '), updatedBy: ME.name, updatedAt: new Date().toISOString() };

/* ---------------- เรียกหลังบ้าน ---------------- */
async function api(action, payload) {
  if (LOCAL()) return localApi(action, payload || {});
  const c = cred();
  if (!c.user) { const e = new Error('ยังไม่ได้เข้าสู่ระบบศูนย์รวมงาน'); e.code = 'unauthorized'; throw e; }
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 60000);
  let j;
  try {
    const r = await fetch(API_URL(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, user: c.user, pass: c.pass }, payload || {})), signal: ctrl.signal });
    j = await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต'); }
  finally { clearTimeout(t); }
  if (!j || !j.ok) { const e = new Error((j && (j.message || j.error)) || 'ไม่ทราบสาเหตุ'); e.code = j && j.error; e.latest = j && j.latest; throw e; }
  return j;
}
/* โหมดทดลอง (ยังไม่ได้ใส่ลิงก์หลังบ้าน): เก็บในเครื่องนี้ด้วยกติกาเดียวกับหลังบ้านจริง */
function localApi(action, b) {
  const all = store.get('procure_local_jobs', {});
  const put = () => store.set('procure_local_jobs', all);
  if (action === 'bootstrap') return { ok: true, me: { name: ME.name || 'ผู้ทดลอง', admin: true }, settings: Object.assign({}, DEFSET, store.get('procure_local_settings', {})),
    jobs: Object.values(all).filter(j => !j._deleted).map(j => Object.assign(summaryOf(j), { updatedAt: j._at })).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))) };
  if (action === 'get') { const j = all[b.id]; if (!j) throw new Error('ไม่พบงานนี้'); return { ok: true, job: JSON.parse(JSON.stringify(j)) }; }
  if (action === 'save') {
    const job = JSON.parse(JSON.stringify(b.job)), old = job.id && all[job.id];
    if (!old) { job.id = 'PR' + Date.now().toString(36).toUpperCase(); job.rev = 1; job.createdBy = ME.name; job.createdAt = new Date().toISOString(); }
    else {
      if (b.baseRev != null && (old.rev || 0) !== b.baseRev && !b.force) { const e = new Error('มีผู้อื่นแก้ไขงานนี้หลังจากที่คุณเปิด'); e.code = 'conflict'; e.latest = old; throw e; }
      job.rev = (old.rev || 0) + 1;
      for (const k in old.docs || {}) if (old.docs[k].no && !(job.docs[k] || {}).no) job.docs[k] = Object.assign(job.docs[k] || {}, { no: old.docs[k].no });
    }
    job._at = new Date().toISOString(); all[job.id] = job; put();
    return { ok: true, job, rev: job.rev, summary: summaryOf(job) };
  }
  if (action === 'setDocNo') {
    const job = all[b.id]; if (!job) throw new Error('ไม่พบงานนี้');
    if (job.docs[b.docKey].no && !b.replace) throw new Error('ฉบับนี้มีเลขแล้ว');
    Object.assign(job.docs[b.docKey], { no: b.no, date: b.date || job.docs[b.docKey].date, bookRef: b.bookRef || '' });
    job.rev = (job.rev || 0) + 1; job._at = new Date().toISOString(); put();
    return { ok: true, job, rev: job.rev, summary: summaryOf(job) };
  }
  if (action === 'remove') { if (all[b.id]) all[b.id]._deleted = true; put(); return { ok: true }; }
  if (action === 'saveSettings') { store.set('procure_local_settings', b.settings); return { ok: true, settings: b.settings }; }
  throw new Error('unknown action');
}

/* ---------------- บันทึกอัตโนมัติ ---------------- */
let saving = false, dirty = false, saveT = null, saveState = '';
function setSave(s) { saveState = s; const el = $('#saveSt'); if (el) { el.textContent = { wait: '● ยังไม่บันทึก', busy: '⟳ กำลังบันทึก…', ok: '✓ บันทึกแล้ว', err: '⚠ บันทึกไม่สำเร็จ — แตะเพื่อลองใหม่' }[s] || ''; el.className = 'savest ' + s; } }
function save() { if (!cur) return; dirty = true; setSave('wait'); clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
const clean = j => { const o = JSON.parse(JSON.stringify(j)); delete o._at; delete o._deleted; return o; };
async function flush() {
  clearTimeout(saveT);
  if (!cur || !dirty) return;
  if (saving) { saveT = setTimeout(flush, 500); return; }
  saving = true; dirty = false; setSave('busy');
  const j = cur;
  try {
    const r = await api('save', { job: clean(j), baseRev: j.rev });
    j.id = r.job.id; j.rev = r.rev; upsertList(r.summary || summaryOf(j));
    rememberPeople(j);
    setSave(dirty ? 'wait' : 'ok');
  } catch (e) {
    if (e.code === 'conflict') {
      const ok = await ask('มีผู้อื่นแก้ไขงานนี้ไปก่อน', `${esc(e.message)}<br><br><b>โหลดข้อมูลล่าสุด</b> = ใช้ข้อมูลของอีกฝ่าย (สิ่งที่คุณเพิ่งแก้จะหาย)<br><b>บันทึกของฉันทับ</b> = ใช้ข้อมูลในหน้าจอนี้`, ['โหลดข้อมูลล่าสุด', 'บันทึกของฉันทับ']);
      if (ok === 0 && e.latest) { cur = fixJob(e.latest); setSave('ok'); jobView(); }
      else { try { const r = await api('save', { job: clean(j), force: true }); j.rev = r.rev; upsertList(r.summary); setSave('ok'); } catch (e2) { dirty = true; setSave('err'); toast(e2.message); } }
    } else { dirty = true; setSave('err'); toast('บันทึกไม่สำเร็จ: ' + e.message); }
  } finally { saving = false; if (dirty && saveState !== 'err') saveT = setTimeout(flush, 1500); }
}
async function settle() { for (let i = 0; i < 120 && (saving || dirty); i++) { if (dirty && !saving) await flush(); else await new Promise(r => setTimeout(r, 250)); } return !dirty; }
function upsertList(s) { if (!s || !s.id) return; const i = LIST.findIndex(x => x.id === s.id); if (i >= 0) LIST[i] = Object.assign(LIST[i], s); else LIST.unshift(s); }
function rememberPeople(j) { store.set('procure_last', { dept: j.dept, officer: j.officer, head: j.head, approver: j.approver, committee: j.committee }); }
addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

async function bookCall(fn, args) {   // แนบ token อัตโนมัติ · หมดอายุ → ถามรหัสใหม่ 1 ครั้ง

  m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { m.remove(); res(+b.dataset.i); }); }); }
function askText(title, body, ph, pw) { return new Promise(res => { const m = modal(`<h3>${esc(title)}</h3><div>${body}</div><input class="minp" type="${pw ? 'password' : 'text'}" placeholder="${esc(ph)}"><div class="mbtn"><button class="btn p" data-ok>ตกลง</button><button class="btn" data-x>ยกเลิก</button></div>`);
  const i = m.querySelector('input'); i.focus(); const done = v => { m.remove(); res(v); };
  m.querySelector('[data-ok]').onclick = () => done(i.value.trim()); m.querySelector('[data-x]').onclick = () => done(''); i.onkeydown = e => { if (e.key === 'Enter') done(i.value.trim()); }; }); }

 ${P(auth)}<div class="gap"></div>

/* แบ่งหน้าอัตโนมัติ: เนื้อหาเกินหน้า → ยกส่วนท้ายขึ้นหน้าใหม่ · ตารางแบ่งข้ามหน้าได้ (ทำหัวตารางซ้ำ)
   หัวข้อไม่ค้างท้ายหน้า · หนังสือบันทึกข้อความใส่ "/คำแรกของหน้าถัดไป..." ท้ายหน้า และ "-๒-" หัวหน้าถัดไป ตามแบบเดิม */
function splitTable(tb,over){const rows=[...tb.rows];if(rows.length<3)return null;
 const t2=tb.cloneNode(false);const cg=tb.querySelector('colgroup');if(cg)t2.appendChild(cg.cloneNode(true));
 const body=document.createElement('tbody');t2.appendChild(body);let i=rows.length-1;
 while(over()&&i>=2){body.insertBefore(rows[i],body.firstChild);i--}
 if(over()||!body.rows.length){const tb2=rows[0].parentNode;[...body.rows].forEach(r=>tb2.appendChild(r));return null}
 body.insertBefore(rows[0].cloneNode(true),body.firstChild);return t2}
function paginate(box){
 [...box.querySelectorAll('.page')].forEach(pg=>{
  const memo=pg.dataset.flow!=='tor';let cur=pg,n=1,guard=0;
  while(cur.scrollHeight>cur.clientHeight+1&&cur.children.length>1&&guard++<20){
   const over=()=>cur.scrollHeight>cur.clientHeight+1,moved=[];
   const nx=document.createElement('div');nx.className='page';nx.dataset.flow=pg.dataset.flow||'';nx.style.paddingTop=memo?'15mm':(pg.style.paddingTop||'');cur.after(nx);
   const take=()=>{while(cur.children.length>1){const l=cur.lastElementChild;if(l.classList.contains('kwn')||l.classList.contains('gap')){moved.unshift(l);l.remove()}else break}};
   while(over()&&cur.children.length>1){const last=cur.lastElementChild;
    if(last.tagName==='TABLE'){const t2=splitTable(last,over);if(t2){moved.unshift(t2);break}}
    moved.unshift(last);last.remove()}
   take();
   if(memo){n++;const f=document.createElement('div');f.className='cont';cur.appendChild(f);
    const label=()=>{const fst=moved.find(m=>m.textContent.trim());f.textContent='/'+(fst?fst.textContent.trim().split(/\s+/).slice(0,2).join(' '):'')+'...'};label();
    while(over()&&cur.children.length>2){const l=f.previousElementSibling;moved.unshift(l);l.remove();take();label()}
    const no=String(n);nx.innerHTML='<div class="pgno">-'+(SET.thaiNum?toThaiDigits(no):no)+'-</div><div class="gap"></div>'}
   while(moved.length&&moved[0].classList&&moved[0].classList.contains('gap'))moved.shift();
   moved.forEach(m=>nx.appendChild(m));cur=nx}
 });
 box.querySelectorAll('.page').forEach(pg=>pg.classList.add('pinned'))}
function renderPages(j,keys){const c=calc(j);w=W(j);return keys.map(k=>RENDER[k](j,c)).join('')}
function thaiNumify(root){if(!SET.thaiNum)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/[0-9]/.test(n.nodeValue))n.nodeValue=toThaiDigits(n.nodeValue)}}

  } catch (e) { LIST = store.get('procure_list_cache', []); loadErr = 'โหลดรายการงานไม่สำเร็จ: ' + e.message; }
  finally { busy(false); }
  const id = new URLSearchParams(location.search).get('id');
  if (id && !loadErr) openJob(id); else listView();
}
fillStaff();
$('#backBtn').onclick = backToList; $('#setBtn').onclick = settingsView; $('#delBtn').onclick = delJob;

document.querySelectorAll('.bnav button').forEach(b => b.onclick = () => { tab = b.dataset.t; jobView(); $('#main').scrollTop = 0; });

(function wait(n) { if (cred().user || LOCAL() || n > 600) { boot(); loadStaff(); } else setTimeout(() => wait(n + 1), 500); })(0);
