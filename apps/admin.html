<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1b33">
<title>ศูนย์ควบคุม Aloof Apps</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="icons.css?v=20261128a">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:#F4F3FF;color:#1d1b33}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
.top{background:#1d1b33;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{border-radius:18px;padding:12px 14px}.st small{font-size:13px;display:block}.st b{font-size:28px;line-height:1.1}
.tabs{display:flex;gap:6px;background:#F4F3FF;border-radius:14px;padding:4px}
.tabs button{flex:1;border:none;background:none;border-radius:10px;padding:9px;font:inherit;font-weight:600;color:#6B6890;cursor:pointer}
.tabs button.on{background:#fff;color:#534AB7;box-shadow:0 1px 3px rgba(29,27,51,.1)}
.row{display:flex;align-items:center;gap:12px;border:2px solid #EEEDFE;border-radius:18px;padding:10px 12px;cursor:pointer;background:#fff;width:100%;font:inherit;text-align:left;color:inherit}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.btn{border:none;border-radius:16px;padding:12px 14px;font:inherit;font-weight:600;color:#fff;background:#534AB7;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.ghost{background:#fff;color:#444441;border:2px solid #D3D1C7}
.mut{color:#6B6890;font-size:13px}
.pnl{border:2px solid #CECBF6;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FBFAFF;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:2px solid #E6E4F5;background:#fff;border-radius:12px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:#534AB7;background:#EEEDFE;color:#3C3489;font-weight:600}
input,select{font:inherit;font-size:16px;border:2px solid #E6E4F5;border-radius:12px;padding:9px 12px;width:100%;background:#fff}
.code{font-size:30px;font-weight:700;letter-spacing:4px;color:#3C3489;text-align:center;background:#EEEDFE;border-radius:16px;padding:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1b33;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;font-size:14px;animation:pop .2s}
.spin{width:34px;height:34px;border:4px solid #EEEDFE;border-top-color:#534AB7;border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><span style="width:40px;height:40px;border-radius:50%;background:#EF9F27;display:flex;align-items:center;justify-content:center;font-weight:700">พี่</span>
  <div style="flex:1"><div style="font-weight:700">ศูนย์ควบคุม Aloof Apps</div><div style="font-size:12px;opacity:.7" id="upd">กำลังโหลด…</div></div>
  <button id="rf" aria-label="โหลดใหม่" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer"><i class="ti ti-refresh"></i></button></div>
 <div class="body" id="b"><div class="spin"></div></div>
</div>
<script src="aloof.js?v=20261128a"></script>
<script>
const A=AloofApps,$=s=>document.querySelector(s),B=$('#b');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LN={en:'English',zh:'中文',ja:'日本語'},LC={en:['#E6F1FB','#0C447C'],zh:['#FCEBEB','#791F1F'],ja:['#FBEAF0','#72243E']};
const KEY='aloof_admin';let TOK=null,DATA=null,TAB='users',OPEN=null;
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};
const ago=iso=>{if(!iso)return 'ยังไม่เคยใช้';const m=Math.round((Date.now()-new Date(iso))/6e4);return m<1?'เมื่อสักครู่':m<60?m+' นาทีที่แล้ว':m<1440?Math.round(m/60)+' ชม.ที่แล้ว':Math.round(m/1440)+' วันที่แล้ว'};
const dt=iso=>iso?new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'ไม่จำกัด';
const chipT=t=>{const x=A.TYPE[t]||A.TYPE.tester;return `<span class="chip" style="background:${x[1]};color:${x[2]}">${x[0]}</span>`};
const langs=apps=>((apps&&apps.english&&apps.english.langs)||[]).map(l=>`<span class="chip" style="background:${LC[l][0]};color:${LC[l][1]};font-size:11px;padding:2px 7px">${LN[l]}</span>`).join(' ');
async function call(action,body){const r=await A.api(action,Object.assign({token:TOK},body||{}));if(r.auth===false){sessionStorage.removeItem(KEY);TOK=null;await login();return call(action,body)}return r}

async function login(){let name='',pass='';try{name=localStorage.getItem('pea_aoluek_username')||'';pass=localStorage.getItem('pea_aoluek_password')||''}catch(e){}
 if(!name||!pass){B.innerHTML='<div class="pnl"><b>ต้องเข้าสู่ระบบศูนย์รวมงานก่อน</b><div class="mut">หน้านี้ใช้บัญชีแอดมินของศูนย์รวมงาน</div><a class="btn" href="/index.html">ไปศูนย์รวมงาน</a></div>';throw 0}
 const r=await A.api('adminLogin',{name,pass});if(!r.ok){B.innerHTML=`<div class="pnl"><b>เข้าไม่ได้</b><div class="mut">${esc(r.msg)}</div></div>`;throw 0}
 TOK=r.token;sessionStorage.setItem(KEY,TOK)}
async function load(){$('#upd').textContent='กำลังโหลด…';const r=await call('adminData');if(!r.ok){B.innerHTML=`<div class="pnl">${esc(r.msg)}</div>`;return}DATA=r;$('#upd').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});render()}
function render(){const s=DATA.stat;
 B.innerHTML=`<div class="st">
  <div style="background:#EEEDFE"><small style="color:#534AB7">ผู้ทดสอบ</small><b style="color:#26215C">${s.tester||0}</b></div>
  <div style="background:#E1F5EE"><small style="color:#0F6E56">ใช้งานวันนี้</small><b style="color:#04342C">${s.activeToday||0}</b></div>
  <div style="background:#FAEEDA"><small style="color:#854F0B">ทดลองใช้</small><b style="color:#412402">${s.trial||0}</b></div>
  <div style="background:#FBEAF0"><small style="color:#993556">สมาชิกจ่ายแล้ว</small><b style="color:#4B1528">${s.paid||0}</b></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" id="ni"><i class="ti ti-ticket"></i> ออกโค้ดเชิญ</button><a class="btn ghost" href="${esc(DATA.sheet)}" target="_blank" rel="noopener"><i class="ti ti-table"></i> เปิดชีตข้อมูล</a></div>
 <div id="np"></div>
 <div class="tabs"><button data-t="users" class="${TAB==='users'?'on':''}">ผู้ใช้ (${DATA.users.length})</button><button data-t="invites" class="${TAB==='invites'?'on':''}">โค้ดเชิญ (${DATA.invites.length})</button></div>
 <div id="ls" style="display:flex;flex-direction:column;gap:8px"></div>`;
 $('#ni').onclick=newInvite;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;OPEN=null;render()});list()}
function list(){const L=$('#ls');
 if(TAB==='users'){L.innerHTML=DATA.users.length?DATA.users.map((u,i)=>`<button class="row" data-u="${i}">${A.avatar(u.avatar,40)}<span style="flex:1;min-width:0"><b>${esc(u.name)}</b> <span class="mut">${esc(u.username)}</span><br><span class="mut">${u.status!=='active'?'<b style="color:#A32D2D">ปิดอยู่</b> · ':''}${u.expired?'<b style="color:#A32D2D">หมดอายุ</b> · ':''}${esc(u.lastApp?'ใช้ '+u.lastApp.replace('english','English Step'):'เข้าล่าสุด '+ago(u.lastLogin))}</span><br>${langs(u.apps)}</span>${chipT(u.type)}</button>${OPEN===i?userPanel(u):''}`).join(''):'<div class="mut" style="text-align:center;padding:20px">ยังไม่มีผู้ใช้ ออกโค้ดเชิญแล้วส่งให้ผู้ทดสอบได้เลย</div>';
  L.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{OPEN=OPEN===+b.dataset.u?null:+b.dataset.u;list()});if(OPEN!=null)bindUser(DATA.users[OPEN])}
 else{L.innerHTML=DATA.invites.length?DATA.invites.map(v=>`<div class="row" style="cursor:default"><span style="flex:1"><b style="letter-spacing:1px">${esc(v.code)}</b> ${chipT(v.type)}<br><span class="mut">ใช้แล้ว ${v.used}/${v.maxUses||'∞'} · ${v.days?v.days+' วัน':'ไม่จำกัดเวลา'}${v.note?' · '+esc(v.note):''}</span><br>${langs(v.apps)}</span>
  <span style="display:flex;flex-direction:column;gap:6px"><button class="btn ghost" data-cp="${esc(v.code)}" style="padding:6px 10px;font-size:13px"><i class="ti ti-copy"></i> ลิงก์</button><button class="btn ${v.active?'ghost':''}" data-tg="${esc(v.code)}" data-on="${v.active?0:1}" style="padding:6px 10px;font-size:13px">${v.active?'ปิดโค้ด':'เปิดโค้ด'}</button></span></div>`).join(''):'<div class="mut" style="text-align:center;padding:20px">ยังไม่มีโค้ดเชิญ</div>';
  L.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>share(b.dataset.cp));
  L.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await call('setInvite',{code:b.dataset.tg,active:b.dataset.on==='1'});if(r.ok){toast('บันทึกแล้ว');load()}else toast(r.msg)})}}
const link=c=>location.origin+'/apps/?code='+encodeURIComponent(c);
function share(c){const t=link(c);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกลิงก์แล้ว')).catch(()=>prompt('คัดลอกลิงก์นี้',t))}
function seg(name,opts,cur){return `<div class="seg" data-seg="${name}">${opts.map(o=>`<button type="button" data-v="${o[0]}" class="${[].concat(cur).includes(o[0])?'on':''}">${o[1]}</button>`).join('')}</div>`}
function segVal(name,multi){const on=[...document.querySelectorAll(`[data-seg="${name}"] .on`)].map(b=>b.dataset.v);return multi?on:on[0]}
function segBind(root){root.querySelectorAll('[data-seg]').forEach(s=>{const multi=s.dataset.seg==='lg';s.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(multi)b.classList.toggle('on');else s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))})})}
const TYPES=[['tester','ผู้ทดสอบ'],['trial','ทดลองใช้'],['paid','สมาชิก'],['staff','ทีมงาน']],LGS=[['en','English'],['zh','中文'],['ja','日本語']];
function newInvite(){const p=$('#np');if(p.innerHTML){p.innerHTML='';return}
 p.innerHTML=`<div class="pnl"><b>ออกโค้ดเชิญใหม่ · English Step</b>
 <div class="mut">ประเภทบัญชี</div>${seg('ty',TYPES,'tester')}
 <div class="mut">ภาษาที่ใช้ได้</div>${seg('lg',LGS,['en','zh','ja'])}
 <div class="mut">อายุบัญชี</div>${seg('dy',[['30','30 วัน'],['90','90 วัน'],['365','1 ปี'],['0','ไม่จำกัด']],'90')}
 <div class="mut">ใช้สมัครได้กี่คน</div>${seg('mx',[['1','1 คน'],['5','5 คน'],['20','20 คน'],['0','ไม่จำกัด']],'1')}
 <input id="nt" placeholder="บันทึกช่วยจำ เช่น ลูกสาว (ไม่บังคับ)" maxlength="50">
 <button class="btn" id="mk"><i class="ti ti-sparkles"></i> สร้างโค้ด</button><div id="out"></div></div>`;segBind(p);
 $('#mk').onclick=async()=>{const lg=segVal('lg',true);if(!lg.length)return toast('เลือกอย่างน้อย 1 ภาษา');const b=$('#mk');b.disabled=true;
  const r=await call('createInvite',{type:segVal('ty'),apps:{english:{langs:lg}},days:+segVal('dy'),maxUses:+segVal('mx'),note:$('#nt').value});b.disabled=false;
  if(!r.ok)return toast(r.msg);$('#out').innerHTML=`<div class="code">${esc(r.code)}</div><div class="mut" style="text-align:center">ส่งลิงก์นี้ให้ผู้ทดสอบ เปิดแล้วใส่โค้ดให้อัตโนมัติ</div><div style="font-size:13px;word-break:break-all;text-align:center">${esc(link(r.code))}</div><button class="btn" id="cp"><i class="ti ti-copy"></i> คัดลอกลิงก์</button>`;$('#cp').onclick=()=>share(r.code);
  const keep=$('#np').innerHTML;await load();$('#np').innerHTML=keep;$('#cp').onclick=()=>share(r.code);segBind($('#np'));$('#mk').onclick=null;$('#mk').style.display='none'}}
function userPanel(u){return `<div class="pnl" id="up"><div class="mut">ประเภทบัญชี</div>${seg('uty',TYPES,u.type)}<div class="mut">ภาษาที่ใช้ได้</div>${seg('lg',LGS,(u.apps.english&&u.apps.english.langs)||[])}
 <div class="mut">หมดอายุ: <b>${dt(u.expires)}</b> · สมัครด้วยโค้ด ${esc(u.invite||'-')} · สมัครเมื่อ ${dt(u.created)}</div>
 <div class="seg"><button data-add="30">+30 วัน</button><button data-add="90">+90 วัน</button><button data-add="365">+1 ปี</button><button data-noexp>ไม่จำกัด</button></div>
 <button class="btn" id="sv"><i class="ti ti-check"></i> บันทึกประเภท/ภาษา</button>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn ghost" id="st">${u.status==='active'?'ปิดบัญชีชั่วคราว':'เปิดบัญชีอีกครั้ง'}</button><button class="btn ghost" id="pw">ตั้งรหัสผ่านใหม่</button></div></div>`}
function bindUser(u){const p=$('#up');segBind(p);const save=async set=>{const r=await call('setUser',{username:u.username,set});if(r.ok){toast('บันทึกแล้ว');await load()}else toast(r.msg)};
 $('#sv').onclick=()=>{const lg=segVal('lg',true);if(!lg.length)return toast('เลือกอย่างน้อย 1 ภาษา');save({type:segVal('uty'),apps:{english:{langs:lg}}})};
 p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>save({addDays:+b.dataset.add}));p.querySelector('[data-noexp]').onclick=()=>save({expires:''});
 $('#st').onclick=()=>save({status:u.status==='active'?'disabled':'active'});
 $('#pw').onclick=async()=>{const pw=prompt('รหัสผ่านใหม่ของ '+u.name+' (อย่างน้อย 6 ตัว)');if(!pw)return;const r=await call('resetPass',{username:u.username,password:pw});toast(r.ok?'ตั้งรหัสใหม่แล้ว':r.msg)}}
$('#rf').onclick=()=>load();
(async()=>{TOK=sessionStorage.getItem(KEY);try{if(!TOK)await login();await load()}catch(e){if(e!==0)B.innerHTML='<div class="pnl">เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง</div>'}})();
</script>
</body>
</html>
