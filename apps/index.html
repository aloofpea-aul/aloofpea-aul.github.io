<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<title>Aloof Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="icons.css?v=20261128a">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:#F4F3FF;color:#1d1b33;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;position:relative;overflow:hidden}
.hero{background:#534AB7;color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 64px;position:relative}
.hero h1{font-size:28px;line-height:1.25;margin:18px 0 4px;font-weight:700}
.hero p{margin:0;opacity:.85}
.apps{display:flex;gap:12px}
.ai{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;animation:fl 3s ease-in-out infinite}
.ai:nth-child(2){animation-delay:.5s}.ai:nth-child(3){animation-delay:1s}.ai:nth-child(4){animation-delay:1.5s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-4deg)}}
.dot{position:absolute;border-radius:50%;opacity:.18;background:#fff}
.sheet{background:#fff;border-radius:28px 28px 0 0;margin-top:-30px;position:relative;padding:24px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ip{display:flex;align-items:center;gap:10px;background:#F4F3FF;border:2px solid transparent;border-radius:16px;padding:0 14px;transition:border-color .2s,background .2s}
.ip:focus-within{border-color:#AFA9EC;background:#fff}
.ip .ti{font-size:20px;color:#534AB7}
.ip input{flex:1;border:none;background:transparent;font:inherit;font-size:16px;padding:14px 0;outline:none;color:#1d1b33;min-width:0}
.btn{border:none;border-radius:18px;padding:15px;font:inherit;font-size:17px;font-weight:600;color:#fff;background:#534AB7;cursor:pointer;transition:transform .1s;width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.g{background:#1D9E75}
.ol{border-radius:16px;padding:12px;text-align:center;font-weight:600;font-size:14px;background:#fff;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.ol:active{transform:scale(.96)}
.or{display:flex;align-items:center;gap:10px;color:#8A87A8;font-size:13px}.or::before,.or::after{content:'';flex:1;height:1px;background:#E6E4F5}
.msg{font-size:14px;min-height:20px;text-align:center}.msg.err{color:#A32D2D}.msg.ok{color:#0F6E56}
.link{background:none;border:none;color:#534AB7;font:inherit;font-weight:600;cursor:pointer;padding:6px}
.gift{background:#FAEEDA;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.av{border:none;background:none;padding:3px;border-radius:50%;cursor:pointer;transition:transform .15s}
.av.on{outline:3px solid #534AB7;transform:scale(1.12)}
.card{display:flex;align-items:center;gap:14px;border:2px solid #EEEDFE;border-radius:20px;padding:14px;text-decoration:none;color:inherit;transition:transform .1s,border-color .2s}
.card:active{transform:scale(.97)}.card:hover{border-color:#AFA9EC}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.spin{width:34px;height:34px;border:4px solid #EEEDFE;border-top-color:#534AB7;border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
h2{margin:0;font-size:22px}
.sub{color:#6B6890;font-size:14px;margin-top:-6px}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero">
  <span class="dot" style="width:160px;height:160px;right:-50px;top:-40px"></span><span class="dot" style="width:70px;height:70px;right:70px;bottom:40px"></span>
  <div class="apps"><span class="ai" style="background:#EF9F27"><i class="ti ti-language"></i></span><span class="ai" style="background:#1D9E75"><i class="ti ti-bolt"></i></span><span class="ai" style="background:#D4537E"><i class="ti ti-sparkles"></i></span><span class="ai" style="background:#378ADD"><i class="ti ti-plus"></i></span></div>
  <h1 id="hT">ยินดีต้อนรับสู่<br>Aloof Apps</h1><p id="hS">บัญชีเดียว ใช้ได้ทุกแอป</p>
 </div>
 <div class="sheet" id="v"><div class="spin"></div></div>
</div>
<script src="aloof.js?v=20261128a"></script>
<script>
const A=AloofApps,$=s=>document.querySelector(s),v=$('#v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),NEXT=(P.get('next')||'').startsWith('/')?P.get('next'):'';
const LN={en:['English','#E6F1FB','#0C447C'],zh:['中文','#FCEBEB','#791F1F'],ja:['日本語','#FBEAF0','#72243E']};
function hero(t,s){$('#hT').innerHTML=t;$('#hS').textContent=s}
function show(html,bind){v.style.animation='none';void v.offsetWidth;v.style.animation='';v.innerHTML=html;if(bind)bind();window.scrollTo(0,0)}
function confetti(){const c=['#EF9F27','#1D9E75','#D4537E','#378ADD','#7F77DD','#F0997B'];for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function busy(b,t){b.disabled=!!t;if(t){b.dataset.t=b.textContent;b.textContent=t}else if(b.dataset.t)b.textContent=b.dataset.t}
const field=(ic,id,ph,type,ac)=>`<label class="ip"><i class="ti ti-${ic}"></i><input id="${id}" type="${type||'text'}" placeholder="${ph}" autocomplete="${ac||'off'}" autocapitalize="off"${type==='password'?' data-eye="off"':''}>${type==='password'?`<button type="button" class="link" data-eye="${id}" aria-label="แสดงรหัสผ่าน" style="padding:4px"><i class="ti ti-eye" style="font-size:20px;color:#8A87A8"></i></button>`:''}</label>`;
function eyes(){document.querySelectorAll('[data-eye]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.onclick=()=>{const i=$('#'+b.dataset.eye);const s=i.type==='password';i.type=s?'text':'password';b.querySelector('.ti').className='ti ti-eye'+(s?'-off':'');b.querySelector('.ti').style.cssText='font-size:20px;color:#8A87A8'}})}
function langChips(apps){const e=apps&&apps.english;return e?(e.langs||[]).map(l=>`<span class="chip" style="background:${LN[l][1]};color:${LN[l][2]}">${LN[l][0]}</span>`).join(' '):''}
function go(next){location.href=next}
function after(r){A.set({token:r.token,user:r.user});if(NEXT)go(NEXT);else home(r.user)}

/* ---------- เข้าสู่ระบบ ---------- */
function login(note){hero('ยินดีต้อนรับสู่<br>Aloof Apps','บัญชีเดียว ใช้ได้ทุกแอป');
 show(`${field('user','u','อีเมล หรือ ชื่อผู้ใช้','text','username')}${field('lock','p','รหัสผ่าน','password','current-password')}
 <button class="btn" id="go">เข้าสู่ระบบ</button><div class="msg ${note?'err':''}" id="m">${esc(note||'')}</div>
 <div class="or">หรือ</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <button class="ol" id="inv" style="border:2px solid #EF9F27;color:#854F0B"><i class="ti ti-ticket"></i> มีโค้ดเชิญ</button>
  <button class="ol" id="stf" style="border:2px solid #378ADD;color:#0C447C"><i class="ti ti-building"></i> พนักงาน กฟส.</button></div>
 <div style="text-align:center;font-size:13px;color:#8A87A8">ลืมรหัสผ่าน? ติดต่อผู้ดูแลเพื่อตั้งรหัสใหม่</div>`,()=>{eyes();
  $('#inv').onclick=()=>invite();$('#stf').onclick=()=>go(NEXT?NEXT+(NEXT.includes('?')?'&':'?')+'staff=1':'/index.html');
  const sub=async()=>{const u=$('#u').value.trim(),p=$('#p').value;if(!u||!p){$('#m').className='msg err';$('#m').textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';return}
   const b=$('#go');busy(b,'กำลังเข้าสู่ระบบ…');$('#m').textContent='';
   try{const r=await A.api('login',{username:u,password:p});busy(b);if(!r.ok){$('#m').className='msg err';$('#m').textContent=r.msg;return}after(r)}catch(e){busy(b);$('#m').className='msg err';$('#m').textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'}};
  $('#go').onclick=sub;$('#p').onkeydown=e=>{if(e.key==='Enter')sub()};setTimeout(()=>{const x=$('#u');if(x)x.focus()},300)})}

/* ---------- โค้ดเชิญ ---------- */
function invite(pre){hero('มีโค้ดเชิญ<br>ใช่ไหม?','ใส่โค้ดที่ได้รับ เพื่อสร้างบัญชีของคุณ');
 show(`<h2>ใส่โค้ดเชิญ</h2><div class="sub">เช่น TEST-7K2Q</div>
 <label class="ip"><i class="ti ti-ticket"></i><input id="c" placeholder="โค้ดเชิญ" autocapitalize="characters" value="${esc(pre||'')}" style="text-transform:uppercase;letter-spacing:2px;font-weight:600"></label>
 <button class="btn" id="go" style="background:#EF9F27">ตรวจโค้ด</button><div class="msg" id="m"></div>
 <button class="link" id="bk">มีบัญชีแล้ว? เข้าสู่ระบบ</button>`,()=>{
  $('#bk').onclick=()=>login();
  const sub=async()=>{const c=$('#c').value.trim().toUpperCase();if(!c)return;const b=$('#go');busy(b,'กำลังตรวจ…');
   try{const r=await A.api('checkInvite',{code:c});busy(b);if(!r.ok){$('#m').className='msg err';$('#m').textContent=r.msg;return}register(c,r)}catch(e){busy(b);$('#m').className='msg err';$('#m').textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'}};
  $('#go').onclick=sub;$('#c').onkeydown=e=>{if(e.key==='Enter')sub()};if(pre)sub();else setTimeout(()=>{const x=$('#c');if(x)x.focus()},300)})}
function register(code,iv){let av='rocket';const t=A.TYPE[iv.type]||A.TYPE.tester;
 hero('สร้างบัญชี<br>ของคุณ','อีกขั้นเดียวก็เริ่มใช้ได้');
 show(`<div class="gift"><span style="width:48px;height:48px;border-radius:50%;background:#EF9F27;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;flex:none"><i class="ti ti-gift"></i></span>
  <div><div style="font-weight:700;color:#633806">โค้ด ${esc(code)} ใช้ได้!</div><div style="font-size:13px;color:#854F0B">${t[0]} · ${Object.keys(iv.apps).map(k=>(A.APPS[k]||{name:k}).name).join(', ')} · ${iv.days?iv.days+' วัน':'ไม่จำกัดเวลา'}</div></div></div>
 <div>${langChips(iv.apps)}</div>
 ${field('mood-smile','n','ชื่อเล่นที่อยากให้แสดง')}${field('at','u','อีเมล หรือ ชื่อผู้ใช้ (ภาษาอังกฤษ)','text','username')}${field('lock','p','ตั้งรหัสผ่าน (อย่างน้อย 6 ตัว)','password','new-password')}
 <div><div style="font-size:14px;color:#6B6890;margin-bottom:6px">เลือกรูปตัวแทน</div><div class="avs">${Object.keys(A.AV).map(k=>`<button class="av ${k===av?'on':''}" data-a="${k}" aria-label="${k}">${A.avatar(k,42)}</button>`).join('')}</div></div>
 <button class="btn g" id="go">เริ่มเลย</button><div class="msg" id="m"></div><button class="link" id="bk">เปลี่ยนโค้ด</button>`,()=>{eyes();
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{av=b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#bk').onclick=()=>invite();setTimeout(()=>{const x=$('#n');if(x)x.focus()},300);
  $('#go').onclick=async()=>{const n=$('#n').value.trim(),u=$('#u').value.trim(),p=$('#p').value,m=$('#m');m.className='msg err';
   if(!n)return m.textContent='ใส่ชื่อที่อยากให้แสดง';if(!/^[A-Za-z0-9_.@\-]{3,40}$/.test(u))return m.textContent='ชื่อผู้ใช้เป็นภาษาอังกฤษหรือตัวเลข 3 ตัวขึ้นไป (หรือใช้อีเมล)';if(p.length<6)return m.textContent='รหัสผ่านต้องยาวอย่างน้อย 6 ตัว';
   const b=$('#go');busy(b,'กำลังสร้างบัญชี…');m.textContent='';
   try{const r=await A.api('register',{code,name:n,username:u,password:p,avatar:av});busy(b);if(!r.ok){m.textContent=r.msg;return}
    A.set({token:r.token,user:r.user});confetti();welcome(r.user)}catch(e){busy(b);m.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'}}})}
function welcome(u){hero('เย้! พร้อมแล้ว','บัญชีของคุณสร้างเรียบร้อย');
 show(`<div style="text-align:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)">${A.avatar(u.avatar,96)}<h2 style="margin-top:12px">สวัสดี ${esc(u.name)}</h2><div class="sub" style="margin-top:4px">ชื่อผู้ใช้: ${esc(u.username)} · จำไว้ใช้เข้าครั้งหน้า</div></div>
 <button class="btn g" id="go">${NEXT?'ไปต่อเลย':'เริ่มใช้งาน'}</button>`,()=>{$('#go').onclick=()=>NEXT?go(NEXT):home(u)})}

/* ---------- หน้าแอปของฉัน ---------- */
function home(u){const t=A.TYPE[u.type]||A.TYPE.tester;hero('สวัสดี<br>'+esc(u.name),'เลือกแอปที่อยากใช้ได้เลย');
 const apps=Object.keys(u.apps||{}).filter(k=>A.APPS[k]);
 show(`<div style="display:flex;align-items:center;gap:12px">${A.avatar(u.avatar,52)}<div style="flex:1"><div style="font-weight:700;font-size:18px">${esc(u.name)}</div><div style="font-size:13px;color:#6B6890">${esc(u.username)}</div></div><span class="chip" style="background:${t[1]};color:${t[2]}">${t[0]}</span></div>
 ${u.expires?`<div style="font-size:13px;color:${u.expired?'#A32D2D':'#6B6890'}"><i class="ti ti-calendar"></i> ${u.expired?'หมดอายุแล้ว':'ใช้ได้ถึง'} ${new Date(u.expires).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}</div>`:''}
 <h2 style="font-size:18px;margin-top:6px">แอปของฉัน</h2>
 ${apps.map(k=>{const a=A.APPS[k];return `<a class="card" href="${a.url}"><span class="ai" style="background:${a.color};animation:none;width:52px;height:52px"><i class="ti ${a.icon}"></i></span><span style="flex:1"><b style="font-size:17px">${a.name}</b><br><span style="font-size:13px;color:#6B6890">${a.desc}</span><br>${k==='english'?langChips(u.apps):''}</span><i class="ti ti-chevron-right" style="font-size:22px;color:#AFA9EC"></i></a>`}).join('')||'<div class="msg">ยังไม่มีแอปในบัญชีนี้ ติดต่อผู้ดูแล</div>'}
 <button class="link" id="out" style="margin-top:8px;color:#8A87A8"><i class="ti ti-logout"></i> ออกจากระบบ</button>`,()=>{$('#out').onclick=()=>{const a=A.get();if(a)A.api('logout',{token:a.token}).catch(()=>{});A.set(null);login()}})}

/* ---------- เริ่ม ---------- */
(async()=>{const a=A.get(),code=P.get('code');
 if(code&&!a)return invite(code.toUpperCase());
 if(!a)return login();
 try{const r=await A.api('me',{token:a.token});if(!r.ok){A.set(null);return login(r.msg)}A.set({token:a.token,user:r.user});if(NEXT&&!r.user.expired)return go(NEXT);home(r.user)}
 catch(e){if(a.user)home(a.user);else login('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง')}})();
</script>
</body>
</html>
