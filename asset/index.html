<!DOCTYPE html>
<html lang="th">
<head>
<script src="/pea-hub.js" data-app="asset" data-name="ทรัพย์สิน ผปร."></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ทรัพย์สิน ผปร. · กฟส.อ่าวลึก</title>
<meta name="theme-color" content="#2a0f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ทรัพย์สิน ผปร.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{--top:#2a0f33;--pea:#6a1b74;--pea2:#4a0f52;--peaBg:#f3ebf5;--gold:#f2b33d;--bg:#f6f5f8;--card:#fff;--line:#e4e1ea;--ink:#1c1a22;--mute:#5f5a6b;--faint:#a39dae;
  --blue:#1a4fa0;--blueBg:#e6effc;--warn:#8a4500;--warnBg:#fff1dc;--red:#9b1c1c;--redBg:#fde8e8;--green:#0f6b3f;--greenBg:#e3f5ea;--gray:#3d3a45;--grayBg:#efedf2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pea);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.app{display:flex;flex-direction:column;position:fixed;inset:0}
.top{background:var(--top);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex:none}
.top .logo{width:38px;height:38px;border-radius:10px;background:var(--gold);display:grid;place-items:center;flex:none}
.top h1{font-size:17px;margin:0;font-weight:700;line-height:1.15}
.top small{display:block;font-weight:400;color:#d9cfe0;font-size:12.5px}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:44px;height:44px;display:grid;place-items:center}
.main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 28px}
.bnav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mute);font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;position:relative}
.bnav button.on{color:var(--pea);font-weight:700}
.bnav .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--top);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bnav .dot[hidden]{display:none}
@media (max-width:440px){.bnav button{font-size:11.5px}}
h2.t{margin:2px 0 4px;font-size:22px}
.muted{color:var(--mute);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 10px;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.st{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.st.on{border:2px solid var(--pea);background:#fcf8fd}
.st .h{display:flex;align-items:center;gap:10px}
.st .n{width:32px;height:32px;border-radius:50%;background:var(--peaBg);color:var(--pea2);display:grid;place-items:center;font-weight:700;flex:none}
.st.on .n{background:var(--pea);color:#fff}
.st .h b{font-size:16.5px}
.st .now{margin-left:auto;font-size:12px;font-weight:700;color:var(--pea2);background:var(--peaBg);padding:2px 10px;border-radius:999px}
.st p{margin:0;font-size:14px;color:var(--mute)}
.pbar{height:8px;border-radius:4px;background:#eeeaf2;overflow:hidden}.pbar i{display:block;height:8px;background:var(--pea);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.kpi span{font-size:13px;color:var(--mute)}.kpi b{font-size:26px;line-height:1.25}.kpi small{font-size:12px;color:var(--mute)}
.kpi.w{background:#fffaf0;border-color:#f3dcae}.kpi.w b,.kpi.w span,.kpi.w small{color:var(--warn)}
.bars .r{padding:7px 0}.bars .r .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.bars .r .l span{color:var(--mute)}
.bars .b{height:10px;border-radius:5px;background:#eeeaf2;overflow:hidden}.bars .b i{display:block;height:10px;background:#e8911e;border-radius:5px}
.al{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;margin-top:8px;text-align:left;width:100%;border:0}
.al .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.al b{display:block;font-size:14.5px}.al span{font-size:13px}
.al.r{background:var(--redBg);color:var(--red)}.al.r .ic{background:#f9caca}
.al.w{background:var(--warnBg);color:#6b3500}.al.w .ic{background:#f8dcae}
.al.b{background:var(--peaBg);color:var(--pea2)}.al.b .ic{background:#e4d2ea}
/* tools */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;border:1.5px solid #cfc9d8;border-radius:12px;padding:0 12px;height:48px;background:#fff}
.search input{border:0;outline:none;flex:1;min-width:0;font-size:15px;height:44px;background:transparent}
select.s{min-height:48px;border:1.5px solid #cfc9d8;border-radius:12px;padding:0 10px;background:#fff;font-size:14.5px;max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:#ebe7f0}
.seg button{border:0;background:transparent;min-height:40px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--gray)}
.seg button.on{background:#fff;color:var(--pea2);font-weight:700;box-shadow:0 1px 2px rgba(40,10,50,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #cfc9d8;background:#fff;font-size:14px}
.chip.on{border-color:var(--pea);background:var(--peaBg);color:var(--pea2);font-weight:600}
/* list */
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ri{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}
.ri.sel{border-color:#cdb2d6;background:#fcf8fd}
.ri input[type=checkbox]{width:22px;height:22px;accent-color:var(--pea);flex:none}
.ri .t{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:1px}
.ri .t b{font-size:15px;line-height:1.3}
.ri .t small{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .v{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.ri .v .c{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ri .th{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#eee}
.age{flex:none;width:52px;text-align:center;border-radius:12px;padding:4px 0;background:var(--grayBg);line-height:1.1}.age b{display:block;font-size:18px}.age span{font-size:11px;color:var(--mute)}.age.o{background:var(--warnBg)}.age.o b{color:var(--warn)}
@media (max-width:520px){.ri .v .c{display:none}.ri .th{width:40px;height:40px}}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--greenBg);color:var(--green)}.tag.r{background:var(--redBg);color:var(--red)}.tag.w{background:var(--warnBg);color:var(--warn)}
.tag.g{background:var(--grayBg);color:var(--gray)}.tag.p{background:var(--peaBg);color:var(--pea2)}.tag.b{background:var(--blueBg);color:var(--blue)}
.tag.o{background:#fff;color:var(--mute);border:1px solid #d9d4e0}
.actbar{position:sticky;bottom:0;margin-top:12px;background:var(--top);color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -4px 18px rgba(40,10,50,.18)}
.actbar b{font-size:15.5px}.actbar span{font-size:13px;color:#d9cfe0}
.actbar .btn{border-color:#5a3d66;background:transparent;color:#fff}.actbar .btn.y{background:var(--gold);border-color:var(--gold);color:var(--top)}
.btn{border:1px solid #cfc9d8;background:#fff;border-radius:12px;min-height:44px;padding:0 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn.p{background:var(--pea);border-color:var(--pea);color:#fff}
.btn.y{background:var(--gold);border-color:var(--gold);color:var(--top)}
.btn.d{color:var(--red);border-color:#efc4c4}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.note{background:var(--warnBg);border:1px solid #f1d9b0;color:#7a3d06;border-radius:12px;padding:10px 14px;font-size:13.5px}
.note.b{background:var(--blueBg);border-color:#c9dbf5;color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #f0edf4;font-size:14px}.kv span:first-child{color:var(--mute);flex:none}.kv span:last-child{text-align:right}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(20,10,25,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
@media (min-width:760px){.dim{align-items:center}}
.sheet{background:#fff;width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{border-radius:20px}}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}.sheet .hd h3{flex:1;margin:4px 0 0;font-size:18px;line-height:1.3}
.xbtn{border:0;background:var(--grayBg);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.conds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.conds button{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15.5px;font-weight:600}
.conds button.on{border-width:2.5px}
.conds .ok.on{border-color:var(--green);background:var(--greenBg);color:var(--green)}
.conds .r.on{border-color:var(--red);background:var(--redBg);color:var(--red)}
.conds .w.on{border-color:#c46a00;background:var(--warnBg);color:var(--warn)}
.conds .p.on{border-color:var(--pea);background:var(--peaBg);color:var(--pea2)}
.conds .g.on{border-color:var(--gray);background:var(--grayBg);color:var(--gray)}
.photo{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.photo img{width:110px;height:110px;object-fit:cover;border-radius:12px;background:#eee}
.photo label{width:110px;height:110px;border-radius:12px;border:2px dashed #b9a5c2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--pea);font-size:13.5px;font-weight:600;cursor:pointer;text-align:center}
label.f{display:block;margin-top:12px}label.f>span{display:block;font-size:13.5px;color:var(--mute);margin-bottom:4px}
label.f input,label.f textarea,label.f select{width:100%;border:1px solid #cfc9d8;border-radius:10px;min-height:44px;padding:8px 12px;font-size:15px;background:#fff}
.flbl{font-size:14px;font-weight:600;margin-top:14px}
/* batch */
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stp button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px}
.stp .n{width:30px;height:30px;border-radius:50%;background:var(--grayBg);display:grid;place-items:center;font-weight:700;flex:none}
.stp .d .n{background:#0f8a52;color:#fff}.stp .c .n{background:var(--pea);color:#fff}
.stp .sel button{border:2px solid var(--pea);background:#fcf8fd}.stp b{display:block;font-size:14px;line-height:1.3}.stp small{color:var(--mute);font-size:12px}
.bw{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:860px){.bw{grid-template-columns:1fr}}
.pp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;margin-top:6px;align-items:center}.pp .pl{grid-column:1/-1;margin-bottom:-4px}
.pp input,label.f select{width:100%;border:1px solid #cfc9d8;border-radius:10px;min-height:44px;padding:6px 12px;font-size:15px;background:#fff}
.ckb{display:flex;gap:10px;align-items:center;min-height:40px;font-size:14.5px}.ckb input{width:20px;height:20px;accent-color:var(--pea)}
.docs{display:flex;flex-direction:column;gap:8px;margin-top:6px}.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.pt{width:100%;border-collapse:collapse;font-size:14px}.pt th,.pt td{border-bottom:1px solid #f0edf4;padding:6px 4px;text-align:right}.pt th:first-child,.pt td:first-child{text-align:left}
.pt input{width:84px;border:1px solid #cfc9d8;border-radius:8px;min-height:40px;padding:0 6px;text-align:right;font-size:15px}.pt .mx{font-weight:700;white-space:nowrap}
.bc{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;width:100%}
.bc:hover{border-color:#cdb7d4}
.bc .h{display:flex;justify-content:space-between;gap:10px;align-items:center}.bc .h b{font-size:16.5px}
.mini{display:flex;gap:4px}.mini i{flex:1;height:6px;border-radius:3px;background:#eeeaf2}.mini i.d{background:#0f8a52}.mini i.c{background:var(--pea)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.flow li{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
.flow li .k{display:flex;align-items:center}
.flow li .n{width:30px;height:30px;border-radius:50%;background:#efedf2;color:var(--mute);display:grid;place-items:center;font-weight:700;flex:none}
.flow li .ln{flex:1;height:3px;background:#e9e5f0;margin-left:6px}
.flow li.d .n{background:#0f8a52;color:#fff}.flow li.d .ln{background:#0f8a52}
.flow li.c .n{background:var(--pea);color:#fff;box-shadow:0 0 0 4px #ead9ef}
.flow li b{color:var(--ink);font-size:13.5px;line-height:1.3}
@media (max-width:560px){.flow li b{font-size:12px}.flow li small{display:none}}
.next{border-radius:16px;background:#fcf8fd;border:1.5px solid #dcc6e3;padding:14px;margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.next b{font-size:16px}.next p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.rp{display:grid;grid-template-columns:minmax(0,1fr) 110px 80px 110px 130px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #f0edf4;font-size:14px}
.rp input,.rp select{min-height:40px;border:1px solid #cfc9d8;border-radius:10px;padding:0 8px;width:100%;background:#fff}
@media (max-width:680px){.rp{grid-template-columns:minmax(0,1fr) 1fr 1fr}.rp .nm{grid-column:1/-1}}
.drop{border:2px dashed #b9a5c2;background:#fff;border-radius:18px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop.over{background:#f6eef8;border-color:var(--pea)}
.ofc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 12px}
.lf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0edf4}
.lf input{width:70px;min-height:40px;border:1px solid #cfc9d8;border-radius:10px;text-align:center}
.ag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border-radius:12px;background:#faf8fc;border:1px solid #eee8f2;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a0f33;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:80;display:none;max-width:90vw}
.sr{position:absolute;left:-9999px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
.spin.k{border-color:rgba(106,27,116,.2);border-top-color:var(--pea)}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a0f33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div><h1>ทรัพย์สิน ผปร.</h1><small id="sub">กำลังโหลด…</small></div>
    <div class="sp"></div>
    <button class="ibtn" id="reload" aria-label="โหลดข้อมูลใหม่"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
    <a class="ibtn" href="/index.html" aria-label="กลับศูนย์รวมงาน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></a>
  </header>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
  <nav class="bnav" aria-label="เมนูหลัก">
    <button data-t="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>หน้าแรก</button>
    <button data-t="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>ทะเบียน</button>

<script>
'use strict';
const DONE = 11;   // ปิดชุดหลังครบ 10 ขั้นตามแบบฟอร์มจำหน่าย
/* ---------------- ตั้งค่า ---------------- */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbyQr-MES9knLHnBUv4Y7GG_w2igFhXTKEvcEp-Oyg55212nW39nCjSGFtLWnsWvfkqr4A/exec';   // ← ลิงก์ Web app หลังบ้านระบบทรัพย์สิน (…/exec) · ว่าง = โหมดทดลอง เก็บในเครื่องนี้
const lsr = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const API_URL = () => lsr('asset_api') || API_DEFAULT;
const LOCAL = () => !API_URL();
const cred = () => ({ user: lsr('pea_aoluek_username') || '', pass: lsr('pea_aoluek_password') || '' });
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baht = (n, d) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d });
const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2600); };
const CATS = [['Z51', 'เฟอร์นิเจอร์/สำนักงาน'], ['Z53', 'คอมพิวเตอร์'], ['Z55', 'เครื่องมือ'], ['Z57', 'เครื่องใช้อื่น'], ['Z58', 'วิทยุสื่อสาร'], ['Z60', 'ยานพาหนะ'], ['Z63', 'ยานพาหนะ']];
const CAT_NAMES = ['เครื่องมือ', 'เฟอร์นิเจอร์/สำนักงาน', 'วิทยุสื่อสาร', 'คอมพิวเตอร์', 'ยานพาหนะ', 'เครื่องใช้อื่น', 'อื่นๆ'];
const CONDS = [['ใช้ได้', 'ok'], ['ชำรุด', 'r'], ['เสื่อมสภาพ', 'w'], ['เลิกใช้', 'p'], ['ไม่พบ', 'g']];
const CCLS = Object.fromEntries(CONDS);
const STEPS = DOCS.STEPS.map(x => [x.t, x.docs.map(d => d[1]).join(' · ')]);
const DEF_SETTINGS = { life: { Z51: 5, Z53: 5, Z55: 5, Z57: 5, Z58: 5, Z60: 5, Z63: 5 }, aliases: { 'คอนคัตเตอร์คัฟเวอร์': 'Conductor Cover', 'คอนดักเตอร์คัฟเวอร์': 'Conductor Cover', 'คอนดัคเตอร์คัฟเวอร์': 'Conductor Cover', 'Conductor cover(Class 4)': 'Conductor Cover' },
  memo: { org: 'กฟส.อ่าวลึก แผนกปฏิบัติการระบบไฟฟ้า', prefix: 'ต.2กฟส.อล.(ปร.)', to: 'ผจก.กฟส.อ่าวลึก', proposer: '', proposerTitle: 'หผปร.กฟส.อ่าวลึก' } };

/* ---------------- สถานะ ---------------- */
let DB = { assets: [], ins: {}, batches: [], settings: DEF_SETTINGS, me: { name: cred().user, admin: false }, lastImport: null };
let A = [], AM = {};       // รายการที่คำนวณแล้ว · ตามรหัส
const SEL = new Set();
const ST = { tab: 'home', q: '', cat: '', owner: '', mode: 'all', lim: 60, chkOwner: '', chkMode: 'todo', batch: null };

/* ---------------- หลังบ้าน ---------------- */
async function api(action, payload) {
  if (LOCAL()) return localApi(action, payload || {});
  const c = cred();
  if (!c.user) { const e = new Error('ยังไม่ได้เข้าสู่ระบบศูนย์รวมงาน'); e.code = 'unauthorized'; throw e; }
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 90000);
  let j;
  try {
    const r = await fetch(API_URL(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, user: c.user, pass: c.pass }, payload || {})), signal: ctrl.signal });
    j = await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต'); }
  finally { clearTimeout(t); }
  if (!j || !j.ok) { const e = new Error((j && (j.message || j.error)) || 'ไม่ทราบสาเหตุ'); e.code = j && j.error; throw e; }
  return j;
}
/* โหมดทดลอง: เก็บในเครื่องนี้ กติกาเดียวกับหลังบ้าน */
function localApi(action, b) {
  const L = JSON.parse(lsr('asset_local') || 'null') || { assets: [], ins: [], batches: [], settings: DEF_SETTINGS, lastImport: null };
  const me = cred().user || 'ทดลอง', now = new Date().toISOString(), save = () => { try { lsr('asset_local', JSON.stringify(L)); } catch (e) {} };
  const ok = o => Promise.resolve(Object.assign({ ok: true }, o || {}));
  const bad = m => Promise.reject(new Error(m));
  const latest = () => { const m = {}; L.ins.forEach(r => m[r[0]] = r); return Object.values(m); };
  const busy = ex => { const m = {}; L.batches.forEach(x => { if (x.step < DONE && x.id !== ex) x.codes.forEach(c => m[c] = x.id); }); return m; };
  const has = c => L.assets.some(a => a[0] === c);
  if (action === 'bootstrap') return ok({ assets: L.assets, inspections: latest(), batches: L.batches, settings: L.settings, lastImport: L.lastImport, me: { name: me, admin: true }, local: true });
  if (action === 'history') return ok({ history: L.ins.filter(r => r[0] === b.code).reverse() });
  if (action === 'importRegister') {
    const idx = {}; L.assets.forEach((a, i) => { idx[a[0]] = i; a[11] = false; });
    let added = 0;
    b.rows.forEach(r => { const rec = r.slice(0, 11).concat([true, '', r[11] === '' || r[11] == null ? null : +r[11], r[13] || '', r[14] || '']); if (r[0] in idx) { rec[12] = L.assets[idx[r[0]]][12]; L.assets[idx[r[0]]] = rec; } else { L.assets.push(rec); added++; } });
    L.lastImport = { at: now, by: me, file: b.file, rows: b.rows.length }; save();
    return ok({ rows: b.rows.length, added, gone: L.assets.filter(a => !a[11] && !a[12]).length });
  }
  if (action === 'inspect') {
    if (!has(b.code)) return bad('ไม่พบรหัสสินทรัพย์นี้ในทะเบียน');
    const rec = [b.code, b.cond, b.note || '', b.photo ? 'local' : (b.keepPhoto || ''), me, now];
    if (b.photo) { try { lsr('asset_ph_' + b.code, b.photo); rec[3] = 'local:' + b.code; } catch (e) { rec[3] = ''; } }
    L.ins.push(rec); save(); return ok({ inspection: rec });
  }
  if (action === 'createBatch') {
    const bz = busy(); const codes = [...new Set(b.codes)].filter(has);
    if (codes.some(c => bz[c])) return bad('มีรายการอยู่ในชุดจำหน่ายอื่นที่ยังไม่ปิด');
    const y = new Date().getFullYear() + 543, seq = L.batches.filter(x => x.name.includes('/' + y)).length + 1;
    const x = { id: 'D' + Date.now(), name: b.name || ('ชุดที่ ' + seq + '/' + y), step: 1, codes, committee: ['', '', ''], docNo: '', replace: {}, log: { 1: now }, note: '', by: me, at: now, upBy: me, upAt: now, data: {} };
    L.batches.push(x); save(); return ok({ batch: x });
  }
  if (action === 'updateBatch') {
    const x = L.batches.find(z => z.id === b.id); if (!x) return bad('ไม่พบชุดจำหน่าย');
    if (x.step >= DONE && !b.reopen) return bad('ชุดนี้ปิดแล้ว');
    ['name', 'committee', 'docNo', 'replace', 'note'].forEach(k => { if (b[k] != null) x[k] = b[k]; });
    if (b.data) x.data = Object.assign({}, x.data || {}, b.data);
    if (b.codes) { const bz = busy(x.id); x.codes = [...new Set(b.codes)].filter(c => has(c) && !bz[c]); }
    if (b.step) {
      const s = Math.max(1, Math.min(DONE, b.step));
      if (s > x.step) x.log[s] = now; else Object.keys(x.log).forEach(k => { if (+k > s) delete x.log[k]; });
      x.step = s;
      L.assets.forEach(a => { if (x.codes.includes(a[0])) a[12] = s >= DONE ? x.id : ''; });

    x.upBy = me; x.upAt = now; save(); return ok({ batch: x });
  }

  if (action === 'saveSettings') { L.settings = Object.assign({}, L.settings, { life: Object.assign({}, L.settings.life, b.life || {}) }, b.aliases ? { aliases: b.aliases } : {}, b.memo ? { memo: Object.assign({}, L.settings.memo, b.memo) } : {}, b.office ? { office: b.office } : {}); save(); return ok({ settings: L.settings }); }
  return bad('โหมดทดลองไม่รองรับ');
}

/* ---------------- คำนวณ ---------------- */
function catOf(cls) { const p = String(cls).slice(0, 3); const c = CATS.find(x => x[0] === p); return c ? c[1] : 'อื่นๆ'; }
function lifeOf(cls) { const L = (DB.settings && DB.settings.life) || DEF_SETTINGS.life; return Number(L[String(cls).slice(0, 3)]) || 5; }
function stdName(n) { const al = (DB.settings && DB.settings.aliases) || {}; return al[n] || n; }
function build() {
  const now = Date.now(), open = {};
  DB.batches.forEach(x => { if (x.step < DONE) x.codes.forEach(c => open[c] = x); });
  A = DB.assets.map(r => {
    const [code, cls, wbs, name, plate, brand, serial, acq, cost, owner, sap, inLatest, disposed, sapBv, sapCat, emp] = r;
    const t = acq ? new Date(acq + 'T00:00:00').getTime() : NaN;
    const age = isNaN(t) ? null : (now - t) / (365.25 * 86400000);
    const life = lifeOf(cls), real = sapBv != null && sapBv !== '';
    const full = real ? Number(sapBv) <= 1 : (age != null && age >= life);
    const bv = real ? Number(sapBv) : !cost ? 0 : age == null ? null : Math.max(1, cost * (1 - age / life));
    const ins = DB.ins[code] || null, std = stdName(name);
    const lease = /สิ้นสุดสัญญา/.test(name + ' ' + plate);
    const it = { code, cls, wbs, name, std, plate, brand, serial, acq, cost: Number(cost) || 0, owner, sap, inLatest: inLatest !== false, disposed: disposed || '', cat: sapCat || catOf(cls), age, life, full, real, bv: real ? bv : full ? Math.min(1, cost || 1) : bv, emp: emp || '', ins, lease, batch: open[code] || null };
    it.rec = recOf(it);
    it.key = (code + ' ' + name + ' ' + std + ' ' + plate + ' ' + brand + ' ' + serial + ' ' + wbs + ' ' + owner).toLowerCase();
    return it;
  });
  AM = Object.fromEntries(A.map(a => [a.code, a]));
  A.sort((a, b) => (a.acq || '9999').localeCompare(b.acq || '9999') || a.code.localeCompare(b.code));
  const nOpen = DB.batches.filter(x => x.step < DONE).length, d = $('#bdot');
  d.hidden = !nOpen; d.textContent = nOpen;
}
function recOf(it) {
  if (it.disposed) return { t: 'จำหน่ายแล้ว', c: 'g', pick: false };
  if (it.batch) return { t: 'อยู่ใน' + it.batch.name, c: 'p', pick: false };
  const c = it.ins && it.ins[1];
  if (c === 'ชำรุด' || c === 'เสื่อมสภาพ' || c === 'เลิกใช้') return { t: 'เสนอจำหน่าย', c: 'r', pick: true };
  if (c === 'ไม่พบ') return { t: 'สอบข้อเท็จจริง', c: 'w', pick: true };
  if (it.lease) return { t: 'ตรวจสัญญาเช่า', c: 'b', pick: true };
  if (c === 'ใช้ได้') return { t: 'เก็บใช้ต่อ', c: 'ok', pick: false };
  return it.full ? { t: '1 บาท · พร้อมจำหน่าย', c: 'w', pick: true } : { t: 'ยังมีมูลค่า', c: 'o', pick: false };
}
const active = () => A.filter(a => !a.disposed);
const condTag = it => it.ins ? `<span class="tag ${CCLS[it.ins[1]] || 'g'}">${esc(it.ins[1])}</span>` : '<span class="tag o">ยังไม่ตรวจ</span>';
const yearTH = d => d ? new Date(d + 'T00:00:00').getFullYear() + 543 : '–';
function thDate(s) { if (!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); }
function thDay(d) { return (d ? new Date(d) : new Date()).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' }); }
function acqTH(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '–'; }
function photoUrl(id, w) { if (!id) return ''; if (id.startsWith('local:')) return lsr('asset_ph_' + id.slice(6)) || ''; return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 600); }
const ADM = () => !!(DB.me && DB.me.admin);

/* ---------------- หน้าแรก ---------------- */
function viewHome() {
  if (!DB.assets.length) {
    $('#view').innerHTML = `<h2 class="t">เริ่มต้นใช้งาน</h2><p class="muted">ยังไม่มีทะเบียนทรัพย์สินในระบบ — นำเข้าไฟล์ทะเบียน (.xls) ที่ export จาก SAP ก่อน</p>
      ${LOCAL() ? '<div class="note" style="margin:12px 0">โหมดทดลอง: ยังไม่ได้ต่อหลังบ้าน ข้อมูลจะเก็บในเครื่องนี้เครื่องเดียว</div>' : ''}
      <button class="btn p" id="goImp" style="margin-top:8px">นำเข้าทะเบียนจาก SAP</button>`;
    $('#goImp').onclick = () => go('set');
    return;
  }
  const act = active(), done = act.filter(a => a.ins).length, full = act.filter(a => a.full);
  const cand = act.filter(a => a.rec.pick), openB = DB.batches.filter(x => x.step < DONE);
  const y = new Date().getFullYear(), soldY = DB.batches.filter(x => x.step >= DONE && x.log[DONE] && new Date(x.log[DONE]).getFullYear() === y).reduce((s, x) => s + x.codes.length, 0);
  const old30 = act.filter(a => a.age != null && a.age >= 30).length;
  const oldest = act.filter(a => a.acq)[0];
  const on = cand.length ? 2 : openB.length ? 3 : 1;
  const stepCard = (n, title, desc, extra, btn, tab) => `<div class="st${on === n ? ' on' : ''}"><div class="h"><span class="n">${n}</span><b>${title}</b>${on === n ? '<span class="now">ทำต่อ</span>' : ''}</div><p>${desc}</p>${extra}<div><button class="btn${on === n ? ' p' : ''}" data-go="${tab}">${btn}</button></div></div>`;
  let h = `<h2 class="t">จำหน่ายทรัพย์สินใน 3 ขั้น</h2><p class="muted" style="margin:0">ทำตามลำดับ ระบบจะบอกว่าต้องทำอะไรต่อ</p>`;
  if (LOCAL()) h += `<div class="note" style="margin-top:10px">โหมดทดลอง: ยังไม่ได้ต่อหลังบ้าน ข้อมูลจะเก็บในเครื่องนี้เครื่องเดียว</div>`;
  h += `<div class="steps">` +
    stepCard(1, 'ตรวจสภาพ', 'สแกน QR หรือเลือกรายการ บันทึก ใช้ได้ / ชำรุด / เสื่อมสภาพ / ไม่พบ พร้อมรูป',
      `<div><div class="row muted" style="justify-content:space-between"><span>ตรวจแล้ว</span><span>${done} / ${act.length}</span></div><div class="pbar"><i style="width:${act.length ? done / act.length * 100 : 0}%"></i></div></div>`, 'เริ่มตรวจ', 'check') +
    stepCard(2, 'คัดเลือกเข้าชุด', 'ระบบคัดของที่ชำรุด/เสื่อมสภาพ/ไม่พบไว้ให้ ติ๊กยืนยันแล้วสร้างชุด',
      `<div class="muted">พร้อมเข้าชุด <b style="color:var(--ink);font-size:17px">${cand.length}</b> รายการ</div>`, 'คัดเลือก', 'pick') +
    stepCard(3, 'นำเสนอจำหน่าย', 'ระบบออกบันทึกและบัญชีรายการให้ พิมพ์เสนอลงนาม ติดตามจนตัดจาก SAP',
      `<div class="muted">ชุดที่กำลังดำเนินการ <b style="color:var(--ink);font-size:17px">${openB.length}</b> ชุด</div>`, 'ดูชุดจำหน่าย', 'batch') + `</div>`;
  h += `<div class="kpis">
    <div class="kpi"><span>ทรัพย์สินที่ใช้อยู่</span><b>${act.length.toLocaleString('th-TH')}</b><small>ราคาทุน ${(act.reduce((s, a) => s + a.cost, 0) / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 })} ล้าน · บัญชี ${(act.reduce((s, a) => s + (a.bv || 0), 0) / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 })} ล้านบาท</small></div>
    <button class="kpi w" id="kFull" style="text-align:left"><span>มูลค่าเหลือ 1 บาท</span><b>${full.length.toLocaleString('th-TH')}</b><small>${act.length ? Math.round(full.length / act.length * 100) : 0}% · ${act.some(a => a.real) ? 'ตามมูลค่าบัญชี SAP' : 'ประมาณจากอายุใช้งาน'} · กดดูรายการ</small></button>
    <div class="kpi"><span>อายุเกิน 30 ปี</span><b>${old30}</b><small>${oldest ? 'เก่าสุดได้มาปี ' + yearTH(oldest.acq) : ''}</small></div>

  const byCat = {};
  act.forEach(a => { const c = byCat[a.cat] = byCat[a.cat] || [0, 0]; c[0]++; if (a.full) c[1]++; });
  const cats = Object.keys(byCat).sort((x, y) => byCat[y][0] - byCat[x][0]).slice(0, 10);

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const M = 1280, s = Math.min(1, M / Math.max(img.width, img.height));

      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

  $$('[data-k]').forEach(b => b.onclick = () => { ST.chkMode = b.dataset.k; ST.lim = 60; viewCheck(); });

    const i = L.findIndex(x => x.code === code);

async function readFile(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer(), u = new Uint8Array(buf);
    let rows;
    if ((u[0] === 0x50 && u[1] === 0x4B) || (u[0] === 0xD0 && u[1] === 0xCF)) {   // .xlsx (zip) หรือ .xls (Excel จริง)
      await loadXLSX();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      rows = [];
      wb.SheetNames.forEach(n => { rows = rows.concat(parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }))); });
    } else rows = parseRegister(decode(buf));
    if (!rows.length) return toast('อ่านไม่พบรายการทรัพย์สินในไฟล์ ' + file.name, 4000);
    PEND = { file: file.name, rows, state: '' }; drawPend();
  } catch (e) { toast('อ่านไฟล์ ' + file.name + ' ไม่ได้' + (e && /โหลด/.test(e.message) ? ' — ' + e.message : ''), 4000); }
}
function drawPend() {
  const el = $('#prev'); if (!el) return;
  if (!PEND) { el.innerHTML = ''; return; }
  const old = new Set(DB.assets.map(a => a[0])), now = new Set(PEND.rows.map(r => r[0]));
  const add = PEND.rows.filter(r => !old.has(r[0])).length, gone = [...old].filter(c => !now.has(c)).length;
  const noDate = PEND.rows.filter(r => !r[7]).length;
  el.innerHTML = `<div style="margin-top:12px;padding:12px;border-radius:14px;background:#faf8fc;border:1px solid #eee8f2"><b>${esc(PEND.file)}</b>
    <div class="kv"><span>รายการในไฟล์</span><span>${PEND.rows.length}</span></div><div class="kv"><span>ราคาทุนรวม</span><span>${baht(PEND.rows.reduce((s, r) => s + r[8], 0))} บาท</span></div>${PEND.rows.some(r => r[11] !== '') ? `<div class="kv"><span>มูลค่าตามบัญชีรวม</span><span>${baht(PEND.rows.reduce((s, r) => s + (Number(r[11]) || 0), 0))} บาท · เหลือ 1 บาท ${PEND.rows.filter(r => r[11] !== '' && Number(r[11]) <= 1).length} รายการ</span></div>` : '<div class="kv"><span>มูลค่าตามบัญชี</span><span style="color:var(--warn)">ไม่มีในไฟล์ · ใช้ประมาณจากอายุ</span></div>'}
    <div class="kv"><span>เทียบกับในระบบ</span><span>${old.size ? 'ใหม่ ' + add + ' · หายจากไฟล์ ' + gone : 'นำเข้าครั้งแรก'}</span></div>${noDate ? `<div class="kv"><span>อ่านวันที่ไม่ได้</span><span style="color:var(--warn)">${noDate} รายการ</span></div>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sm" id="pc">ยกเลิก</button><button class="btn p" id="ps"${ADM() ? '' : ' disabled'}>${PEND.state === 'run' ? '<span class="spin"></span> กำลังบันทึก…' : 'บันทึกเข้าระบบ'}</button></div>${PEND.state && PEND.state !== 'run' ? `<p style="color:var(--red);margin:6px 0 0">${esc(PEND.state)}</p>` : ''}</div>`;
  $('#pc').onclick = () => { PEND = null; drawPend(); };
  $('#ps').onclick = async () => {
    if (PEND.state === 'run') return;
    PEND.state = 'run'; drawPend();
    try { const r = await api('importRegister', { file: PEND.file, rows: PEND.rows }); PEND = null; await load(true); toast('นำเข้าแล้ว ' + r.rows + ' รายการ' + (r.added && DB.assets.length !== r.rows ? ' · ใหม่ ' + r.added : ''), 3500); go('home'); }
    catch (e) { PEND.state = e.message; drawPend(); }
  };
}

function render() { ({ list: viewList, check: viewCheck, batch: viewBatch, set: viewSet }[ST.tab] || viewHome)(); }

$$('.bnav button').forEach(b => b.onclick = () => { if (b.dataset.t === 'batch' && ST.tab === 'batch') ST.batch = null; if (b.dataset.t === 'list' && ST.tab !== 'list') { ST.mode = 'all'; } go(b.dataset.t); });

}

  build(); setSub();

let FIRST = true;
async function load(quiet) {

    const j = await api('bootstrap');

    if (!LOCAL()) lsr('asset_cache', JSON.stringify(j));
    if (!$('#dim').classList.contains('show')) render();
    if (FIRST) { FIRST = false; openFromUrl(); }
  } catch (e) {
    if (!quiet) toast(e.message, 4000);
    $('#sub').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
  } finally {
    rb.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>';
  }
}
function openFromUrl() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (AM[id]) { if (!AM[id].disposed) inspectForm(id); else showAsset(id); } else toast('ไม่พบรหัส ' + id + ' ในทะเบียน', 4000);
}
$('#reload').onclick = () => load();

(function boot() {
  const c = !LOCAL() && lsr('asset_cache');
  if (c) { try { apply(JSON.parse(c)); render(); } catch (e) { render(); } }   // เปิดทันทีจากข้อมูลครั้งก่อน แล้วค่อยอัปเดต
  else render();
  (function wait(n) { if (cred().user || LOCAL() || n > 600) load(!!c); else setTimeout(() => wait(n + 1), 500); })(0);
})();
