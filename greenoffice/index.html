<style>
/* Layout: flash-card drill — one working column on phones, cards + side panel on wide screens. Leaf green = practice, plum = inspector mode */
:root{
  --bg:#F2F6F0; --surface:#FFFFFF; --sunk:#E6EFE4; --line:#D3E0D0; --ink:#17271B; --mute:#56685A;
  --acc:#2C6A3A; --acc-ink:#FFFFFF; --acc-soft:#DDEEDD;
  --plum:#5B2C83; --plum-soft:#EFE6F7; --plum-ink:#FFFFFF;
  --ok:#2E7D32; --ok-soft:#E3F2E4; --bad:#B3261E; --bad-soft:#FBE7E5; --note:#7A4F00; --note-soft:#FFF3DA;
  --f-display:"Prompt",Tahoma,"Leelawadee UI",sans-serif; --f-body:"Sarabun",Tahoma,"Leelawadee UI",sans-serif;
  --r:14px;
  --l1:#2E7D32; --l1-soft:#E3F2E4; --l2:#9A6400; --l2-soft:#FFF1D6; --l3:#B3261E; --l3-soft:#FBE7E5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A14; --surface:#1B261E; --sunk:#223026; --line:#33463A; --ink:#E7F1E8; --mute:#A7BCAB;
  --acc:#7FC98E; --acc-ink:#0E1A11; --acc-soft:#25402C; --plum:#C29BE6; --plum-soft:#352548; --plum-ink:#1A1022;
  --ok:#86CF8C; --ok-soft:#1E3522; --bad:#F2928A; --bad-soft:#3E201E; --note:#EBC170; --note-soft:#3A2E15; --l1:#86CF8C; --l1-soft:#1E3522; --l2:#EBC170; --l2-soft:#3A2E15; --l3:#F2928A; --l3-soft:#3E201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A14; --surface:#1B261E; --sunk:#223026; --line:#33463A; --ink:#E7F1E8; --mute:#A7BCAB;
  --acc:#7FC98E; --acc-ink:#0E1A11; --acc-soft:#25402C; --plum:#C29BE6; --plum-soft:#352548; --plum-ink:#1A1022;
  --ok:#86CF8C; --ok-soft:#1E3522; --bad:#F2928A; --bad-soft:#3E201E; --note:#EBC170; --note-soft:#3A2E15; --l1:#86CF8C; --l1-soft:#1E3522; --l2:#EBC170; --l2-soft:#3A2E15; --l3:#F2928A; --l3-soft:#3E201E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--acc)}
body.insp::before{background:var(--plum)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:var(--acc-ink)}
body.insp header.top{background:var(--plum);color:var(--plum-ink)}
header.top .in{padding-block:12px;display:flex;align-items:center;gap:12px}
header.top h1{font-size:18px}header.top p{margin:0;font-size:13px;opacity:.85}
.back{background:none;border:0;color:inherit;font-size:24px;line-height:1;padding:4px 8px;border-radius:8px}
.grow{flex:1;min-width:0}
main{padding-block:16px 56px}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--mute)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stats b{display:block;font:700 24px var(--f-display);color:var(--acc);font-variant-numeric:tabular-nums}
.lbl{font:600 13px var(--f-body);color:var(--mute);letter-spacing:.02em;margin:2px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font:600 14px var(--f-body);color:var(--mute);min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip .n{opacity:.75;font-weight:400;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:12px 16px;font:600 16px var(--f-display);border:1.5px solid var(--acc);background:var(--acc);color:var(--acc-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.plum{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.btn.plum.ghost{background:transparent;color:var(--plum)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 12px var(--f-body);padding:2px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.tag.who{background:var(--sunk);color:var(--mute)}
.tag.lv{background:transparent;border:1px solid var(--line);color:var(--mute)}
.q{font:600 19px/1.45 var(--f-display);margin:10px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:16px;line-height:1.45;min-height:48px}
.opt .k{font:700 15px var(--f-display);color:var(--mute);min-width:18px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.badc{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt .mk{margin-left:auto;font-weight:700}
.ex{background:var(--note-soft);color:var(--note);border-radius:10px;padding:10px 12px;font-size:15px}
.ex b{font-weight:700}
.evd{border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px}
.al{background:var(--plum-soft);color:var(--plum);border-radius:10px;padding:9px 12px;font-size:14.5px}
.src{font-size:12.5px;color:var(--mute)}
.prog{height:7px;background:var(--sunk);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.verdict{font:700 17px var(--f-display)}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;border:2px solid var(--acc);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ppl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ppl button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font:600 14px var(--f-body);min-height:44px}
.ppl .y{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.ppl .n{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.iq{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.iq:first-of-type{border-top:0;padding-top:0}
.iq .hd{display:flex;gap:10px;align-items:flex-start}
.iq .hd button.qt{flex:1;text-align:left;background:none;border:0;padding:0;font:600 16px/1.45 var(--f-display)}
.dice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:16px var(--f-body)}
.li{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:grid;gap:6px}
.li .qq{font:600 15.5px/1.45 var(--f-display)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:4px}
.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20}
.listres div{display:flex;gap:10px;font-size:15px;padding:6px 0;border-top:1px solid var(--line)}
.listres b{min-width:20px}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;text-align:center;display:grid;gap:2px;min-height:84px;opacity:.55}
.lvb.on{opacity:1}
.lvb b{font:700 17px var(--f-display)}.lvb .d{font-size:11.5px;line-height:1.35;color:var(--mute)}.lvb .n{font-size:12.5px;color:var(--mute)}.lvb .bar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:4px}.lvb .bar i{display:block;height:100%}
.lvb.l1.on{border-color:var(--l1);background:var(--l1-soft)}.lvb.l1 b{color:var(--l1)}.lvb.l1 .bar i{background:var(--l1)}
.lvb.l2.on{border-color:var(--l2);background:var(--l2-soft)}.lvb.l2 b{color:var(--l2)}.lvb.l2 .bar i{background:var(--l2)}
.lvb.l3.on{border-color:var(--l3);background:var(--l3-soft)}.lvb.l3 b{color:var(--l3)}.lvb.l3 .bar i{background:var(--l3)}
.tag.lv1{background:var(--l1-soft);color:var(--l1);border:1px solid var(--l1)}.tag.lv2{background:var(--l2-soft);color:var(--l2);border:1px solid var(--l2)}.tag.lv3{background:var(--l3-soft);color:var(--l3);border:1px solid var(--l3)}
.lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvrow div{border-radius:10px;padding:8px;text-align:center;font-size:13px}
.lvrow b{display:block;font:700 18px var(--f-display)}
.prof{border:1.5px solid var(--acc);}
.prof .row{margin-top:4px}
.note{background:var(--warn-soft,#FFF4DF);color:#4A3500;border-radius:10px;padding:8px 10px;font-size:13px}
.sel{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:15px var(--f-body);background:var(--surface);color:var(--ink)}
#sheet{position:absolute;left:-10000px;top:0;width:794px}
.home{display:grid;gap:14px}
@media (min-width:900px){
  .wrap{max-width:1100px}
  .home{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .run{max-width:780px;margin:0 auto}
  .libl{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- practice ---------- */
function start(list, title) {
  S = {list: list.map(q => ({id: q.id, ord: q.type === "mcq" ? shuffle([0, 1, 2, 3]) : null})), i: 0, title, res: {}, picked: null, flipped: false, t0: Date.now(), flt: label()};
  go("run");
}
function tagsOf(q) {
  return `<div class="tags"><span class="tag">${esc(q.topic)}</span>${(q.crit || []).map(c => `<span class="tag">เกณฑ์ ${esc(c)}</span>`).join("")}<span class="tag who">${esc(q.who)}</span><span class="tag lv${q.level || 2}">${LV[q.level || 2]}</span></div>`;
}
function infoOf(q, withModel) {
  return `${withModel && q.model ? `<div class="card" style="background:var(--sunk);border:0"><div class="lbl">คำตอบที่ควรได้ยิน</div><div>${esc(q.model)}</div></div>` : ""}
    ${q.explain ? `<div class="ex"><b>คำอธิบาย:</b> ${esc(q.explain)}</div>` : ""}
    ${q.evidence ? `<div class="evd"><b>หลักฐานที่ควรเตรียม:</b> ${esc(q.evidence)}</div>` : ""}
    ${q.aoluek ? `<div class="al"><b>กฟส.อ่าวลึก:</b> ${esc(q.aoluek)}</div>` : ""}
    ${q.src ? `<div class="src">อ้างอิง: ${esc(q.src)}</div>` : ""}`;
}
function rRun() {
  const it = S.list[S.i], q = BY[it.id], n = S.list.length;
  setHead(`ข้อ ${S.i + 1} / ${n} · ระดับ${LV[q.level || 2]}`, S.title);
  let body;
  if (q.type === "mcq") {
    const done = S.picked !== null;
    body = `<div class="card stack" style="gap:10px">${tagsOf(q)}<div class="q">${esc(q.q)}</div>
      ${it.ord.map((ci, k) => { const cls = done ? (ci === q.answer ? "ok" : ci === S.picked ? "badc" : "") : "";
        return `<button class="opt ${cls}" data-c="${ci}" ${done ? "disabled" : ""}><span class="k">${KEYS[k]}</span><span>${esc(q.choices[ci])}</span>${done && ci === q.answer ? '<span class="mk" style="color:var(--ok)">✓</span>' : done && ci === S.picked ? '<span class="mk" style="color:var(--bad)">✗</span>' : ""}</button>`; }).join("")}
      ${done ? `<div class="verdict ${S.picked === q.answer ? "ok" : "no"}">${S.picked === q.answer ? "ถูกต้อง" : "ยังไม่ถูก คำตอบคือข้อที่มีเครื่องหมาย ✓"}</div>${infoOf(q, false)}` : ""}</div>
      ${done ? `<button class="btn" id="bNext">${S.i + 1 < n ? "ข้อต่อไป ›" : "ดูผลการซ้อม"}</button>` : ""}`;
  } else {
    body = `<div class="card flip" id="flip" role="button" tabindex="0">${tagsOf(q).replace('class="tags"', 'class="tags" style="justify-content:center"')}<div class="q" style="margin:14px 4px">${esc(q.q)}</div>
        <div class="small muted">${S.flipped ? "คำตอบตัวอย่างอยู่ด้านล่าง" : "ลองพูดคำตอบออกเสียงก่อน แล้วแตะการ์ดเพื่อดูคำตอบ"}</div></div>
      ${S.flipped ? `<div class="stack" style="gap:10px">${infoOf(q, true)}</div><div class="two"><button class="btn bad" id="bNo">ยังไม่แม่น</button><button class="btn" id="bYes">ตอบได้ ✓</button></div>` : `<button class="btn ghost" id="bFlip">ดูคำตอบ</button>`}`;
  }
  $("#view").innerHTML = `<div class="run stack"><div class="prog"><i style="width:${(S.i) / n * 100}%"></i></div>${body}
    <button class="chip" id="bQuit" style="justify-self:start">จบการซ้อมตอนนี้</button></div>`;
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { S.picked = +b.dataset.c; const ok = S.picked === q.answer; S.res[q.id] = ok; mark(q.id, ok); rRun(); });
  const nx = $("#bNext"); if (nx) nx.onclick = next;
  const fl = () => { S.flipped = true; rRun(); };
  const f = $("#flip"); if (f && !S.flipped) { f.onclick = fl; f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fl(); } }; }
  const bf = $("#bFlip"); if (bf) bf.onclick = fl;
  const by = $("#bYes"); if (by) by.onclick = () => { S.res[q.id] = true; mark(q.id, true); next(); };
  const bn = $("#bNo"); if (bn) bn.onclick = () => { S.res[q.id] = false; mark(q.id, false); next(); };
  $("#bQuit").onclick = () => go(Object.keys(S.res).length ? "done" : "home");
}
function next() { S.picked = null; S.flipped = false; if (S.i + 1 < S.list.length) { S.i++; rRun(); window.scrollTo(0, 0); } else go("done"); }
function rDone() {
  record(S);
  const ids = Object.keys(S.res), ok = ids.filter(id => S.res[id]).length;
  setHead("ผลการซ้อม", S.title);
  const pct = ids.length ? Math.round(ok / ids.length * 100) : 0;
  $("#view").innerHTML = `<div class="run stack">
    <div class="card" style="text-align:center"><div class="stats" style="grid-template-columns:1fr 1fr"><div><b>${ok}/${ids.length}</b><span class="tiny muted">ตอบได้</span></div><div><b>${pct}%</b><span class="tiny muted">${pct >= 80 ? "พร้อมรับตรวจ" : pct >= 60 ? "ทวนอีกนิด" : "ควรทวนก่อนวันตรวจ"}</span></div></div></div>
    ${ids.length ? `<div class="lvrow">${[1, 2, 3].map(l => { const li = ids.filter(id => (BY[id].level || 2) === l); const lo = li.filter(id => S.res[id]).length;
      return `<div style="background:var(--l${l}-soft);color:var(--l${l})"><b>${li.length ? lo + "/" + li.length : "–"}</b>ระดับ${LV[l]}</div>`; }).join("")}</div>` : ""}
    ${ids.length ? `<div class="card listres"><div class="lbl" style="border:0">รายการข้อ</div>${ids.map(id => `<div><b style="color:${S.res[id] ? "var(--ok)" : "var(--bad)"}">${S.res[id] ? "✓" : "✗"}</b><span><span class="tag lv${BY[id].level || 2}" style="margin-right:6px">${LV[BY[id].level || 2]}</span>${esc(BY[id].q)}</span></div>`).join("")}</div>` : ""}
    ${ids.some(id => !S.res[id]) ? `<button class="btn" id="bRe">ซ้อมเฉพาะข้อที่ยังไม่ได้ (${ids.filter(id => !S.res[id]).length})</button>` : ""}
    <button class="btn ghost" id="bHome">กลับหน้าแรก</button></div>`;
  const re = $("#bRe"); if (re) re.onclick = () => start(shuffle(ids.filter(id => !S.res[id]).map(id => BY[id])), "ทวนข้อที่ยังไม่ได้");
  $("#bHome").onclick = () => go("home");
}

/* ---------- inspector mode ---------- */
function inspPool(c) {
  const all = Q.filter(q => q.who === "ทุกคน");
  const direct = all.filter(q => (q.crit || []).includes(c));
  const rel = c === "2.5" ? all.filter(q => ["หมวด 1", "หมวด 2", "ความรู้ทั่วไป", "Green IT", "Carbon Form", "LESS"].includes(q.topic))
                          : all.filter(q => ["หมวด 3", "หมวด 4", "หมวด 5"].includes(q.topic));
  const seen = new Set(direct.map(q => q.id));
  return direct.concat(rel.filter(q => !seen.has(q.id)));
}
function newInsp(c) {
  const pl = inspPool(c), first = shuffle(pl.filter(q => (q.crit || []).includes(c)));
  const pick = first.concat(shuffle(pl.filter(q => !first.includes(q)))).slice(0, 3);
  return {c, qs: pick.map(q => q.id), open: {}, ppl: [null, null, null, null, null]};
}
function interviewScore(yes, max) { return Math.min(max, Math.max(0, yes - 1)); }

  setHead("โหมดกรรมการ: สุ่มสัมภาษณ์", I.c === "2.5" ? "เกณฑ์ 2.5 ความเข้าใจนโยบายและการดำเนินงาน" : "เกณฑ์ 3.6 การปฏิบัติตามมาตรการน้ำ ไฟฟ้า น้ำมัน กระดาษ");
  const asked = I.ppl.filter(x => x !== null).length, yes = I.ppl.filter(x => x === 1).length;
  $("#view").innerHTML = `<div class="run stack">
    <div class="row"><button class="chip ${I.c === "2.5" ? "on" : ""}" data-c="2.5">เกณฑ์ 2.5 นโยบาย</button><button class="chip ${I.c === "3.6" ? "on" : ""}" data-c="3.6">เกณฑ์ 3.6 มาตรการ</button></div>
    <div class="card stack" style="gap:12px"><div class="small muted">คำถามที่สุ่มให้ แตะคำถามเพื่อดูคำตอบที่ควรได้ยิน · กดเปลี่ยนข้อได้ทีละข้อ</div>
      ${I.qs.map((id, k) => { const q = BY[id]; return `<div class="iq"><div class="hd"><button class="qt" data-o="${k}">${k + 1}. ${esc(q.q)}</button><button class="dice" data-r="${k}" aria-label="เปลี่ยนคำถามข้อ ${k + 1}">เปลี่ยนข้อ</button></div>
        ${I.open[k] ? `<div class="stack" style="gap:8px">${q.type === "mcq" ? `<div class="small"><b>ตัวเลือกที่ถูก:</b> ${esc(q.choices[q.answer])}</div>` : ""}${infoOf(q, true)}</div>` : ""}</div>`; }).join("")}
    </div>
    <div class="card stack" style="gap:10px"><div class="lbl">ผลการสัมภาษณ์ (แตะสลับ ✓ ตอบได้ถูกต้องชัดเจน / ✗ ตอบไม่ได้)</div>
      <div class="ppl">${I.ppl.map((x, i) => `<button data-p="${i}" class="${x === 1 ? "y" : x === 0 ? "n" : ""}">คนที่ ${i + 1} ${x === 1 ? "✓" : x === 0 ? "✗" : ""}</button>`).join("")}</div>
      <div class="ex">${asked < 5 ? `สัมภาษณ์แล้ว ${asked}/5 คน · ตอบได้ ${yes} คน` : `ตอบได้ ${yes} จาก 5 คน → เกณฑ์ให้ <b>${interviewScore(yes, 4)} คะแนน</b> (เต็ม 4)`}</div>
      <div class="tiny muted">เกณฑ์: ตอบได้ 5 คน = 4 · 4 คน = 3 · 3 คน = 2 · 2 คน = 1 · น้อยกว่า = 0</div></div>
    <button class="btn plum" id="bNew">สุ่มชุดใหม่</button></div>`;
  const v = $("#view");
  v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { I = newInsp(b.dataset.c); rInsp(); });

  v.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const k = +b.dataset.r; const pl = inspPool(I.c).filter(q => !I.qs.includes(q.id)); if (!pl.length) return; I.qs[k] = pl[Math.floor(Math.random() * pl.length)].id; I.open[k] = false; rInsp(); });
  v.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const i = +b.dataset.p, x = I.ppl[i]; I.ppl[i] = x === null ? 1 : x === 1 ? 0 : null; rInsp(); });
  $("#bNew").onclick = () => { I = newInsp(I.c); rInsp(); };
}

/* ---------- library ---------- */
function rLib() {
  const term = libQ.trim().toLowerCase();
  const list = Q.filter(q => (libTopic === "all" || q.topic === libTopic) && (!libLv || (q.level || 2) === libLv) && (!term || [q.q, q.model, q.explain, q.evidence, q.aoluek, (q.crit || []).join(" "), (q.choices || []).join(" ")].join(" ").toLowerCase().includes(term)));
  setHead("คลังคำถาม", `${list.length} จาก ${Q.length} ข้อ`);
  const focused = document.activeElement && document.activeElement.id === "sq";
  $("#view").innerHTML = `<div class="stack">
    <input class="search" id="sq" type="search" placeholder="ค้นหา เช่น ขยะอันตราย, 1.7, แอร์, LESS" value="${esc(libQ)}">
    <div class="row"><button class="chip ${!libLv ? "on" : ""}" data-l="0">ทุกระดับ</button>${[1, 2, 3].map(l => `<button class="chip ${libLv === l ? "on" : ""}" data-l="${l}">${LV[l]}</button>`).join("")}</div>
    <div class="row"><button class="chip ${libTopic === "all" ? "on" : ""}" data-t="all">ทั้งหมด</button>${TOPICS.map(t => `<button class="chip ${libTopic === t ? "on" : ""}" data-t="${t}">${t}</button>`).join("")}</div>
    <div class="libl">${list.slice(0, libShow).map(q => { const s = P.seen[q.id]; const open = libOpen === q.id;
      return `<div class="li"><button data-li="${q.id}" style="all:unset;cursor:pointer;display:grid;gap:6px">${tagsOf(q)}<div class="qq"><span class="dot ${s ? (s.ok ? "ok" : "no") : ""}"></span>${esc(q.q)}</div></button>
        ${open ? `<div class="stack" style="gap:8px">${q.type === "mcq" ? `<div class="small">${q.choices.map((c, i) => `<div style="${i === q.answer ? "color:var(--ok);font-weight:700" : ""}">${KEYS[i]}. ${esc(c)} ${i === q.answer ? "✓" : ""}</div>`).join("")}</div>` : ""}${infoOf(q, q.type === "open")}</div>` : ""}</div>`; }).join("")}</div>
    ${list.length > libShow ? `<button class="btn ghost" id="bMore">แสดงเพิ่มอีก ${Math.min(60, list.length - libShow)} ข้อ</button>` : ""}
    ${list.length ? `<button class="btn" id="bLGo">ซ้อมชุดนี้ (${Math.min(list.length, 50)} ข้อ สุ่ม)</button>` : `<div class="card muted">ไม่พบคำถามที่ตรงกับคำค้น ลองคำที่สั้นลง หรือเลือกหัวข้อ "ทั้งหมด"</div>`}</div>`;
  const sq = $("#sq"); if (focused) { sq.focus(); sq.setSelectionRange(sq.value.length, sq.value.length); }
  let t; sq.oninput = () => { clearTimeout(t); t = setTimeout(() => { libQ = sq.value; libShow = 60; rLib(); }, 250); };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { libLv = +b.dataset.l; libShow = 60; rLib(); });
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { libTopic = b.dataset.t; libShow = 60; rLib(); });
  document.querySelectorAll("[data-li]").forEach(b => b.onclick = () => { libOpen = libOpen === b.dataset.li ? null : b.dataset.li; rLib(); });
  const bm = $("#bMore"); if (bm) bm.onclick = () => { libShow += 60; rLib(); };
  const bg = $("#bLGo"); if (bg) bg.onclick = () => start(shuffle(list).slice(0, 50), "จากคลัง: " + (libTopic === "all" ? "ทุกหัวข้อ" : libTopic) + (libQ ? ` · "${libQ}"` : ""));
}

/* ---------- PDF (question + answer sheet) ---------- */
let dl = null;
const SHEET_CSS = `.pg{box-sizing:border-box;width:794px;height:1123px;padding:40px 44px;background:#fff;color:#111;font:13px/1.5 Tahoma,"Leelawadee UI",Thonburi,"Noto Sans Thai",sans-serif;overflow:hidden;position:relative}
.pg h1{font-size:18px;margin:0 0 4px}.pg .sub{color:#555;font-size:12px;margin-bottom:10px}
.qi{border-top:1px solid #ccc;padding:8px 0 7px}.qi .h{font-size:11px;color:#2c6a3a;font-weight:700}
.qi .t{font-weight:700;margin:2px 0}.qi .c{margin-left:14px}.qi .c.ok{font-weight:700;color:#1b5e20}
.qi .a{margin-top:3px}.qi .m{color:#444}.ft{position:absolute;bottom:18px;left:44px;right:44px;font-size:11px;color:#777;display:flex;justify-content:space-between}`;
function buildPages(list, lbl) {
  const sh = $("#sheet"); sh.innerHTML = `<style>${SHEET_CSS}</style>`;
  const pages = [];
  const newPage = () => { const pg = document.createElement("div"); pg.className = "pg"; pg.style.height = "auto"; sh.appendChild(pg); pages.push(pg); return pg; };
  let pg = newPage();
  pg.innerHTML = `<h1>ชุดคำถาม-เฉลย เตรียมรับตรวจ Green Office (PEA Eco Standard 2569)</h1><div class="sub">กฟส.อ่าวลึก · ${esc(lbl)} · ${list.length} ข้อ</div>`;
  list.forEach((q, i) => {
    const html = `<div class="qi"><div class="h">${i + 1}. [${LV[q.level || 2]}] ${esc(q.topic)}${(q.crit || []).length ? " · เกณฑ์ " + esc(q.crit.join(", ")) : ""} · ${esc(q.who)}</div><div class="t">${esc(q.q)}</div>
      ${q.type === "mcq" ? q.choices.map((c, k) => `<div class="c ${k === q.answer ? "ok" : ""}">${KEYS[k]}. ${esc(c)}${k === q.answer ? " ✓" : ""}</div>`).join("") : `<div class="a"><b>คำตอบ:</b> ${esc(q.model)}</div>`}
      ${q.explain ? `<div class="m"><b>อธิบาย:</b> ${esc(q.explain)}</div>` : ""}${q.evidence ? `<div class="m"><b>หลักฐาน:</b> ${esc(q.evidence)}</div>` : ""}</div>`;
    pg.insertAdjacentHTML("beforeend", html);
    if (pg.offsetHeight > 1080 && pg.children.length > 1) { const last = pg.lastElementChild; last.remove(); pg = newPage(); pg.appendChild(last); }
  });
  pages.forEach((p, i) => { p.style.height = "1123px"; p.insertAdjacentHTML("beforeend", `<div class="ft"><span>ซ้อมรับตรวจ Green Office 2569 · กฟส.อ่าวลึก</span><span>หน้า ${i + 1}/${pages.length}</span></div>`); });
  return pages;
}
function pageImage(pg) {
  const xhtml = new XMLSerializer().serializeToString(pg);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><foreignObject x="0" y="0" width="794" height="1123"><div xmlns="http://www.w3.org/1999/xhtml"><style>${SHEET_CSS}</style>${xhtml}</div></foreignObject></svg>`;
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
}
async function exportPdf(btn, list, lbl) {
    if (!window.jspdf) { toast("โหลดตัวสร้าง PDF ไม่สำเร็จ ลองรีเฟรชหน้า"); return; }
  if (!list.length) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = `กำลังสร้าง PDF ${list.length} ข้อ…`;
  try {
    const pages = buildPages(list, lbl);
    const pdf = new window.jspdf.jsPDF({unit: "pt", format: "a4", compress: true});
    const cv = document.createElement("canvas"); cv.width = 794 * 2; cv.height = 1123 * 2; const g = cv.getContext("2d");
    for (let i = 0; i < pages.length; i++) {
      const img = await pageImage(pages[i]);
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      if (i) pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg", 0.85), "JPEG", 0, 0, 595.28, 841.89);
      btn.textContent = `กำลังสร้าง PDF หน้า ${i + 1}/${pages.length}…`;
    }
    $("#sheet").innerHTML = "";
    const fn = `ชุดคำถาม GreenOffice2569 ${lbl.replace(/[\\/:*?"<>|·]/g, "-")}.pdf`;
    if (dl) await dl.save({filename: fn, data: pdf.output("blob")}); else pdf.save(fn);
  } catch (e) { if (!(e && e.code === "declined")) toast("สร้าง PDF ไม่สำเร็จ ลองลดจำนวนข้อด้วยตัวกรอง"); }
  btn.disabled = false; btn.textContent = old;
}

$("#btnBack").onclick = () => go("home");
render();
flush();
(async () => { try { dl = window.claude ? await window.claude.use("downloads") : null; } catch (e) { dl = null; } })();
</script>
