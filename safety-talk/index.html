<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Safety Talk อ่าวลึก</title>
<script src="/pea-hub.js" data-app="safetytalk" data-gate="off" data-name="Safety Talk"></script>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1B5E20;--g2:#2E7D32;--g3:#E3F0E0;--bg:#F3F6F1;--ink:#17251A;--mut:#4A5A4D;--line:#DDE5DA;--amb:#F2A900;--amb2:#FFF8E6;--red:#A3261C;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g)}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:20}
header.top .row{display:flex;align-items:center;gap:8px}
header.top .t1{font-size:13px;color:#CFE3CB}
header.top .t2{font-size:20px;font-weight:700;line-height:1.3}
.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;border-radius:10px}
main{flex:1;padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(20,50,20,.06)}
.h{font-weight:700}
.mut{color:var(--mut);font-size:13px}
.btn{min-height:48px;border-radius:12px;border:1px solid #C9D6C5;background:#fff;padding:0 14px;font-weight:600}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.amb{background:var(--amb);border-color:var(--amb);color:#1F1A00}
.btn.red{background:#fff;border-color:#E3B0AB;color:var(--red)}
.btn.ghost{border:0;background:transparent;color:var(--g);text-decoration:underline;min-height:44px;padding:0 4px}
.btn:disabled{opacity:.55}
.big{width:100%;min-height:72px;border:0;border-radius:16px;background:var(--amb);color:#1F1A00;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.big.done{background:var(--g3);color:var(--g)}
.big.off{background:#E6EAE4;color:#5D6B60;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g3);color:var(--g)}
.chip.amb{background:#FFE7A3;color:#5C4300}.chip.red{background:#F8DAD6;color:var(--red)}.chip.gray{background:#ECECEA;color:#555}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumb{aspect-ratio:1;border-radius:8px;background:#C8D9C3 center/cover no-repeat;position:relative;overflow:hidden;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tag{position:absolute;left:4px;bottom:4px;background:var(--amb);color:#1F1A00;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.thumb.sel{outline:3px solid var(--amb);outline-offset:-3px}
.thumb .by{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.45);color:#fff;font-size:10px;padding:0 5px;border-radius:5px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.list>*+*{border-top:1px solid #EEF2EC}
.person{padding:10px 0;display:flex;flex-direction:column;gap:8px}
.av{width:38px;height:38px;border-radius:50%;background:#DCEBD8;color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid #C9D6C5;background:#fff;font-size:14px}
.seg button.on[data-v="มา"]{background:var(--g);color:#fff;border-color:var(--g)}
.seg button.on[data-v="ติดภารกิจ"]{background:#FFE7A3;border-color:#E5C770;color:#5C4300}
.seg button.on[data-v="ลา"]{background:#DCE7F7;border-color:#9DB6DD;color:#1E3A66}
.seg button.on[data-v="ขาด"]{background:#F8DAD6;border-color:#E3B0AB;color:var(--red)}
.bar{height:10px;background:#E6ECE3;border-radius:5px;overflow:hidden}.bar>div{height:100%;background:var(--g2)}
input.in,select.in,textarea.in{width:100%;min-height:44px;border:1px solid #C9D6C5;border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
textarea.in{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#5D6B60;position:relative}
nav.tabs button.on{color:var(--g);font-weight:700}
nav.tabs .dot{position:absolute;top:6px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;min-width:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#17251A;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;font-size:14px;text-align:center}
.toast.err{background:var(--red)}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--mut)}
.spin{width:26px;height:26px;border:3px solid #DDE7DA;border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill button{flex:none;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid #C9D6C5;background:#fff;font-size:14px}
.pill button.on{background:var(--g);color:#fff;border-color:var(--g)}
.tile{background:#fff;border-radius:12px;padding:12px}
.tile b{font-size:24px;display:block}
.prog{height:6px;background:#E6ECE3;border-radius:3px;overflow:hidden}.prog>div{height:100%;background:var(--g2);transition:width .2s}
.warn{background:var(--amb2);border:1px solid #E5C770;border-radius:12px;padding:12px}
canvas.prev{width:100%;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.15);background:#fff}
.hidden{display:none!important}
#busy{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(243,246,241,.55);backdrop-filter:blur(1px)}
#busy .box{background:#17251A;color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#busy .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0}
#topbar{position:fixed;top:0;left:0;height:3px;width:30%;background:var(--amb);z-index:80;animation:tb 1.1s ease-in-out infinite}
@keyframes tb{0%{left:-30%}100%{left:100%}}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:10px;background:#fff}
.gps .dot{width:10px;height:10px;border-radius:50%;background:#bbb;flex:none}
.gps.ok .dot{background:#2E7D32}.gps.far .dot{background:#F2A900}.gps.err .dot{background:#A3261C}.gps.wait .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.thumb .up{position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.thumb .up .spin{margin:0;width:22px;height:22px}
.thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#7A8A7D;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row">
      <div class="sp"><div class="t1" id="hdSub">Safety Talk</div><div class="t2" id="hdTitle">กฟส.อ่าวลึก</div></div>
      <button class="iconbtn" id="btnMenu" aria-label="เมนู"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="view"><div class="loading"><div class="spin"></div>กำลังโหลด…</div></main>
  <nav class="tabs hidden" id="tabs"><div class="in" id="tabsIn"></div></nav>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" multiple class="hidden">
<input type="file" id="filePick" accept="image/*" multiple class="hidden">

<script>
'use strict';
/* ================= ค่าตั้งต้น ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyfGC_-vovohq24RWL91hUEYWXxdiL8UkvJ5VOabKe2dGt9vERuCKocEieny86rhOBJXw/exec';
const K_USER = 'pea_aoluek_username', K_PASS = 'pea_aoluek_password', K_BOOT = 'st3_boot', K_PEOPLE = 'st3_people', K_MODE = 'st3_newsmode';
const STATUSES = ['มา', 'ติดภารกิจ', 'ลา', 'ขาด'];
const TAGS = ['หน้าแถว', 'คนในแถว', 'WARM UP', 'ผู้รับจ้าง', 'คำขวัญ', 'อื่นๆ'];
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DAYS_S = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

const S = { boot: null, people: [], tab: 'home', busy: false };

/* ================= ยูทิล ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const lsJ = (k, v) => { if (v === undefined) { try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } } ls(k, JSON.stringify(v)); };
const pd = ymd => { const p = String(ymd).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const thDate = ymd => { const d = pd(ymd); return DAYS_S[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + (d.getFullYear() + 543); };
const thDateLong = ymd => { const d = pd(ymd); return 'วัน' + DAYS[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' พ.ศ.' + (d.getFullYear() + 543); };
const thDateShort = ymd => { const d = pd(ymd); return DAYS_S[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(2); };
const daysUntil = ymd => Math.round((pd(ymd) - pd(S.boot.today)) / 864e5);
const initials = n => { const w = String(n || '').replace(/^\s*(นางสาว|น\.ส\.|นาย|นาง)\s*/, '').trim().split(/\s+/); const f = x => (String(x || '').match(/[^เแโใไ\s]/) || [''])[0]; return (f(w[0]) + f(w[1])) || '?'; };
const photoUrl = (id, w) => 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || 400);
const thumbFallback = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400';
const roles = () => (S.boot && S.boot.me.roles) || {};
const can = (...r) => r.some(x => roles()[x]);
const personOf = name => S.people.find(p => p.name === name);

function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2600);
}
function creds() { return { name: ls(K_USER) || '', pass: ls(K_PASS) || '' }; }

async function api(action, data) {
  const body = JSON.stringify({ fn: 'st', args: [Object.assign({ action: action, auth: creds() }, data || {})] });
  let r;
  net(1);
  try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }); }
  catch (e) { net(-1); throw new Error('เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ต'); }
  let j; try { j = await r.json(); } catch (e) { net(-1); throw new Error('หลังบ้านตอบกลับไม่ถูกต้อง'); }
  net(-1);
  if (!j || !j.ok) {
    const msg = (j && j.error) || 'เกิดข้อผิดพลาด';
    if (/ไม่อนุญาตให้เรียกฟังก์ชัน: st|ไม่พบฟังก์ชัน: st/.test(msg)) { location.replace('old.html'); throw new Error('กำลังเปิดระบบเดิม…'); }
    if (/เข้าสู่ระบบ|รหัสผ่านศูนย์รวมงาน/.test(msg)) { ls(K_PASS, null); showLogin(msg); }
    throw new Error(msg);
  }
  return j.result;
}
function busy(on, label) {
  let el = $('#busy'), bar = $('#topbar');
  if (on) {
    if (!el) { el = document.createElement('div'); el.id = 'busy'; el.innerHTML = '<div class="box"><span class="spin"></span><span class="lb"></span></div>'; document.body.appendChild(el); }
    if (!bar) { bar = document.createElement('div'); bar.id = 'topbar'; document.body.appendChild(bar); }
    el.querySelector('.lb').textContent = label || 'กำลังดำเนินการ…';
  } else { if (el) el.remove(); if (bar) bar.remove(); }
}
async function run(fn, okMsg, label) {
  if (S.busy) return; S.busy = true;
  busy(true, label);
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); }
  finally { S.busy = false; busy(false); }
}
/* แถบเคลื่อนไหวบางๆ ด้านบนทุกครั้งที่คุยกับหลังบ้าน (รวมการโหลดหน้า) */
let NET = 0;
function net(d) { NET += d; let bar = $('#topbar'); if (NET > 0 && !bar) { bar = document.createElement('div'); bar.id = 'topbar'; document.body.appendChild(bar); } if (NET <= 0 && bar && !S.busy) bar.remove(); }

function sheet(html, bind) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = () => bg.remove();
  if (bind) bind(bg.firstChild, close);
  return close;
}
function confirmBox(title, msg, okText) {
  return new Promise(res => sheet('<div class="h" style="font-size:18px">' + esc(title) + '</div><div>' + esc(msg) + '</div><div class="grid2"><button class="btn" data-n>ยกเลิก</button><button class="btn pri" data-y>' + esc(okText || 'ตกลง') + '</button></div>',
    (el, close) => { el.querySelector('[data-n]').onclick = () => { close(); res(false); }; el.querySelector('[data-y]').onclick = () => { close(); res(true); }; }));
}
function promptBox(title, label, placeholder) {
  return new Promise(res => sheet('<div class="h" style="font-size:18px">' + esc(title) + '</div><label class="f">' + esc(label) + '<textarea class="in" rows="3" placeholder="' + esc(placeholder || '') + '"></textarea></label><div class="grid2"><button class="btn" data-n>ยกเลิก</button><button class="btn pri" data-y>ตกลง</button></div>',
    (el, close) => { const t = el.querySelector('textarea'); setTimeout(() => t.focus(), 50); el.querySelector('[data-n]').onclick = () => { close(); res(null); }; el.querySelector('[data-y]').onclick = () => { close(); res(t.value.trim()); }; }));
}
function avatar(name) {
  const p = personOf(name);
  return '<span class="av">' + (p && p.photo ? '<img src="' + esc(p.photo) + '" alt="" onerror="this.remove()">' : '') + esc(initials(name)) + '</span>';
}
function imgTag(p) {
  const src = p.thumb || LOCAL_THUMB[p.fileId] || '';
  return src ? '<img src="' + src + '" alt="" loading="lazy">' : '<span class="ph" data-nt="' + p.fileId + '"><span class="spin" style="width:18px;height:18px;margin:0"></span></span>';
}
const LOCAL_THUMB = {};
/* รูปเก่าที่ยังไม่มีรูปย่อ: โหลดรูปเต็มทีละรูป ย่อในเครื่อง แล้วส่งรูปย่อกลับไปเก็บ (ทำครั้งเดียวต่อรูป) */
const THUMB_Q = { busy: false, done: {} };
function backfillThumbs(list) {
  const need = (list || []).filter(p => !p.thumb && !LOCAL_THUMB[p.fileId] && !THUMB_Q.done[p.fileId]);
  if (!need.length || THUMB_Q.busy) return;
  THUMB_Q.busy = true;
  (async () => {
    for (const p of need) {
      THUMB_Q.done[p.fileId] = 1;
      try {
        const f = await api('photoFull', { fileId: p.fileId });
        const t = await shrinkSrc(f.data, 320, 0.6);
        p.thumb = t; LOCAL_THUMB[p.fileId] = t;
        document.querySelectorAll('[data-nt="' + p.fileId + '"]').forEach(el => { el.outerHTML = '<img src="' + t + '" alt="">'; });
        api('setThumb', { fileId: p.fileId, thumb: t }).catch(() => {});
      } catch (e) {
        document.querySelectorAll('[data-nt="' + p.fileId + '"]').forEach(el => { el.innerHTML = 'รูป'; });
      }
    }
    THUMB_Q.busy = false;
  })();
}
function shrinkSrc(src, max, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let d = c.toDataURL('image/jpeg', q); if (d.length > 45000) d = c.toDataURL('image/jpeg', 0.4);
      res(d);
    };
    img.onerror = () => rej(new Error('อ่านรูปไม่ได้'));
    img.src = src;
  });
}   // รูปย่อจากเครื่องตัวเอง แสดงทันทีระหว่างรอหลังบ้าน
function header(sub, title) { $('#hdSub').textContent = sub; $('#hdTitle').textContent = title; }
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9H3z"/>',
  dept: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-3.5 3.5-5 7-5s6 1.5 7 5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 15c2 .6 3.4 2.3 4 5"/>',
  approve: '<path d="M9 12l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/>',
  news: '<path d="M4 5h13v14H6a2 2 0 01-2-2z"/><path d="M17 9h3v8a2 2 0 01-2 2"/><path d="M7 9h7M7 13h7"/>',
  report: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  check: '<path d="M5 12l5 5L20 7"/>'
};

const GPS = { c: null, err: '', watching: false };

    e => { GPS.err = e.code === 1 ? 'ยังไม่อนุญาตให้ใช้ตำแหน่ง' : 'หาตำแหน่งไม่ได้ ลองออกไปที่โล่ง'; GPS.denied = e.code === 1; if (e.code === 1) GPS.watching = false; drawGps(); },

function distM(a, b, c, d) { const R = 6371000, r = x => x * Math.PI / 180, x = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(x))); }
function drawGps() {

/* ================= อัปโหลดรูป (หลายคน/หลายรูปพร้อมกัน) ================= */
const UP = { queue: [], items: [], done: 0, total: 0, active: 0, failed: 0 };
['fileCam', 'filePick'].forEach(id => $('#' + id).addEventListener('change', e => {
  const files = Array.from(e.target.files || []); e.target.value = '';
  const as = albumSession(); if (!as || !files.length) return;
  files.forEach(f => { const it = { f, sid: as.id, thumb: '', done: false }; UP.queue.push(it); UP.items.push(it); });
  UP.total += files.length; drawUploads(); pump();
}));
function pump() {
  while (UP.active < 3 && UP.queue.length) {
    const it = UP.queue.shift(); UP.active++;
    shrink(it.f).then(async r => {
      it.thumb = r.thumb; drawHomeThumbs(); drawAlbumPending();
      const res = await api('uploadPhoto', { sessionId: it.sid, base64: r.full, mime: 'image/jpeg', thumb: r.thumb });
      LOCAL_THUMB[res.fileId] = r.thumb;
      if (S.photos && S.photos.id === it.sid) S.photos.list.push({ fileId: res.fileId, uploader: res.uploader, at: '', selected: false, order: 0, tag: '', thumb: r.thumb });
    })
      .then(() => { UP.done++; }, e => { UP.failed++; UP.lastErr = e.message; })
      .finally(() => { it.done = true; UP.active--; drawUploads(); drawHomeThumbs(); if (!UP.queue.length && !UP.active) { finishUploads(); } else pump(); });
  }
}
function finishUploads() {
  toast(UP.failed ? 'ส่งสำเร็จ ' + UP.done + ' รูป ไม่สำเร็จ ' + UP.failed + ' รูป (' + UP.lastErr + ')' : 'ส่งรูปเข้าอัลบั้มแล้ว ' + UP.done + ' รูป', !!UP.failed);
  UP.done = UP.total = UP.failed = 0; UP.items = []; drawUploads();

}
function drawUploads() {

}
function drawAlbumPending() {

function shrink(file, max) {

function loadImg(src) { return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }

function wrap(ctx, text, maxW) {

    const parts = seg ? Array.from(seg.segment(par), x => x.segment) : par.split('');
    let line = '';

      const t = line + w;
      if (ctx.measureText(t).width > maxW && line) {
        if (ctx.measureText(w).width > maxW) { for (const ch of w) { if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; } }

}

}

  S.monthData = r;
  $('#view').lastChild.outerHTML =
    '<div class="grid3"><div class="tile"><span class="mut">เข้าร่วมเฉลี่ย</span><b style="color:var(--g)">' + r.rate + '%</b></div><div class="tile"><span class="mut">จัดแล้ว</span><b>' + r.held + '/' + r.planned + '</b><span class="mut">ครั้ง</span></div><div class="tile"><span class="mut">อนุมัติครบ</span><b>' + r.approved + '/' + r.held + '</b><span class="mut">ครั้ง</span></div></div>' +
    '<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>รายแผนก (% มา)</b>' + r.depts.map(d => '<div style="font-size:13px"><div class="row"><span class="sp">' + esc(d.dept.replace(/^แผนก/, '')) + '</span><b>' + d.rate + '%</b></div><div class="bar"><div style="width:' + Math.min(100, d.rate) + '%"></div></div></div>').join('') + '</section>' +
    (r.followUp.length ? '<section class="warn" style="display:flex;flex-direction:column;gap:6px"><b style="color:#5C4300">ต้องติดตาม: ขาด 2 ครั้งขึ้นไป</b>' + r.followUp.map(p => '<div class="row"><span class="sp">' + esc(p.name) + ' <span class="mut">' + esc(p.dept.replace(/^แผนก/, '')) + '</span></span><b style="color:var(--red)">ขาด ' + p.absent + '</b></div>').join('') + '</section>' : '<div class="card mut">ไม่มีคนขาดซ้ำในเดือนนี้</div>') +
    '<section class="card list">' + r.sessions.map(s => '<div class="row" style="padding:8px 0"><span class="sp"><b>' + esc(thDate(s.date)) + '</b><div class="mut">' + esc(s.leaderDept) + (s.topic ? ' · ' + esc(s.topic) : '') + '</div></span><span>มา ' + s.counts.present + '</span>' + (s.approved ? '<span class="chip">อนุมัติ</span>' : '<span class="chip amb">รอ</span>') + '</div>').join('') +
      r.cancelled.map(c => '<div class="row" style="padding:8px 0;color:#777"><span class="sp"><s>' + esc(thDate(c.id)) + '</s></span><span class="chip gray">งด' + (c.reason ? ' · ' + esc(c.reason) : '') + '</span></div>').join('') + '</section>' +
    '<button class="btn pri" id="rCsv">ดาวน์โหลด Excel (CSV)</button>';
  $('#rCsv').onclick = () => {
    const rows = [['ชื่อ', 'แผนก', 'มา', 'ติดภารกิจ', 'ลา', 'ขาด']].concat(r.people.map(p => [p.name, p.dept, p.present, p.duty, p.leave, p.absent]));
    rows.push([]); rows.push(['วันที่', 'ผู้นำ', 'มา', 'ภารกิจ', 'ลา', 'ขาด', 'อนุมัติ', 'หัวข้อ']);
    r.sessions.forEach(s => rows.push([s.date, s.leaderDept, s.counts.present, s.counts.duty, s.counts.leave, s.counts.absent, s.approved ? 'ครบ' : 'รอ', s.topic]));
    const csv = '﻿' + rows.map(rw => rw.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'SafetyTalk_' + r.month + '.csv');
  };
}

/* ================= ปฏิทิน / เลื่อน / งด ================= */
async function vCalendar() {
  header('ปฏิทิน Safety Talk', can('manager', 'admin') ? 'แตะเพื่อเลื่อนหรืองด' : '');
  $('#view').innerHTML = '<div class="loading"><div class="spin"></div>กำลังโหลด…</div>';
  let c; try { c = await api('calendar'); } catch (e) { $('#view').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; return; }
  drawCalendar(c);
}
function drawCalendar(c) {
  const edit = can('manager', 'admin');
  $('#view').innerHTML = c.sessions.map((s, i) => {
    const past = s.date < c.today, isNext = !past && s.status !== 'cancelled' && c.sessions.findIndex(x => x.date >= c.today && x.status !== 'cancelled') === i;
    let style = 'background:#fff', right = past ? '<span class="mut">ผ่านแล้ว</span>' : isNext ? '<b style="color:var(--g)">ครั้งถัดไป</b>' : '';
    let main = '<b>' + esc(thDate(s.date)) + '</b> · ' + esc(s.leaderDept.replace(/^แผนก/, ''));
    if (s.status === 'moved') { style = 'background:var(--amb2);border:1px solid #E5C770'; main = '<s style="color:#6B5A2E">' + esc(thDate(s.id)) + '</s> → <b>' + esc(thDate(s.date)) + '</b> ' + esc(s.time) + ' · ' + esc(s.leaderDept.replace(/^แผนก/, '')); right = '<span class="chip amb">เลื่อน</span>'; }
    if (s.status === 'cancelled') { style = 'background:#F1F1EF;color:#666'; main = '<s>' + esc(thDate(s.id)) + '</s>'; right = '<span class="chip gray">งด</span>'; }
    if (isNext) style += ';border:2px solid var(--g)';
    return '<button class="card" data-i="' + i + '" style="text-align:left;' + style + ';border-width:' + (isNext ? 2 : s.status === 'moved' ? 1 : 0) + 'px;display:flex;flex-direction:column;gap:2px"' + (edit && !past ? '' : ' disabled') + '><div class="row" style="width:100%"><span class="sp">' + main + '</span>' + right + '</div>' + (s.reason ? '<span class="mut">เหตุผล: ' + esc(s.reason) + '</span>' : '') + '</button>';
  }).join('') + '<div class="mut">คิวแผนกผู้นำนับเฉพาะครั้งที่จัดจริง ถ้างด คิวจะเลื่อนไปครั้งถัดไป</div>';
  if (!edit) return;
  $('#view').querySelectorAll('[data-i]').forEach(b => b.onclick = () => calSheet(c.sessions[b.dataset.i]));
}
function calSheet(s) {
  let mode = 'move';
  sheet('<div class="h" style="font-size:18px">เปลี่ยนกิจกรรม ' + esc(thDate(s.id)) + '</div>' +
    '<div class="grid2"><button class="btn pri" data-m="move">เลื่อนไปวันอื่น</button><button class="btn" data-m="cancel">งดครั้งนี้</button></div>' +
    '<div id="cMove" class="grid2"><label class="f">วันใหม่<input class="in" type="date" id="cDate" value="' + esc(s.date) + '"></label><label class="f">เวลา<input class="in" type="time" id="cTime" value="' + esc(s.time) + '"></label></div>' +
    '<div class="mut">เหตุผล</div><div class="pill" style="flex-wrap:wrap" id="cWhy">' + ['วันหยุด', 'ฝนตก', 'งานเร่งด่วน / ไฟดับ', 'อื่นๆ'].map(r => '<button data-r="' + r + '">' + r + '</button>').join('') + '</div>' +
    '<input class="in" id="cReason" placeholder="ระบุเพิ่มเติม (ถ้ามี)">' +
    '<label class="row" style="min-height:44px"><input type="checkbox" id="cNotify" checked style="width:22px;height:22px;accent-color:#1B5E20"> แจ้ง LINE ทุกคนทันที</label>' +
    '<button class="btn pri" id="cOk" style="min-height:52px">บันทึกการเปลี่ยน</button>' +
    (s.status !== 'scheduled' ? '<button class="btn" id="cRestore">คืนเป็นวันเดิม (' + esc(thDate(s.id)) + ')</button>' : ''), (el, close) => {
      const mb = el.querySelectorAll('[data-m]');
      mb.forEach(b => b.onclick = () => { mode = b.dataset.m; mb.forEach(x => x.className = 'btn' + (x.dataset.m === mode ? ' pri' : '')); el.querySelector('#cMove').classList.toggle('hidden', mode !== 'move'); });
      let why = s.reason || '';
      el.querySelectorAll('[data-r]').forEach(b => { if (b.dataset.r === why) b.classList.add('on'); b.onclick = () => { why = b.dataset.r; el.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === b)); }; });
      el.querySelector('#cOk').onclick = async () => {
        const extra = el.querySelector('#cReason').value.trim(), reason = [why === 'อื่นๆ' ? '' : why, extra].filter(Boolean).join(' · ');
        const notify = el.querySelector('#cNotify').checked;
        const r = mode === 'move'
          ? await run(() => api('moveSession', { sessionId: s.id, date: el.querySelector('#cDate').value, time: el.querySelector('#cTime').value, reason: reason, notify: notify }), 'บันทึกแล้ว', 'กำลังเลื่อนกิจกรรม…')
          : await run(() => api('cancelSession', { sessionId: s.id, reason: reason, notify: notify }), 'งดกิจกรรมแล้ว', 'กำลังบันทึกการงด…');
        if (r) { close(); drawCalendar(r); refreshBoot(); }
      };
      const rs = el.querySelector('#cRestore'); if (rs) rs.onclick = async () => { const r = await run(() => api('restoreSession', { sessionId: s.id }), 'คืนเป็นวันเดิมแล้ว', 'กำลังบันทึก…'); if (r) { close(); drawCalendar(r); refreshBoot(); } };
    });
}

/* ================= ตั้งค่า ================= */
async function vSettings() {
  header('ตั้งค่า', 'สิทธิ์และการแจ้งเตือน');
  if (!S.people.length) await loadPeople();
  let roleList; try { roleList = await api('roles'); } catch (e) { $('#view').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; return; }
  const RN = { pr: 'ผู้ประชาสัมพันธ์ / จป.', leader: 'หัวหน้าแผนก (เพิ่มเติม)', manager: 'ผู้จัดการ', admin: 'Admin' };
  $('#view').innerHTML = '<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>มอบสิทธิ์</b><div class="mut">หัวหน้าแผนกและผู้จัดการได้สิทธิ์อัตโนมัติจากตำแหน่งในชีตพนักงาน ใช้ส่วนนี้เพิ่มคนที่ได้รับมอบหมาย เช่น จป. หรือรักษาการแทน</div>' +
    '<label class="f">ชื่อ<select class="in" id="sN"><option value=""></option>' + S.people.map(p => '<option>' + esc(p.name) + '</option>').join('') + '</select></label>' +
    '<label class="f">สิทธิ์<select class="in" id="sR">' + Object.keys(RN).filter(k => k !== 'admin' || can('admin')).map(k => '<option value="' + k + '">' + RN[k] + '</option>').join('') + '</select></label><button class="btn pri" id="sAdd">เพิ่มสิทธิ์</button></section>' +
    '<section class="card list" id="sList"></section>' +
    '<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>แจ้งเตือน LINE อัตโนมัติ</b><div class="mut">16:00 วันก่อนกิจกรรม เตือนทุกคน · 12:00 วันกิจกรรม เตือนแผนกที่หัวหน้ายังไม่ส่ง (ใช้กลุ่ม LINE ที่ตั้งไว้ในระบบเดิม)</div><div class="grid2"><button class="btn pri" id="sOn">เปิด</button><button class="btn" id="sOff">ปิด</button></div></section>';
  const drawList = list => {
    $('#sList').innerHTML = list.length ? list.map((r, i) => '<div class="row" style="padding:8px 0"><span class="sp"><b>' + esc(r.name) + '</b><div class="mut">' + esc(RN[r.role] || r.role) + ' · โดย ' + esc(r.by) + '</div></span><button class="btn red" data-i="' + i + '" style="min-height:40px">ลบ</button></div>').join('') : '<div class="mut">ยังไม่มีการมอบสิทธิ์เพิ่ม</div>';
    $('#sList').querySelectorAll('[data-i]').forEach(b => b.onclick = async () => { const r = list[b.dataset.i]; const res = await run(() => api('setRole', { name: r.name, role: r.role, on: false }), 'ลบสิทธิ์แล้ว', 'กำลังบันทึก…'); if (res) drawList(res.roles); });
  };
  drawList(roleList);
  $('#sAdd').onclick = async () => { const n = $('#sN').value; if (!n) return toast('เลือกชื่อก่อน', true); const res = await run(() => api('setRole', { name: n, role: $('#sR').value, on: true }), 'เพิ่มสิทธิ์แล้ว', 'กำลังบันทึก…'); if (res) drawList(res.roles); };
  $('#sOn').onclick = () => run(() => api('setupReminders', { on: true }), 'เปิดแจ้งเตือนอัตโนมัติแล้ว', 'กำลังตั้งเวลาแจ้งเตือน…');
  $('#sOff').onclick = () => run(() => api('setupReminders', { on: false }), 'ปิดแจ้งเตือนแล้ว', 'กำลังปิดแจ้งเตือน…');
}

start();
</script>
