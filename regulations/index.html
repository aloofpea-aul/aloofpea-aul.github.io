<head>

<title>ค้นหากฎหมายและระเบียบ กฟภ.</title>

<style>
:root{
  --pea:#74045F;--pea2:#9b1b83;--pea-bg:#f7eef5;--ink:#1d1726;--sub:#6b6475;--line:#e8e2ea;
  --bg:#f5f3f7;--card:#fff;--amber:#b7791f;--amber-bg:#fdf3e1;--red:#c0392b;--red-bg:#fdecea;
  --green:#1e7b4f;--green-bg:#e6f4ec;--hl:#ffe58a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;background:var(--bg)}
/* header */
header{background:linear-gradient(135deg,var(--pea),var(--pea2));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;flex:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;display:grid;place-items:center;text-decoration:none}
.top h1{font-size:17px;margin:0;font-weight:600;line-height:1.2;flex:1}
.top h1 small{display:block;font-weight:400;font-size:12px;opacity:.8}
.sbox{position:relative}
.sbox input{width:100%;border:0;border-radius:14px;padding:13px 44px 13px 42px;font:inherit;font-size:16px;color:var(--ink);outline:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#eee;border-radius:50%;width:28px;height:28px;color:#555;display:none}
.sbox.has .clr{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:#fff;color:var(--pea);border-color:#fff;font-weight:600}
.chip .n{opacity:.7;font-size:11px;margin-left:3px}
/* main */
main{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px;font-size:13px;color:var(--sub)}
.bar b{color:var(--ink)}
.bar select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink)}
.notice{background:var(--amber-bg);color:#7a5210;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(30,10,40,.06);border:1px solid var(--line);cursor:pointer;transition:transform .08s}
.card:active{transform:scale(.99)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px;font-size:12px}
.tag{border-radius:6px;padding:1px 7px;background:#f1edf3;color:var(--sub);white-space:nowrap}
.tag.no{font-family:ui-monospace,monospace;font-size:11px;background:var(--pea-bg);color:var(--pea)}
.tag.ext{background:#e8f0fb;color:#2457a5}
.tag.int{background:var(--pea-bg);color:var(--pea)}
.tag.cx{background:var(--red-bg);color:var(--red);font-weight:600}
.tag.old{background:var(--amber-bg);color:var(--amber)}
.title{font-size:15px;line-height:1.55;font-weight:500}
.card.cxd .title{color:#8d8794;text-decoration:line-through;text-decoration-color:#c9c3cf}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.cat{font-size:12px;color:var(--sub);margin-top:5px}
.more{display:block;margin:10px auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 18px;color:var(--pea);font-weight:600}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
.empty .big{font-size:40px}
/* home */
.sec{margin:6px 2px 8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font-weight:400;font-size:12px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line);text-align:center;cursor:pointer}
.stat b{display:block;font-size:22px;color:var(--pea)}
.stat small{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;font-size:13px;line-height:1.3}
.cbox .e{font-size:20px;flex:none}
.cbox .c{flex:1}
.cbox .c small{display:block;color:var(--sub);font-size:11px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink)}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;width:100%;max-width:760px}
nav button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--pea);font-weight:600}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,10,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;z-index:11;padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.grab{width:40px;height:5px;background:#ddd;border-radius:9px;margin:4px auto 12px}
.sheet h2{font-size:18px;line-height:1.5;margin:6px 0 12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.pri{background:var(--pea);border-color:var(--pea);color:#fff;grid-column:1/-1}
.btn.fav.on{background:#fff7d6;border-color:#f0d36b}
.rel h3{font-size:14px;margin:6px 0 8px}
.rel .card{padding:9px 12px}
.rel .title{font-size:14px}
.ftbar{font-size:12px;opacity:.9;margin-top:8px;display:flex;align-items:center;gap:8px}
.ftbar .trk{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.ftbar .fil{height:100%;background:#ffd84d;width:0;transition:width .3s}
.snip{font-size:13px;color:#4a4352;background:#faf7fb;border-left:3px solid var(--pea2);border-radius:6px;padding:6px 9px;margin-top:7px;line-height:1.6}
.hits{font-size:11px;background:#fff3c4;color:#7a5a00;border-radius:6px;padding:1px 7px}
.snips .snip{margin-bottom:6px}
.flist a{display:block;padding:7px 0;border-bottom:1px solid var(--line);color:var(--pea);text-decoration:none;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:.92}
/* filter sheet */
.fgrp{margin-bottom:14px}
.fgrp h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink)}
.opt.on{background:var(--pea);border-color:var(--pea);color:#fff}
.yr{display:flex;gap:8px;align-items:center}
.yr select{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:20px;height:20px;accent-color:var(--pea)}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<header>

    <h1>ค้นหากฎหมายและระเบียบ<small>กฟภ. · <span id="totalTxt"></span> เอกสาร · ข้อมูลจากรายงานส่วนกลาง</small></h1>

<script>

const FT=new Map(), FILES={}; let ftReady=false;
const IDB={open(){return new Promise((ok,no)=>{try{const r=indexedDB.open('reg-ft',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})},
  async get(k){const db=await this.open();return new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})},
  async set(k,v){const db=await this.open();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}};
const API='https://script.google.com/macros/s/AKfycbwNmNqCAMHKla92Ck3VbCVJeByNDQcq9OYaj5Vlt8WIIzvBo0uDKFg3lHFYPxavvRjpXw/exec';
function gsr(fn,i){const u=fn==='getManifest'?API+'?action=manifest':API+'?action=shard&i='+i;return fetch(u).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return fn==='getManifest'?r.json():r.text()}).then(x=>typeof x==='string'?x.trim():x)}
async function gunzip(b64){
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  if(window.DecompressionStream){return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  if(!window.pako)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  return pako.ungzip(u,{to:'string'});
}
function ftProgress(t,p){$('fttxt').textContent=t;$('ftfil').style.width=(p*100)+'%'}
function ftAdd(sh){for(const [no,text,files] of sh){if(text)FT.set(no,text);if(files)FILES[no]=files}}
async function loadFT(){
  
  try{
    const m=await gsr('getManifest');
    if(!m.shards){ftProgress('ยังไม่มีดัชนีเนื้อหา',0);return}
    let cached=null;try{cached=await IDB.get('v')}catch(e){}
    if(cached===m.version){
      ftProgress('กำลังเปิดข้อมูลในเครื่อง…',.5);
      for(let i=0;i<m.shards;i++){const sh=await IDB.get('s'+i);if(!sh){cached=null;break}ftAdd(sh)}
    }
    if(cached!==m.version){
      FT.clear();let done=0;ftProgress(`ดาวน์โหลดเนื้อหาครั้งแรก 0/${m.shards}`,0);
      const one=async i=>{const sh=JSON.parse(await gunzip(await gsr('getShard',i)));ftAdd(sh);try{await IDB.set('s'+i,sh)}catch(e){}done++;ftProgress(`ดาวน์โหลดเนื้อหาครั้งแรก ${done}/${m.shards} (ครั้งต่อไปเปิดทันที)`,done/m.shards)};
      const q=[...Array(m.shards).keys()];await Promise.all([0,1,2].map(async()=>{while(q.length)await one(q.shift())}));
      try{await IDB.set('v',m.version)}catch(e){}
    }
    ftReady=true;$('ftbar').style.display='none';
    toast(`ค้นในเนื้อหาได้แล้ว (${FT.size} เอกสาร)`);render();
  }catch(e){ftProgress('โหลดเนื้อหาไม่สำเร็จ — ค้นจากชื่อได้ตามปกติ',0);console.error(e)}
}
// regex ที่ทนต่อ OCR: เว้นวรรค/จุดแทรกได้, สระบน-ล่าง/วรรณยุกต์ หายหรือเกินได้, เลขไทย=อารบิก
const MK='\\u0E31\\u0E34-\\u0E3A\\u0E47-\\u0E4E';
function looseSrc(t){
  const out=[];for(const c of [...t]){
    if(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(c)){out.push(c+'?');continue}
    if(/[0-9๐-๙]/.test(c)){const d=/[0-9]/.test(c)?+c:thaiDigits.indexOf(c);out.push('['+d+thaiDigits[d]+']');continue}
    if(c==='ำ'){out.push('(?:ำ|ํา)');continue}
    out.push(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  }
  return out.join('[\\s.\\u200b'+MK+']*');
}
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- data prep ----------
const thaiDigits='๐๑๒๓๔๕๖๗๘๙';
function norm(s){
  s=String(s||'').toLowerCase().replace(/[๐-๙]/g,c=>thaiDigits.indexOf(c)).replace(/ํา/g,'ำ');
  return s.replace(/[\s.\-_/(),:;'"“”‘’]+/g,'');
}
// normalized string with map back to original indices (for highlight)
function normMap(s){
  let out='',map=[];s=String(s);
  for(let i=0;i<s.length;i++){
    let c=s[i];
    if(c==='ํ'&&s[i+1]==='า'){out+='ำ';map.push(i);i++;continue}
    if(/[\s.\-_/(),:;'"“”‘’]/.test(c))continue;
    c=c.toLowerCase();const d=thaiDigits.indexOf(c);if(d>=0)c=String(d);
    out+=c;map.push(i);
  }
  return {out,map};
}
const synIdx={};SYN.forEach(g=>{const n=g.map(norm);n.forEach(x=>synIdx[x]=n)});
const cats=DATA.cats;
const docs=DATA.rows.map(r=>{
  const [no,grp,title,type,year,review,ci,link]=r;
  const cat=cats[ci]||'ไม่ระบุหมวด';
  const t=String(title||'').replace(/\r/g,'').trim();
  const nm=normMap(t);
  const url=/^http/.test(link)?link:'https://drive.google.com/file/d/'+link+'/view';
  const dl=/^http/.test(link)?link:'https://drive.google.com/uc?export=download&id='+link;
  return {no,grp,title:t,type:type||'-',year,review,cat,url,dl,cx:/^\(ยกเลิก\)|^ยกเลิก/.test(t),
    nt:nm.out,map:nm.map,hay:nm.out+'|'+norm(type)+'|'+norm(cat)+'|'+no+'|'+(year||'')};
});
document.getElementById('totalTxt').textContent=docs.length.toLocaleString();

// ---------- state ----------
const st={q:'',grp:'all',cats:new Set(),types:new Set(),y1:'',y2:'',hideCx:LS.get('reg.hideCx',true),sort:'rel',view:'search',limit:40};
let fav=new Set(LS.get('reg.fav',[]));

// ---------- search ----------
function terms(q){
  // split on spaces; "phrase in quotes" kept together
  const out=[];q.replace(/"([^"]+)"|(\S+)/g,(m,a,b)=>{const n=norm(a||b);if(n)out.push(n)});return out;
}
function alts(t){
  const a=new Set([t]);
  for(const k in synIdx){ if(t===k||(k.length>=3&&t.includes(k))) synIdx[k].forEach(s=>a.add(t===k?s:t.replace(k,s))) }
  return [...a];
}
function search(){
  const ts=terms(st.q).map(t=>({t,a:alts(t)}));
  const useFT=ftReady&&ts.length&&ts.every(x=>x.t.length>=2);
  const res=ts.length?ts.map(x=>new RegExp(x.a.map(looseSrc).join('|'),'gi')):[];
  let out=[];
  for(const d of docs){
    if(st.grp!=='all'&&d.grp!==st.grp)continue;
    if(st.cats.size&&!st.cats.has(d.cat))continue;
    if(st.types.size&&!st.types.has(d.type))continue;
    if(st.y1&&(!d.year||d.year<+st.y1))continue;
    if(st.y2&&(!d.year||d.year>+st.y2))continue;
    if(st.hideCx&&d.cx&&!/ยกเลิก/.test(st.q))continue;
    let score=0,ok=true,inBody=false,hits=0,snip=null;
    const body=useFT?FT.get(d.no):null;
    for(let k=0;k<ts.length;k++){
      let best=-1;
      for(const x of ts[k].a){const p=d.hay.indexOf(x);if(p>=0){const inT=p<d.nt.length;const sc=(inT?10:4)+(p===0?6:0)+x.length*0.3;if(sc>best)best=sc}}
      if(best<0){
        if(!body){ok=false;break}
        const re=res[k];re.lastIndex=0;if(!re.test(body)){ok=false;break}
        best=2;inBody=true;
      }
      score+=best;
    }
    if(!ok)continue;
    if(body&&ts.length){ // นับจำนวนครั้ง + ตัวอย่างข้อความ จากคำแรก
      const re=res[0];re.lastIndex=0;let m;
      while((m=re.exec(body))&&hits<99){if(hits===0)snip=m.index;hits++;if(m[0].length===0)re.lastIndex++}
      if(hits){score+=Math.min(hits,30)*0.4;inBody=inBody||true}
    }
    if(ts.length>1){const ph=ts.map(x=>x.t).join('');if(d.nt.includes(ph))score+=15}
    score+=(d.year||2500)/1000; if(d.cx)score-=8;
    out.push({d,score,hits,snip});
  }
  let fuzzy=false;
  if(!out.length&&ts.length>1){
    fuzzy=true;
    for(const d of docs){ if(st.hideCx&&d.cx)continue; let sc=0;const body=useFT?FT.get(d.no):'';
      ts.forEach((x,k)=>{if(x.a.some(y=>d.hay.includes(y)))sc+=10;else if(body){res[k].lastIndex=0;if(res[k].test(body))sc+=3}});
      if(sc)out.push({d,score:sc+(d.year||0)/1000,hits:0,snip:null}) }
  }
  const by={rel:(a,b)=>b.score-a.score,new:(a,b)=>(b.d.year||0)-(a.d.year||0)||b.d.no.localeCompare(a.d.no),old:(a,b)=>(a.d.year||9999)-(b.d.year||9999),no:(a,b)=>b.d.no.localeCompare(a.d.no)};
  out.sort(st.q||st.sort!=='rel'?by[st.sort]:by.new);
  return {res:out,ts,fuzzy,regs:res};
}
function snippetHTML(text,at,regs,len){
  len=len||150;const s0=Math.max(0,at-50);let t=text.slice(s0,s0+len).replace(/\s+/g,' ');
  let h=esc(t);
  for(const re of regs){const r2=new RegExp(re.source,'gi');h=h.replace(r2,m=>'<mark>'+m+'</mark>')}
  return (s0>0?'… ':'')+h+(s0+len<text.length?' …':'');
}
function hl(d,ts){
  const ranges=[];
  for(const {a} of ts)for(const x of a){let p=d.nt.indexOf(x);while(p>=0){ranges.push([d.map[p],d.map[p+x.length-1]+1]);p=d.nt.indexOf(x,p+1)}}
  if(!ranges.length)return esc(d.title);
  ranges.sort((a,b)=>a[0]-b[0]);const m=[];for(const r of ranges){if(m.length&&r[0]<=m[m.length-1][1])m[m.length-1][1]=Math.max(m[m.length-1][1],r[1]);else m.push(r.slice())}
  let o='',i=0;for(const [s,e] of m){o+=esc(d.title.slice(i,s))+'<mark>'+esc(d.title.slice(s,e))+'</mark>';i=e}return o+esc(d.title.slice(i));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---------- render ----------
function cardHTML(d,ts,r,regs){
  const tags=[`<span class="tag no">${d.no}</span>`,`<span class="tag ${d.grp==='E'?'ext':'int'}">${d.grp==='E'?'ภายนอก':'กฟภ.'}</span>`,`<span class="tag">${esc(d.type)}</span>`];
  if(d.year)tags.push(`<span class="tag">พ.ศ. ${d.year}</span>`);
  if(d.cx)tags.push('<span class="tag cx">ยกเลิกแล้ว</span>');
  if(d.grp==='I'&&d.review>=5)tags.push(`<span class="tag old">ไม่ได้ทบทวน ${d.review} ปี</span>`);
  if(fav.has(d.no))tags.push('<span class="tag" style="background:#fff7d6">⭐</span>');
  if(r&&r.hits)tags.push(`<span class="hits">พบในเนื้อหา ${r.hits>=99?'99+':r.hits} ครั้ง</span>`);
  const sn=(r&&r.snip!=null&&regs)?`<div class="snip">${snippetHTML(FT.get(d.no),r.snip,regs)}</div>`:'';
  return `<div class="card${d.cx?' cxd':''}" data-no="${d.no}"><div class="meta">${tags.join('')}</div><div class="title">${ts?hl(d,ts):esc(d.title)}</div>${sn}<div class="cat">${CAT_ICON[d.cat]||'📁'} ${esc(d.cat)}</div></div>`;
}
function activeFilters(){return st.cats.size+st.types.size+(st.y1?1:0)+(st.y2?1:0)+(st.grp!=='all'?1:0)}
function renderQuick(){
  const g=[['all','ทั้งหมด'],['E','กฎหมายภายนอก'],['I','ระเบียบ กฟภ.']].map(([k,l])=>`<button class="chip${st.grp===k?' on':''}" data-grp="${k}">${l}</button>`);
  const c=[...st.cats].map(x=>`<button class="chip on" data-rmcat="${esc(x)}">${CAT_ICON[x]||''} ${esc(x)} ✕</button>`);
  const t=[...st.types].map(x=>`<button class="chip on" data-rmtype="${esc(x)}">${esc(x)} ✕</button>`);
  const y=(st.y1||st.y2)?[`<button class="chip on" data-rmyr>ปี ${st.y1||'…'}–${st.y2||'…'} ✕</button>`]:[];
  $('quick').innerHTML=g.concat(c,t,y,[`<button class="chip${st.hideCx?'':' on'}" data-cx>${st.hideCx?'แสดงฉบับยกเลิก':'รวมฉบับยกเลิก ✓'}</button>`]).join('');
}
function render(){
  renderQuick();$('sbox').classList.toggle('has',!!st.q);
  const m=$('main');
  if(st.view==='fav'){
    const list=docs.filter(d=>fav.has(d.no));
    m.innerHTML=`<div class="bar"><span>ที่บันทึกไว้ <b>${list.length}</b> รายการ</span></div>`+(list.length?list.map(d=>cardHTML(d)).join(''):`<div class="empty"><div class="big">⭐</div>ยังไม่มีเอกสารที่บันทึก<br>กดดาวในหน้ารายละเอียดเพื่อเก็บไว้เปิดเร็ว</div>`);
    return;
  }
  if(st.view==='cats'){m.innerHTML=homeCats(true);return}
  if(!st.q&&!activeFilters()){m.innerHTML=home();return}
  const {res,ts,fuzzy,regs}=search();
  let h=`<div class="bar"><span>พบ <b>${res.length.toLocaleString()}</b> รายการ</span><select id="sort">${[['rel','เกี่ยวข้องที่สุด'],['new','ใหม่ → เก่า'],['old','เก่า → ใหม่'],['no','เลขที่เอกสาร']].map(([k,l])=>`<option value="${k}"${st.sort===k?' selected':''}>${l}</option>`).join('')}</select></div>`;
  if(fuzzy)h+=`<div class="notice">ไม่พบเอกสารที่มีครบทุกคำ — แสดงเอกสารที่มีบางคำแทน</div>`;
  if(!res.length)h+=`<div class="empty"><div class="big">🔎</div>ไม่พบเอกสาร<br><small>ลองคำที่สั้นลง หรือล้างตัวกรอง</small></div>`;
  h+=res.slice(0,st.limit).map(r=>cardHTML(r.d,ts,r,regs)).join('');
  if(res.length>st.limit)h+=`<button class="more" id="more">แสดงเพิ่ม (${res.length-st.limit})</button>`;
  m.innerHTML=h;
}
function homeCats(full){
  const cnt={};docs.forEach(d=>{if(st.grp==='all'||d.grp===st.grp)cnt[d.cat]=(cnt[d.cat]||0)+1});
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const show=full?list:list.slice(0,8);
  return `<div class="sec">หมวดเอกสาร<span>${full?list.length+' หมวด':'<a href="#" data-allcats style="color:var(--pea)">ดูทั้งหมด ›</a>'}</span></div><div class="grid">`+
    show.map(([c,n])=>`<button class="cbox" data-cat="${esc(c)}"><span class="e">${CAT_ICON[c]||'📁'}</span><span class="c">${esc(c)}<small>${n} เอกสาร</small></span></button>`).join('')+'</div>';
}
function home(){

  return `<div class="stats">

  <div class="sugg">${(hist.length?hist:['พรบ จัดซื้อ','ค่าเช่าบ้าน','PDPA','ค่าล่วงเวลา','ขยายเขต','หม้อแปลง','รถยนต์ไฟฟ้า','ทุจริต','ลาพักผ่อน','ความปลอดภัย']).map(s=>`<button data-sugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  ${homeCats(false)}
  <div class="sec">เอกสารใหม่ล่าสุด<span>เรียงตามปีประกาศ</span></div>
  ${recent.map(d=>cardHTML(d)).join('')}
  <div class="notice" style="margin-top:14px">ค้นได้ทั้ง <b>ชื่อเอกสาร</b> และ <b>เนื้อหาในไฟล์</b> (${FT.size||801} เอกสาร) · พิมพ์หลายคำเว้นวรรค = ต้องมีครบทุกคำ</div>`;
}
// detail sheet -> ย้ายไปหน้าอ่านเอกสาร (ท้ายไฟล์)
function detailSnips(d){
  const body=FT.get(d.no);if(!body||!st.q)return body?`<div class="rel"><h3>เนื้อหา</h3><div class="snip">${esc(body.slice(0,400))} …</div></div>`:'';
  const ts=terms(st.q).map(t=>({t,a:alts(t)}));const regs=ts.map(x=>new RegExp(x.a.map(looseSrc).join('|'),'gi'));
  const re=regs[0];re.lastIndex=0;const at=[];let m,last=-999;
  while((m=re.exec(body))&&at.length<8){if(m.index-last>200){at.push(m.index);last=m.index}if(!m[0].length)re.lastIndex++}
  if(!at.length)return '';
  return `<div class="rel snips"><h3>ข้อความที่พบในเอกสาร</h3>${at.map(i=>`<div class="snip">${snippetHTML(body,i,regs,260)}</div>`).join('')}</div>`;
}
function sim(a,b){ // shared 4-char shingles of titles
  const sh=s=>{const o=new Set();for(let i=0;i<s.length-3;i+=2)o.add(s.substr(i,4));return o};
  a._sh=a._sh||sh(a.nt);b._sh=b._sh||sh(b.nt);let n=0;a._sh.forEach(x=>{if(b._sh.has(x))n++});return n;
}
function closeSheet(){$('ov').classList.remove('show');$('sheet').classList.remove('show')}
function openFilter(){
  const types={};docs.forEach(d=>types[d.type]=(types[d.type]||0)+1);
  const years=[...new Set(docs.map(d=>d.year).filter(Boolean))].sort((a,b)=>b-a);
  const yopt=v=>'<option value="">ไม่จำกัด</option>'+years.map(y=>`<option${+v===y?' selected':''}>${y}</option>`).join('');
  const cnt={};docs.forEach(d=>cnt[d.cat]=(cnt[d.cat]||0)+1);
  $('sheet').innerHTML=`<div class="grab"></div><h2 style="margin-top:0">ตัวกรอง</h2>
   <div class="fgrp"><h4>กลุ่มเอกสาร</h4><div class="opts">${[['all','ทั้งหมด'],['E','กฎหมาย/ข้อกำหนดภายนอก'],['I','ระเบียบที่ กฟภ. กำหนด']].map(([k,l])=>`<button class="opt${st.grp===k?' on':''}" data-fgrp="${k}">${l}</button>`).join('')}</div></div>
   <div class="fgrp"><h4>ประเภทเอกสาร</h4><div class="opts">${Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<button class="opt${st.types.has(t)?' on':''}" data-ftype="${esc(t)}">${esc(t)} <small>${n}</small></button>`).join('')}</div></div>
   <div class="fgrp"><h4>หมวด</h4><div class="opts">${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="opt${st.cats.has(c)?' on':''}" data-fcat="${esc(c)}">${CAT_ICON[c]||''} ${esc(c)} <small>${n}</small></button>`).join('')}</div></div>
   <div class="fgrp"><h4>ปีที่ประกาศ (พ.ศ.)</h4><div class="yr"><select id="y1">${yopt(st.y1)}</select>ถึง<select id="y2">${yopt(st.y2)}</select></div></div>
   <label class="sw"><span>ซ่อนเอกสารที่ยกเลิกแล้ว</span><input type="checkbox" id="fcx"${st.hideCx?' checked':''}></label>
   <div class="acts" style="margin-top:12px"><button class="btn" data-freset>ล้างทั้งหมด</button><button class="btn" style="background:var(--pea);color:#fff;border-color:var(--pea)" data-fclose>ดูผลลัพธ์</button></div>`;
  $('ov').classList.add('show');$('sheet').classList.add('show');
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function setView(v){st.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('main').scrollTop=0;render()}

// ---------- events ----------
let deb;
$('q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{st.q=e.target.value.trim();st.limit=40;if(st.view!=='search')setView('search');else render();$('main').scrollTop=0},ftReady?220:120)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();saveHist()}});
function saveHist(){if(!st.q)return;let h=LS.get('reg.hist',[]).filter(x=>x!==st.q);h.unshift(st.q);LS.set('reg.hist',h.slice(0,8))}
$('clr').onclick=()=>{$('q').value='';st.q='';render();$('q').focus()};
$('ov').onclick=()=>{closeSheet();render()};

document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}if(e.key==='Escape')closeSheet()});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){st.sort=e.target.value;render()}
  if(e.target.id==='y1'){st.y1=e.target.value}
  if(e.target.id==='y2'){st.y2=e.target.value}
  if(e.target.id==='fcx'){st.hideCx=e.target.checked;LS.set('reg.hideCx',st.hideCx)}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.card,.stat,a[data-allcats]');if(!t)return;const ds=t.dataset;
  if(t.matches('nav button')){if(ds.v==='filter')openFilter();else{setView(ds.v)}return}
  if(t.classList.contains('card')){if(st.q)saveHist();openDoc(ds.no);return}
  if(ds.grp){st.grp=ds.grp;st.view='search';setView('search');return}
  if('oldrev' in ds){st.grp='I';st.sort='old';$('q').value='';st.q='';setView('search');toast('ระเบียบ กฟภ. — ดูช่อง "ไม่ได้ทบทวน"');return}
  if(ds.rmcat){st.cats.delete(ds.rmcat);render();return}
  if(ds.rmtype){st.types.delete(ds.rmtype);render();return}
  if('rmyr' in ds){st.y1=st.y2='';render();return}
  if('cx' in ds){st.hideCx=!st.hideCx;LS.set('reg.hideCx',st.hideCx);render();return}
  if(ds.cat){st.cats=new Set([ds.cat]);setView('search');return}
  if('allcats' in ds){e.preventDefault();setView('cats');return}
  if(ds.sugg){$('q').value=ds.sugg;st.q=ds.sugg;render();return}
  if(t.id==='more'){st.limit+=60;render();return}
  if(ds.fav){const n=ds.fav;fav.has(n)?fav.delete(n):fav.add(n);LS.set('reg.fav',[...fav]);t.classList.toggle('on',fav.has(n));t.textContent=fav.has(n)?'⭐ บันทึกแล้ว':'☆ บันทึก';toast(fav.has(n)?'บันทึกแล้ว':'นำออกแล้ว');return}
  if(ds.copy){const d=docs.find(x=>x.no===ds.copy);const txt=`${d.title}\n${d.url}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ในหน้านี้'));return}
  if(ds.fgrp){st.grp=ds.fgrp;openFilter();return}
  if(ds.ftype){st.types.has(ds.ftype)?st.types.delete(ds.ftype):st.types.add(ds.ftype);t.classList.toggle('on');return}
  if(ds.fcat){st.cats.has(ds.fcat)?st.cats.delete(ds.fcat):st.cats.add(ds.fcat);t.classList.toggle('on');return}
  if('freset' in ds){st.grp='all';st.cats.clear();st.types.clear();st.y1=st.y2='';openFilter();return}
  if('fclose' in ds){closeSheet();setView('search');return}
});
render();
loadFT();

// ================= หน้าอ่านเอกสาร (ข้อความ / ไฟล์ต้นฉบับ) =================
(function(){const css=`
#rd{position:fixed;inset:0;z-index:40;display:none;justify-content:center;background:rgba(20,10,30,.35)}
#rd.show{display:flex}
#rd .rw{width:100%;max-width:760px;background:#fff;display:flex;flex-direction:column;height:100%}
#rd .rh{background:linear-gradient(135deg,var(--pea),var(--pea2));color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;flex:none}
#rd .rtop{display:flex;align-items:center;gap:8px;font-size:12px}
#rd .rtop button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:6px 10px;font-size:13px}
#rd .rtop .m{flex:1;text-align:center;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rd .rt{font-size:15px;font-weight:600;line-height:1.45;margin:8px 2px 2px}
#rd .rsub{font-size:12px;opacity:.85;margin:0 2px}
#rd .rtabs{display:flex;gap:4px;margin-top:10px}
#rd .rtabs button{flex:1;border:0;border-radius:10px 10px 0 0;padding:9px 0;font-size:14px;background:rgba(255,255,255,.14);color:#fbe3f3}
#rd .rtabs button.on{background:#fff;color:var(--pea);font-weight:600}
#rd .rtool{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);flex:none;flex-wrap:wrap}
#rd .rtool button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink)}
#rd .rtool .cnt{border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--ink);font-weight:600}
#rd .rbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rd .rtext{padding:14px 16px 40px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
#rd .rtext mark{background:#ffe58a}
#rd .rtext mark.cur{background:#f5a524;outline:2px solid #b7791f;border-radius:3px}
#rd .rfile{height:100%;display:flex;flex-direction:column}
#rd .rfile iframe{flex:1;width:100%;border:0;background:#eee;min-height:300px}
#rd .rfiles{max-height:30%;overflow-y:auto;border-bottom:1px solid var(--line);flex:none}
#rd .rfiles button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;font-size:13px;color:var(--ink)}
#rd .rfiles button.on{background:var(--pea-bg);color:var(--pea);font-weight:600}
#rd .rft{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;background:#fff}
#rd .rft a,#rd .rft button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:14px;color:var(--ink);text-decoration:none;font-family:inherit}
#rd .rft .pri{background:var(--pea);border-color:var(--pea);color:#fff}
#rd .rnote{padding:30px 20px;text-align:center;color:var(--sub);line-height:1.7}
`;const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const rd=document.createElement('div');rd.id='rd';rd.innerHTML='<div class="rw"></div>';document.body.appendChild(rd);
rd.addEventListener('click',e=>{if(e.target===rd)closeReader()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rd.classList.contains('show'))closeReader()});
})();
const RD={d:null,tab:'text',marks:[],cur:0,fs:LS.get('reg.fs',16),fileIdx:0};
function driveId(d){const m=String(d.url).match(/\/d\/([\w-]+)/);return m?m[1]:null}
function closeReader(){const rd=document.getElementById('rd');rd.classList.remove('show');rd.querySelector('.rw').innerHTML='';RD.d=null}
function copyText(t){
  const ok=()=>toast('คัดลอกแล้ว');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('คัดลอกไม่ได้')}ta.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function openDoc(no){
  const d=docs.find(x=>x.no===no);if(!d)return;
  RD.d=d;RD.cur=0;RD.fileIdx=0;
  RD.tab=FT.get(d.no)?'text':'file';
  if(st.q)saveHist();
  drawReader();document.getElementById('rd').classList.add('show');
}
function drawReader(){
  const d=RD.d,w=document.querySelector('#rd .rw');if(!d)return;
  const isFav=fav.has(d.no);
  const sub=[d.type,d.year?'พ.ศ. '+d.year:'',d.cat].filter(Boolean).join(' · ')+(d.cx?' · ยกเลิกแล้ว':'')+(d.grp==='I'&&d.review>=5?` · ไม่ได้ทบทวน ${d.review} ปี`:'');
  const lineMsg=encodeURIComponent(d.title+'\n'+d.url);
  w.innerHTML=`<div class="rh">
    <div class="rtop"><button id="rBack">← กลับ</button><span class="m">${d.no} · ${d.grp==='E'?'กฎหมายภายนอก':'ระเบียบ กฟภ.'}</span><button id="rFav">${isFav?'⭐':'☆'}</button></div>
    <div class="rt">${esc(d.title)}</div><div class="rsub">${esc(sub)}</div>
    <div class="rtabs"><button id="tText" class="${RD.tab==='text'?'on':''}">📖 อ่านข้อความ</button><button id="tFile" class="${RD.tab==='file'?'on':''}">📄 ไฟล์ต้นฉบับ</button></div>
  </div>
  <div class="rtool" id="rTool"></div>
  <div class="rbody" id="rBody"></div>
  <div class="rft">
    ${RD.tab==='text'?'<button id="rCopy">📋 คัดลอก</button>':`<a href="${d.url}" target="_blank" rel="noopener">↗ เปิดแท็บใหม่</a>`}
    <a href="https://line.me/R/msg/text/?${lineMsg}" target="_blank" rel="noopener">💬 ส่ง LINE</a>
    <a class="pri" href="${d.dl}" target="_blank" rel="noopener">⬇️ ดาวน์โหลด</a>
  </div>`;
  w.querySelector('#rBack').onclick=closeReader;
  w.querySelector('#rFav').onclick=()=>{fav.has(d.no)?fav.delete(d.no):fav.add(d.no);LS.set('reg.fav',[...fav]);toast(fav.has(d.no)?'บันทึกแล้ว':'นำออกแล้ว');drawReader()};
  w.querySelector('#tText').onclick=()=>{RD.tab='text';drawReader()};
  w.querySelector('#tFile').onclick=()=>{RD.tab='file';drawReader()};
  const c=w.querySelector('#rCopy');
  if(c)c.onclick=()=>{const sel=String(window.getSelection()||'').trim();copyText(sel?sel:d.title+'\n'+d.url);if(!sel)toast('คัดลอกชื่อ+ลิงก์แล้ว (เลือกข้อความก่อน เพื่อคัดลอกเฉพาะส่วน)')};
  RD.tab==='text'?drawText():drawFile();
}
function drawText(){
  const d=RD.d,body=document.getElementById('rBody'),tool=document.getElementById('rTool');
  const text=FT.get(d.no);
  if(!text){tool.style.display='none';body.innerHTML=`<div class="rnote">${ftReady?'เอกสารนี้ยังไม่มีข้อความ (เช่น ไฟล์ภาพสแกน หรือลิงก์ภายนอก)<br>ดูได้ที่แท็บ <b>ไฟล์ต้นฉบับ</b>':'กำลังโหลดเนื้อหา… ระหว่างนี้ดูที่แท็บ <b>ไฟล์ต้นฉบับ</b> ได้'}</div>`;return}
  const ts=terms(st.q).map(t=>({t,a:alts(t)}));
  let h=esc(text);
  if(ts.length){const src=ts.map(x=>x.a.map(looseSrc).join('|')).join('|');try{h=h.replace(new RegExp(src,'gi'),m=>'<mark>'+m+'</mark>')}catch(e){}}
  body.innerHTML=`<div class="rtext" style="font-size:${RD.fs}px">${h}</div>`;
  RD.marks=[...body.querySelectorAll('mark')];RD.cur=0;
  const n=RD.marks.length;
  tool.style.display='flex';
  tool.innerHTML=(ts.length?(n?`<span>พบ "${esc(st.q)}"</span><span class="cnt" id="rCnt">1 / ${n}</span><button id="rUp">▲</button><button id="rDn">▼</button>`:`<span>ไม่พบ "${esc(st.q)}" ในข้อความ</span>`):'<span>ทั้งฉบับ '+text.length.toLocaleString()+' ตัวอักษร</span>')+
    `<span style="margin-left:auto"></span><button id="rSm">ก-</button><button id="rLg">ก+</button>`;
  const go=i=>{if(!n)return;RD.marks[RD.cur]&&RD.marks[RD.cur].classList.remove('cur');RD.cur=(i+n)%n;const m=RD.marks[RD.cur];m.classList.add('cur');m.scrollIntoView({block:'center'});const c=document.getElementById('rCnt');if(c)c.textContent=(RD.cur+1)+' / '+n};
  if(n){document.getElementById('rUp').onclick=()=>go(RD.cur-1);document.getElementById('rDn').onclick=()=>go(RD.cur+1);setTimeout(()=>go(0),30)}
  const fs=v=>{RD.fs=Math.max(12,Math.min(26,RD.fs+v));LS.set('reg.fs',RD.fs);body.querySelector('.rtext').style.fontSize=RD.fs+'px'};
  document.getElementById('rSm').onclick=()=>fs(-2);document.getElementById('rLg').onclick=()=>fs(2);
}
function drawFile(){
  const d=RD.d,body=document.getElementById('rBody'),tool=document.getElementById('rTool');
  const files=FILES[d.no];
  let id=null,name='';
  if(files&&files.length){const f=files[Math.min(RD.fileIdx,files.length-1)];id=f.id;name=f.name}else id=driveId(d);
  tool.style.display='flex';
  tool.innerHTML=files?`<span>โฟลเดอร์ ${files.length} ไฟล์ · กำลังดู: <b>${esc(name)}</b></span>`:(id?'<span>ไฟล์ต้นฉบับจาก Google Drive</span>':'<span>เอกสารนี้อยู่บนเว็บไซต์ภายนอก</span>');
  if(!id){body.innerHTML=`<div class="rnote">เปิดดูได้จากเว็บไซต์ต้นทาง<br><br><a class="btn pri" style="display:inline-flex;padding:10px 18px;background:var(--pea);color:#fff;border-radius:10px;text-decoration:none" href="${d.url}" target="_blank" rel="noopener">↗ เปิดเอกสาร</a>${/pea\.co\.th/.test(d.url)?'<br><br><small>ลิงก์นี้เปิดได้เฉพาะในเครือข่าย กฟภ.</small>':''}</div>`;return}
  body.innerHTML=`<div class="rfile">${files?`<div class="rfiles">${files.map((f,i)=>`<button data-fi="${i}" class="${i===RD.fileIdx?'on':''}">📄 ${esc(f.name)}</button>`).join('')}</div>`:''}<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay" loading="lazy"></iframe></div>`;
  body.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{RD.fileIdx=+b.dataset.fi;drawFile()});
  if(files){const fa=document.querySelectorAll('#rd .rft a');fa[0].href='https://drive.google.com/file/d/'+id+'/view';fa[fa.length-1].href='https://drive.google.com/uc?export=download&id='+id}
}

</script>
