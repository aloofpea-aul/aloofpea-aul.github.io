<!DOCTYPE html>
<html lang="th">
<head>
<script src="/pea-hub.js" data-app="stock" data-perm="login" data-name="ระบบคลังพัสดุ · มิเตอร์"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>มิเตอร์ · คลังพัสดุ กฟส.อ่าวลึก</title>
<meta name="theme-color" content="#2a0f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="มิเตอร์">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{--top:#2a0f33;--pea:#6a1b74;--pea2:#4a0f52;--gold:#f2b33d;--bg:#f6f5f8;--card:#fff;--line:#e4e1ea;--ink:#1c1a22;--mute:#5f5a6b;--faint:#a39dae;--blue:#1a4fa0;--blueBg:#e6effc;--warn:#8a4500;--warnBg:#fff1dc;--red:#9b1c1c;--redBg:#fde8e8;--green:#13633a;--greenBg:#dff3e7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pea);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.app{display:flex;flex-direction:column;position:fixed;inset:0}
.top{background:var(--top);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex:none}
.top .logo{width:38px;height:38px;border-radius:10px;background:var(--gold);display:grid;place-items:center;flex:none}
.top h1{font-size:17px;margin:0;font-weight:700;line-height:1.15}
.top small{display:block;font-weight:400;color:#d9cfe0;font-size:12.5px}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:44px;height:44px;display:grid;place-items:center;position:relative;text-decoration:none}
.ibtn .dot{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:#9b8fa3;border:2px solid var(--top)}
.ibtn .dot.on{background:#4ade80}
.main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:980px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 28px}
.bnav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mute);font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;position:relative}
.bnav button.on{color:var(--pea);font-weight:700}
.bnav .bd{position:absolute;top:4px;left:calc(50% + 6px);background:#c2410c;color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;line-height:16px;font-weight:700}
@media (max-width:440px){.bnav button{font-size:11.5px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--mute);font-size:13px}
h2{margin:4px 0 10px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 10px}
.head h2{margin:0}
.btn{border:1px solid #cfc9d8;background:#fff;border-radius:12px;min-height:44px;padding:0 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--pea);border-color:var(--pea);color:#fff}
.btn.d{color:var(--red);border-color:#f0c4c4}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn.blk{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid #cfc9d8;border-radius:12px;overflow:hidden;background:#fff;max-width:100%}
.seg button{border:0;background:#fff;min-height:44px;padding:0 14px;font-size:14px;flex:1}
.seg button.on{background:var(--pea);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #cfc9d8;background:#fff;font-size:14px}
.chip.on{border-color:var(--pea);background:var(--pea);color:#fff;font-weight:600}
.chip.sm{min-height:34px;padding:0 11px;font-size:13px}
.lab{font-size:13px;color:var(--mute);margin:12px 0 5px;display:block;font-weight:600}
.lab.r{color:var(--red)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #cfc9d8;border-radius:12px;min-height:46px;padding:0 12px;font-size:15px;background:#fff}
textarea.inp{padding:10px 12px;min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scanbox{display:flex;align-items:center;gap:8px;border:2px solid var(--pea);border-radius:14px;padding:0 6px 0 12px;background:#fff;min-height:56px}
.scanbox input{border:0;outline:none;flex:1;min-width:0;font-size:19px;font-weight:700;height:52px;background:transparent;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em}
.scanbox .ic{color:var(--pea);flex:none}
.scanbox input::placeholder{font-family:'IBM Plex Sans Thai',sans-serif;font-weight:500;font-size:16px;letter-spacing:0;color:#8a8396}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.note{background:var(--warnBg);border:1px solid #f1d9b0;color:#7a3d06;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}
.note.b{background:var(--blueBg);border-color:#c9dbf5;color:var(--blue)}
.note.g{background:var(--greenBg);border-color:#bfe5cf;color:var(--green)}
.note.r{background:var(--redBg);border-color:#f3c5c5;color:var(--red)}
.note.k{background:#1c1a22;border-color:#1c1a22;color:#fff}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.t-field{background:#ece9f0;color:#4a4250}.t-wait{background:var(--warnBg);color:var(--warn)}.t-good{background:var(--greenBg);color:var(--green)}
.t-warr{background:var(--blueBg);color:var(--blue)}.t-rep{background:#fff0d6;color:#8a5200}.t-unrep{background:var(--redBg);color:var(--red)}
.t-evid{background:#1c1a22;color:#fff}.t-done{background:#f0eef3;color:#6b6570}.t-lost{background:#3b0d0d;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kpi{padding:6px 8px}.kpi span{font-size:11px;line-height:1.25}.kpi b{font-size:20px}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;text-align:left}
.kpi span{font-size:12px;color:var(--mute)}.kpi b{font-size:24px;line-height:1.2}
button.kpi{cursor:pointer}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid #c2410c;border-radius:12px;padding:9px 12px;text-align:left;width:100%}
.al.b{border-left-color:var(--blue)}.al.g{border-left-color:var(--green)}.al.k{border-left-color:#1c1a22}
.al b{display:block;font-size:14.5px}.al span{font-size:12.5px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;width:100%}
.mi:hover{border-color:#cdb7d4}
.mi .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.mi .t b{font-size:15.5px;font-family:'IBM Plex Mono',monospace}
.mi .t span{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.mi input[type=checkbox]{width:22px;height:22px;accent-color:var(--pea);flex:none}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rb{text-align:left;min-height:66px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);border-left:6px solid;background:#fff}
.rb b{display:block;font-size:15.5px}.rb span{font-size:12px;color:var(--mute)}
.rb.on{outline:3px solid var(--pea);outline-offset:-1px;background:#faf5fb}
.rb:disabled{opacity:.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #f0edf4;font-size:14px}
.kv span:first-child{color:var(--mute);flex:none}
.kv span:last-child{text-align:right}
.sap{display:flex;flex-direction:column;gap:4px}
.sap label{display:flex;align-items:center;gap:10px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px}
.sap input{width:20px;height:20px;accent-color:var(--pea);flex:none}
.sap label.need{border-color:#f1d9b0;background:#fffaf1}
.log{font-size:13px;display:flex;flex-direction:column;gap:6px}
.log div{border-left:3px solid #d8cfe0;padding-left:10px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img,.photos .ph{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f0edf4}
.photos .ph{display:grid;place-items:center;color:var(--mute);font-size:12px}
.tbl{overflow-x:auto;border:1px solid #eeeaf2;border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#faf8fc;color:var(--mute);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap}
td{border-top:1px solid #eeeaf2;padding:7px 10px;vertical-align:top}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
.dim{position:fixed;inset:0;background:rgba(20,10,25,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
@media (min-width:760px){.dim{align-items:center}}
.sheet{background:#fff;width:min(620px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{border-radius:20px}}
.sheet .x{float:right}
.sheet h2{margin:2px 0 12px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a0f33;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:90;display:none;max-width:92vw;text-align:center}
.toast.err{background:#9b1c1c}
.toast.ok{background:#13633a}
.sr{position:absolute;left:-9999px}
.stick{position:sticky;bottom:0;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;box-shadow:0 -4px 14px rgba(40,10,50,.06);z-index:2}
.labs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.labs canvas,.labs img{width:min(300px,100%);height:auto;border:1px solid #d8d2df;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.empty{text-align:center;padding:36px 10px;color:var(--mute)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
.spin.d{border-color:rgba(106,27,116,.25);border-top-color:var(--pea)}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{animation:fl .6s}
@keyframes fl{0%{background:#fff3c4}100%{background:#fff}}
.scanlog{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sl{display:flex;gap:10px;align-items:center;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;border:1px solid var(--line)}
.sl.ok{border-left:5px solid var(--green)}.sl.bad{border-left:5px solid var(--red)}.sl.w{border-left:5px solid #c2410c}
.sl b{font-family:'IBM Plex Mono',monospace}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;margin-top:10px}
.cam video{width:100%;display:block;max-height:46vh;object-fit:cover}
.cam .fr{position:absolute;inset:25% 12%;border:3px solid rgba(242,179,61,.9);border-radius:12px}
details.more summary{cursor:pointer;color:var(--pea);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a0f33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg></div>
    <div><h1>มิเตอร์ · คลังพัสดุ</h1><small id="sub">กำลังโหลด…</small></div>
    <div class="sp"></div>
    <button class="ibtn" id="prnBtn" aria-label="เครื่องพิมพ์ฉลาก"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg><i class="dot" id="prnDot"></i></button>

    <a class="ibtn" href="index.html" aria-label="กลับระบบคลังพัสดุ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></a>
  </header>
  <main class="main" id="main"><div class="wrap" id="view"><div class="empty"><span class="spin d"></span><br>กำลังโหลด…</div></div></main>
  <nav class="bnav" aria-label="เมนูหลัก">
    <button data-t="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>หน้าแรก</button>

    <button data-t="count"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10"/><path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>ตรวจนับ</button>
    <button data-t="ship"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.5"/><circle cx="18" cy="18" r="1.5"/></svg>นำส่ง/จำหน่าย</button>
  </nav>
</div>
<div class="dim" id="dim" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
