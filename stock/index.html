<script>
'use strict';
/* ---------------- ตั้งค่า ---------------- */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycby536q10bjzfwQPQLrxbv-BXY33WNggpQi06VdRLniht_zUZjArNZ5V9fQIBKCY0dAHzw/exec';   // ← ลิงก์ Web app หลังบ้านระบบคลังพัสดุ (…/exec) · ว่าง = โหมดทดลอง เก็บในเครื่องนี้
const lsr = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const API_URL = () => lsr('stock_api') || API_DEFAULT;
const LOCAL = () => !API_URL();
const cred = () => ({ user: lsr('pea_aoluek_username') || '', pass: lsr('pea_aoluek_password') || '' });
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (!n ? '–' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }));
const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2600); };
const GROUPS = [['all', 'ทุกหมวด'], ['1-00', 'เสา / คอน / สมอ'], ['1-01', 'เหล็ก / น็อต / แหวน'], ['1-02', 'สาย / ข้อต่อ'], ['1-03', 'ลูกถ้วย / แร็ค'], ['1-04', 'ฟิวส์ / ป้องกัน / สวิตช์'], ['1-05', 'หม้อแปลง / คาปาซิเตอร์'], ['1-06', 'มิเตอร์ / CT / VT'], ['other', 'อื่นๆ']];
const MAIN_G = ['1-00', '1-01', '1-02', '1-03', '1-04', '1-05', '1-06'];
const DEF_SLOCS = [{ code: '0023', name: 'สำรองแก้ไฟ' }, { code: '2201', name: 'ผปร' }, { code: '1201', name: 'ผมต' }, { code: '6006', name: 'กองหมอน' }, { code: '0201', name: 'กฟส.อ่าวลึก' }];

/* ---------------- สถานะ ---------------- */
let DB = { slocs: DEF_SLOCS, rows: [], imports: {}, me: { name: cred().user, admin: false } };
let MAT = {};             // รหัส 10 หลัก → [ชื่อไทย, ลำดับรูป]
let ITEMS = [];           // รวมรายรหัส
const ST = { tab: 'stock', s: lsr('stock_sloc') || '0023', g: 'all', q: '', view: lsr('stock_view') || 'cards', lim: 48 };

/* ---------------- หลังบ้าน ---------------- */
async function api(action, payload) {
  if (LOCAL()) return localApi(action, payload || {});
  const c = cred();
  if (!c.user) { const e = new Error('ยังไม่ได้เข้าสู่ระบบศูนย์รวมงาน'); e.code = 'unauthorized'; throw e; }
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 60000);
  let j;
  try {
    const r = await fetch(API_URL(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, user: c.user, pass: c.pass }, payload || {})), signal: ctrl.signal });
    j = await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต'); }
  finally { clearTimeout(t); }
  if (!j || !j.ok) { const e = new Error((j && (j.message || j.error)) || 'ไม่ทราบสาเหตุ'); e.code = j && j.error; throw e; }
  return j;
}
/* โหมดทดลอง: เก็บในเครื่องนี้ด้วยกติกาเดียวกับหลังบ้าน */
function localApi(action, b) {
  const L = JSON.parse(lsr('stock_local') || '{"rows":[],"imports":{}}');
  if (action === 'bootstrap') return Promise.resolve({ ok: true, slocs: DEF_SLOCS, rows: L.rows, imports: L.imports, me: { name: cred().user || 'ทดลอง', admin: true }, local: true, round: L.round || null, counts: L.counts || [], targets: L.targets || [], requests: L.requests || [] });
  if (action === 'importSap') {
    const now = new Date().toISOString();
    L.rows = L.rows.filter(r => r[0] !== b.sloc).concat(b.rows.map(r => [b.sloc, r[0], r[1], r[2], r[3], r[4], r[5]]));
    L.imports[b.sloc] = { at: now, by: cred().user || 'ทดลอง', file: b.file };
    lsr('stock_local', JSON.stringify(L));
    return Promise.resolve({ ok: true, sloc: b.sloc, rows: b.rows.length });
  }
  if (action === 'moves') return Promise.resolve({ ok: true, moves: [] });
  const me = cred().user || 'ทดลอง', now = new Date().toISOString(), save = () => lsr('stock_local', JSON.stringify(L));
  L.counts = L.counts || []; L.targets = L.targets || []; L.requests = L.requests || [];
  if (action === 'startRound') { L.round = { id: 'R' + Date.now(), name: b.name, open: true, by: me, at: now }; L.counts = []; save(); return Promise.resolve({ ok: true, round: L.round }); }
  if (action === 'closeRound') { L.round.open = false; L.round.closedAt = now; save(); return Promise.resolve({ ok: true }); }
  if (action === 'saveCount') { L.counts = L.counts.filter(c => !(c[0] === b.sloc && c[1] === b.mat)); if (b.qty !== null) L.counts.push([b.sloc, b.mat, b.sap, b.qty, b.note || '', me, now]); save(); return Promise.resolve({ ok: true }); }
  if (action === 'saveTargets') { b.items.forEach(([m, t]) => { L.targets = L.targets.filter(x => !(x[0] === b.sloc && x[1] === m)); if (t != null) L.targets.push([b.sloc, m, t]); }); save(); return Promise.resolve({ ok: true, targets: L.targets }); }
  if (action === 'createRequest') { const r = { id: (b.kind === 'transfer' ? 'TR' : 'RQ') + Date.now() + L.requests.length, kind: b.kind, from: b.from || 'K040 คลังกระบี่', to: b.to, items: b.items, status: 'ขอแล้ว', note: b.note || '', by: me, at: now }; L.requests.unshift(r); save(); return Promise.resolve({ ok: true, request: r }); }
  if (action === 'setRequestStatus') { const r = L.requests.find(x => x.id === b.id); if (r) r.status = b.status; save(); return Promise.resolve({ ok: true }); }
  return Promise.reject(new Error('โหมดทดลองไม่รองรับ'));
}

/* ---------------- รวมข้อมูล ---------------- */
function build() {
  const idx = {}; ITEMS = [];
  const sl = DB.slocs.map(s => s.code);
  DB.rows.forEach(r => {
    const [s, m, d, b, q, u, tr] = r;
    let it = idx[m];
    if (!it) {
      const mm = MAT[m.replace(/-/g, '')] || ['', -1];
      it = idx[m] = { m, en: String(d).replace(/^"|"$/g, ''), th: mm[0], img: mm[1], u, q: {}, b: {}, tr: 0, tot: 0 };
      ITEMS.push(it);
    }
    it.q[s] = (it.q[s] || 0) + (Number(q) || 0);
    if (Number(q)) { const k = s + '|' + (b || '-'); it.b[k] = (it.b[k] || 0) + Number(q); }
    it.tr += Number(tr) || 0;
  });
  ITEMS.forEach(it => { it.tot = sl.reduce((a, s) => a + (it.q[s] || 0), 0); it.key = (it.m + ' ' + it.th + ' ' + it.en).toLowerCase(); });
  ITEMS.sort((a, b) => a.m.localeCompare(b.m));
  buildExtra();
}
const pad4 = v => { const t = String(v == null ? '' : v).trim(); return /^\d{1,4}$/.test(t) ? t.padStart(4, '0') : t; };
function norm() {   // ชีตอาจเก็บ "0023" เป็นตัวเลข 23 → คืนเป็น 4 หลัก
  DB.rows.forEach(r => { r[0] = pad4(r[0]); });
  const im = {}; Object.keys(DB.imports || {}).forEach(k => { im[pad4(k)] = DB.imports[k]; }); DB.imports = im;
  (DB.slocs || []).forEach(x => { x.code = pad4(x.code); });
  (DB.counts || []).forEach(c => { c[0] = pad4(c[0]); });
  (DB.targets || []).forEach(t => { t[0] = pad4(t[0]); });
  (DB.requests || []).forEach(r => { r.to = pad4(r.to); if (/^\d{1,4}$/.test(String(r.from))) r.from = pad4(r.from); });
}

/* ---------------- อ่านไฟล์ SAP MB52 ---------------- */
function decode(buf) {
  const u = new Uint8Array(buf);
  if (u[0] === 0xFF && u[1] === 0xFE) return new TextDecoder('utf-16le').decode(u);
  if (u[0] === 0xFE && u[1] === 0xFF) return new TextDecoder('utf-16be').decode(u);
  if (u.length > 3 && u[1] === 0 && u[3] === 0) return new TextDecoder('utf-16le').decode(u);
  const t = new TextDecoder('utf-8').decode(u);
  return t.includes('�') ? new TextDecoder('windows-874').decode(u) : t;
}
function num(s) { s = String(s || '').replace(/,/g, '').trim(); if (!s) return 0; let neg = false; if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); } const n = parseFloat(s); return isNaN(n) ? 0 : (neg ? -n : n); }
function parseMB52(text) {
  const out = {}; let mat = null, desc = '', plant = '';
  text.split(/\r?\n/).forEach(line => {
    let c = line.split('\t').map(x => x.trim());
    while (c.length && c[0] === '') c.shift();
    if (!c.length) return;
    if (/^\d-\d\d-\d{3}-\d{4}$/.test(c[0])) { mat = c[0]; desc = (c[2] || '').replace(/^"|"$/g, ''); plant = c.find(x => /^K\d{3}$/.test(x)) || plant; return; }
    if (mat && /^\d{4}$/.test(c[0])) (out[c[0]] = out[c[0]] || []).push([mat, desc, c[1] || '', num(c[4]), c[5] || '', num(c[6])]);
  });
  return { slocs: out, plant };
}

async function readFiles(files) {
  for (const f of Array.from(files || [])) {
    try {
      const p = parseMB52(decode(await f.arrayBuffer()));
      const ks = Object.keys(p.slocs);
      if (!ks.length) { toast('อ่านไม่พบรายการพัสดุในไฟล์ ' + f.name, 4000); continue; }
      ks.forEach(s => { PENDING = PENDING.filter(x => x.sloc !== s); PENDING.push({ sloc: s, file: f.name, rows: p.slocs[s], plant: p.plant, state: '' }); });
    } catch (e) { toast('อ่านไฟล์ ' + f.name + ' ไม่ได้', 4000); }
  }
  drawPending();
}

}
async function saveAll() {
  const b = $('#save'); b.disabled = true;
  for (const p of PENDING.filter(x => x.state !== 'ok')) {
    p.state = 'run'; drawPending();
    try { await api('importSap', { sloc: p.sloc, file: p.file, rows: p.rows }); p.state = 'ok'; }
    catch (e) { p.state = e.message || 'ผิดพลาด'; }
    drawPending();
  }
  await load(true);
  const bad = PENDING.filter(x => x.state !== 'ok').length;
  toast(bad ? 'บันทึกไม่สำเร็จ ' + bad + ' ไฟล์' : 'บันทึกครบแล้ว', 3000);

}

const CS = { f: 'todo', q: '', zero: false };
function countList(s) {   // รายการที่ต้องนับในคลัง s: มียอด SAP หรือมีผลนับแล้ว (+ รหัสยอด 0 ถ้าเลือก)
  return ITEMS.filter(i => (i.q[s] || 0) > 0 || CNT[key2(s, i.m)] || (CS.zero && s in i.q));
}
function cstat(s) {
  const l = countList(s); let done = 0, ok = 0, short = 0, over = 0;
  l.forEach(i => { const c = CNT[key2(s, i.m)]; if (!c) return; done++; const d = c.q - (i.q[s] || 0); if (Math.abs(d) < 1e-9) ok++; else if (d < 0) short++; else over++; });
  return { all: l.length, done, ok, short, over, left: l.length - done };
}

  $('#view').innerHTML = h;

const RS = { mode: 'short', q: '', sel: {}, edit: {} };
function surplus(i, s) { const t = TGT[key2(s, i.m)]; return Math.max(0, (i.q[s] || 0) - (t || 0)); }
function plan(i, s) {   // ขาดเท่าไร โอนจากคลังไหนได้ ที่เหลือเบิก
  const t = TGT[key2(s, i.m)]; if (t == null) return null;
  const have = i.q[s] || 0, short = Math.max(0, Math.round((t - have) * 1000) / 1000);
  let need = short; const moves = [];
  DB.slocs.filter(x => x.code !== s).map(x => [x.code, surplus(i, x.code)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1])
    .forEach(([c, sp]) => { if (need <= 0) return; const q = Math.min(sp, need); moves.push([c, q]); need -= q; });
  return { have, target: t, short, moves, req: Math.round(need * 1000) / 1000 };
}
function rstat(s) {
  const l = ITEMS.filter(i => TGT[key2(s, i.m)] != null); let ok = 0;
  l.forEach(i => { if ((i.q[s] || 0) >= TGT[key2(s, i.m)]) ok++; });
  return { all: l.length, ok, short: l.length - ok };
}
function viewRestock() {

    <div class="seg" role="group" aria-label="มุมมอง"><button data-rm="short" class="${RS.mode === 'short' ? 'on' : ''}">ที่ขาด ${st.short}</button><button data-rm="all" class="${RS.mode === 'all' ? 'on' : ''}">ที่ตั้งไว้ ${st.all}</button>${adm ? `<button data-rm="edit" class="${RS.mode === 'edit' ? 'on' : ''}">ตั้งระดับต้องมี</button>` : ''}<button data-rm="docs" class="${RS.mode === 'docs' ? 'on' : ''}">ใบโอน/ใบเบิก ${(DB.requests || []).filter(r => r.to === s && (r.status === 'ขอแล้ว' || r.status === 'อนุมัติ')).length || ''}</button></div></div>`;

            <button class="t" data-m="${i.m}"><span class="mono muted" style="font-size:11.5px">${i.m}</span><b>${esc(itemName(i))}</b>${i.th ? `<span class="muted" style="font-size:12px">${esc(i.en)}</span>` : ''}</button>

        }).join('') + `</div>`;

async function makeDocs() {

  const jobs = Object.keys(by).map(c => ({ kind: 'transfer', from: c, to: s, items: by[c] }));
  if (reqItems.length) jobs.push({ kind: 'requisition', from: '', to: s, items: reqItems });
  const b = $('#mkDocs'); b.disabled = true; b.textContent = 'กำลังสร้าง…';
  const made = [];

}

function render() { ({ import: viewImport, count: viewCount, restock: viewRestock }[ST.tab] || viewStock)(); }
function go(t) { ST.tab = t; document.querySelectorAll('.bnav button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); $('#main').scrollTop = 0; }
document.querySelectorAll('.bnav button').forEach(b => b.onclick = () => go(b.dataset.t));
function setSub() {
  const ts = Object.values(DB.imports || {}).map(x => x.at).sort().pop();
  $('#sub').textContent = (LOCAL() ? 'โหมดทดลอง · ' : '') + 'Plant K040 · ' + (ts ? 'ยอด SAP ล่าสุด ' + thDate(ts) : 'ยังไม่มีข้อมูล');
}
async function load(quiet) {
  const rb = $('#reload'); rb.innerHTML = '<span class="spin" aria-hidden="true"></span>';
  try {
    const j = await api('bootstrap');
    DB = { slocs: j.slocs && j.slocs.length ? j.slocs : DEF_SLOCS, rows: j.rows || [], imports: j.imports || {}, me: j.me || {}, round: j.round || null, counts: j.counts || [], targets: j.targets || [], requests: j.requests || [] };
    norm();
    if (!LOCAL()) lsr('stock_cache', JSON.stringify(DB));
    build(); setSub(); render();
  } catch (e) {
    if (!quiet) toast(e.message, 4000);
    $('#sub').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
  } finally {
    rb.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>';
  }
}
$('#reload').onclick = () => load();

(async function boot() {
  try { MAT = await (await fetch('materials.json', { cache: 'force-cache' })).json(); } catch (e) { MAT = {}; }
  const c = !LOCAL() && lsr('stock_cache');
  if (c) { try { DB = JSON.parse(c); norm(); build(); setSub(); render(); } catch (e) {} }   // เปิดทันทีจากข้อมูลครั้งก่อน แล้วค่อยอัปเดต
  else render();
  (function wait(n) { if (cred().user || LOCAL() || n > 600) load(!!c); else setTimeout(() => wait(n + 1), 500); })(0);
})();
</script>
</body>
</html>
