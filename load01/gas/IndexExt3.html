<style>
.ala-wrap{display:grid;grid-template-columns:210px 1fr;gap:12px}
@media(max-width:820px){.ala-wrap{grid-template-columns:1fr}}
.ala-fd{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.ala-fd:hover{background:var(--surface-2)}.ala-fd.on{border-color:var(--brand-2);background:var(--surface-2)}
.ala-fd small{display:block;color:var(--text-muted);font-size:11.5px}
.ala-row2{display:grid;grid-template-columns:320px 1fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.ala-row2{grid-template-columns:1fr}}
.ala-bars .ph{display:grid;grid-template-columns:22px 1fr 72px;align-items:center;gap:6px;margin:5px 0;font-size:12.5px}
.ala-bars .tr{position:relative;height:13px;background:var(--surface-2);border-radius:7px}
.ala-bars .bb{position:absolute;left:0;top:0;height:100%;border-radius:7px;opacity:.35}
.ala-bars .ba{position:absolute;left:0;top:3px;height:7px;border-radius:4px}
.ala-bars .av{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary)}
.ala-chip{display:inline-block;min-width:20px;text-align:center;border-radius:5px;color:#fff;font-weight:700;font-size:12px;padding:0 3px}
.ala-num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--text-primary);color:var(--surface-1);font-weight:700;font-size:12px;align-items:center;justify-content:center}
#alaMap{width:100%;height:430px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.ala-lg{display:flex;gap:12px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap;margin-top:6px}
.ala-lg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.ala-tbl td,.ala-tbl th{vertical-align:top;text-align:left}
.ala-tbl tr.sel td{background:rgba(224,161,0,.12)}
.ala-amp{width:64px;font:inherit;font-size:13px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:inherit}
.ala-st{display:flex;gap:3px;flex-wrap:wrap}
.ala-st button,.ala-btn{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--surface-1);color:inherit;border-radius:6px;padding:2px 7px;cursor:pointer}
.ala-st button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ala-note{font-size:12.5px;color:var(--text-secondary);line-height:1.6;background:rgba(255,216,77,.12);border:1px solid rgba(224,161,0,.35);border-radius:9px;padding:9px 12px;margin-top:10px}
.ala-muted{color:var(--text-muted);font-size:12px}
.ala-help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--brand-2);background:var(--surface-1);color:var(--brand-2);font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:1px;padding:0}
.ala-howto{display:none;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);font-size:13px;line-height:1.7}
.ala-howto.on{display:block}.ala-howto h3{margin:0 0 6px;font-size:14px}.ala-howto ol{margin:4px 0 8px 18px;padding:0}
.ala-howto code{background:var(--surface-1);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ala-calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:8px 10px;background:var(--surface-1);border:1px dashed var(--line);border-radius:8px}
.ala-calc input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:inherit}
.ala-mode{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ala-mode button{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-1);color:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
.ala-mode button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ala-bar{height:6px;border-radius:3px;background:var(--surface-2);grid-column:1/3;position:relative;margin-top:3px}.ala-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#d9822b}
.ala-lever{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.ala-lever .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}.ala-lever .d{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.55}
.ala-row3{display:grid;grid-template-columns:1fr 360px;gap:12px;margin-top:12px}
@media(max-width:1000px){.ala-row3{grid-template-columns:1fr}}
.ala-stn{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ala-stn b{font-size:19px}
#alaMap{touch-action:none;cursor:grab}#alaMap:active{cursor:grabbing}
.ala-mapw{position:relative}
.ala-zb{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.ala-zb button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-1);color:inherit;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ala-zb button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ala-zh{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--text-muted);background:var(--surface-1);opacity:.85;border-radius:6px;padding:1px 6px;pointer-events:none}
</style>
<script>
(function(){
/* ===== แท็บ เจาะลึกสถานี (ข้อมูล SLD) ===== */
var AX = { SUB: 'ALA', MONTHS: 6, MAX_MOVES: 4, GOAL: 5, MIN_KVA: 30, KV_PH: 19.05,
  SLD_URL: 'https://aloofpea-aul.github.io/sld-ala/' };
var SLD = null, ACT = {}, cur = '', sel = -1, loading = false, err = '', helpOn = false, mode = 'ub', lsel = -1;
var BAHT = 3; try { BAHT = +localStorage.getItem('alaBaht') || 3; } catch (e) {}
var PH = { A: 'var(--s1)', B: 'var(--s2)', C: 'var(--s3)' };
var ST_TH = { todo: 'ยังไม่ทำ', doing: 'กำลังทำ', done: 'ย้ายแล้ว' };
function el(id){ return document.getElementById(id); }

var b = document.createElement('button'); b.dataset.v = 'ala'; b.textContent = 'เจาะลึกอ่าวลึก (SLD)';
var tabs = el('tabs'); tabs.insertBefore(b, tabs.querySelector('button[data-v="quality"]'));
b.onclick = function(){
  tabs.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === 'v-ala'); });
  render();
};
var sec = document.createElement('section'); sec.className = 'view'; sec.id = 'v-ala';
sec.innerHTML = '<div id="alaBody"><div class="card">กำลังโหลดข้อมูล SLD…</div></div>';
document.querySelector('main').appendChild(sec);

function load(){
  if (loading || SLD) return; loading = true;
  google.script.run.withSuccessHandler(function(s){
    SLD = JSON.parse(s); loading = false;
    cur = cur || Object.keys(SLD.feeders).sort()[0];
    google.script.run.withSuccessHandler(function(a){ ACT = a || {}; draw(); }).getLateralActions();
    draw();
  }).withFailureHandler(function(e){ loading = false; err = String(e && e.message || e); draw(); }).getSldData();
}

var _render = render;
render = function(){
  _render();
  var on = tabs.querySelector('button.on');
  if (D && on && on.dataset.v === 'ala') { if (!SLD) load(); draw(); }
};

/* ----- SCADA ของฟีดเดอร์ในสถานี: เฉลี่ยกระแสขณะ Peak N เดือนล่าสุด (ถึงเดือนที่เลือก) ----- */
function scada(name, mEnd, n, mMin){
  mMin = mMin || 0;
  var fi = -1; F.forEach(function(f){ if (f.sub === AX.SUB && f.name === name && f.type === 'Feeder') fi = f.i; });
  if (fi < 0) return null;
  var s = [0,0,0], k = 0, from = '', to = '', ms = [], pw = 0, qv = 0, lf = 0, nl = 0;
  for (var m = mEnd; m >= mMin && k < n; m--){
    var r = null; byM[m].forEach(function(x){ if (x.f === fi) r = x; });
    if (!r || r.q === 2 || r.q === 1 || r.ia == null || r.ib == null || r.ic == null) continue;
    s[0] += r.ia; s[1] += r.ib; s[2] += r.ic; k++; to = to || M[m]; from = M[m]; ms.push(M[m]);
    pw += Math.abs(r.mw || 0); qv += Math.abs(r.mvar || 0); if (r.lf) { lf += r.lf; nl++; }
  }
  return k ? { I: [s[0]/k, s[1]/k, s[2]/k], n: k, from: from, to: to, months: ms, mw: pw/k, mvar: qv/k, lf: nl ? lf/nl : 0.6 } : null;
}
function ubOf(I){ var a = (I[0]+I[1]+I[2])/3; return a > 0 ? Math.max(Math.abs(I[0]-a), Math.abs(I[1]-a), Math.abs(I[2]-a))/a*100 : 0; }
function monthIdx(ym){ for (var i = 0; i < M.length; i++) if (M[i] >= ym) return i; return M.length - 1; }

function plan(fd, sc){
  var tot = fd.kva.A + fd.kva.B + fd.kva.C + fd.kva['3P'];
  var u = (sc.I[0]+sc.I[1]+sc.I[2]) * AX.KV_PH / tot;
  fd.laterals.forEach(function(x){
    var a = ACT[x.id];
    x.est = Math.round(x.kva * u / AX.KV_PH * 10) / 10;
    x.amp = a && a.amp != null ? a.amp : x.est; x.measured = !!(a && a.amp != null);
    x.st = a ? a.s : 'todo';
  });
  var c = { A: sc.I[0], B: sc.I[1], C: sc.I[2] }, used = {}, mv = [];
  // ไลน์ที่ย้ายแล้ว: ถ้า SCADA ช่วงที่ใช้ยังเป็นก่อนย้าย ให้ปรับกระแสตามสัดส่วนเดือนที่ยังไม่สะท้อนผล
  fd.laterals.forEach(function(x){
    var a = ACT[x.id]; if (!a || a.s !== 'done' || !a.to || a.to === x.ph) return;
    var dm = (a.t || '').slice(0,7), before = 0;
    (sc.months || []).forEach(function(ym){ if (ym <= dm) before++; });
    var fr = sc.n ? before / sc.n : 0;
    c[x.ph] -= x.amp * fr; c[a.to] += x.amp * fr;
  });
  sc.adj = [c.A, c.B, c.C];
  while (mv.length < AX.MAX_MOVES){
    var base = ubOf([c.A, c.B, c.C]), best = null;
    fd.laterals.forEach(function(x, i){
      if (used[i] || x.st === 'done' || x.kva < AX.MIN_KVA) return;
      ['A','B','C'].forEach(function(to){
        if (to === x.ph) return;
        var y = { A: c.A, B: c.B, C: c.C }; y[x.ph] -= x.amp; y[to] += x.amp;
        var v = ubOf([y.A, y.B, y.C]);
        if (v < base - 0.8 && (!best || v < best.ub)) best = { i: i, to: to, ub: v, y: y };
      });
    });
    if (!best) break;
    used[best.i] = 1; c = best.y;
    mv.push({ i: best.i, frm: fd.laterals[best.i].ph, to: best.to, ub: best.ub, I: [c.A, c.B, c.C] });
    if (best.ub < AX.GOAL) break;
  }
  return mv;
}
function pill(v){ return '<span class="pill '+(v >= 15 ? 'red' : v >= 10 ? 'amb' : 'green')+'">'+fmt(v,1)+'%</span>'; }
function big(v){ return '<span style="color:'+(v >= 15 ? '#c0392b' : v >= 10 ? '#b7791f' : '#1f9d55')+'">'+fmt(v,1)+'%</span>'; }
function chip(p){ return '<span class="ala-chip" style="background:'+PH[p]+'">'+p+'</span>'; }

function draw(){
  var box = el('alaBody'); if (!box) return;
  if (err) { box.innerHTML = '<div class="card">ดึงข้อมูล SLD ไม่ได้: '+esc(err)+'</div>'; return; }
  if (!SLD || !D) { box.innerHTML = '<div class="card">กำลังโหลดข้อมูล SLD…</div>'; return; }
  var names = Object.keys(SLD.feeders).sort(), info = {};
  names.forEach(function(n){ var sc = scada(n, S.m, AX.MONTHS); if (sc) info[n] = { sc: sc, mv: plan(SLD.feeders[n], sc) }; });
  if (!info[cur]) cur = names.filter(function(n){ return info[n]; })[0];
  if (!cur) { box.innerHTML = '<div class="card">ไม่มีข้อมูล SCADA ของฟีดเดอร์สถานี '+AX.SUB+' ในช่วงที่เลือก</div>'; return; }
  if (mode === 'loss') { drawLoss(box, names, info); return; }
  var fd = SLD.feeders[cur], sc = info[cur].sc, mv = info[cur].mv, L = fd.laterals;
  var last = mv.length ? mv[mv.length-1] : null, ia = last ? last.I : sc.adj, ub0 = ubOf(sc.I), ub1 = last ? last.ub : ubOf(sc.adj);
  var mk = 0; mv.forEach(function(m){ mk += L[m.i].kva; });
  var side = names.map(function(n){
    var z = info[n]; if (!z) return '';
    var u0 = ubOf(z.sc.I), u1 = z.mv.length ? z.mv[z.mv.length-1].ub : ubOf(z.sc.adj);
    return '<div class="ala-fd'+(n === cur ? ' on' : '')+'" data-k="'+n+'"><div><b>'+n+'</b><small>'+(z.mv.length ? 'ย้าย '+z.mv.length+' ไลน์' : 'ไม่ต้องย้าย')+'</small></div><div style="text-align:right">'+pill(u0)+'<small style="font-size:11px;color:var(--text-muted)">→ '+fmt(u1,1)+'%</small></div></div>';
  }).join('');
  var mx = Math.max.apply(null, sc.I.concat(ia)) * 1.12, avg = (sc.I[0]+sc.I[1]+sc.I[2])/3;
  var bars = ['A','B','C'].map(function(p, j){ return '<div class="ph">'+chip(p)+'<div class="tr"><div class="bb" style="width:'+(sc.I[j]/mx*100)+'%;background:'+PH[p]+'"></div><div class="ba" style="width:'+(ia[j]/mx*100)+'%;background:'+PH[p]+'"></div><div class="av" style="left:'+(avg/mx*100)+'%"></div></div><span>'+fmt(sc.I[j],0)+'→'+fmt(ia[j],0)+' A</span></div>'; }).join('');
  var km = Math.max(fd.kva.A, fd.kva.B, fd.kva.C) || 1;
  var kbar = ['A','B','C'].map(function(p){ return '<div class="ph">'+chip(p)+'<div class="tr"><div class="ba" style="top:2px;height:9px;width:'+(fd.kva[p]/km*100)+'%;background:'+PH[p]+'"></div></div><span>'+fmt(fd.kva[p],0)+'</span></div>'; }).join('');
  var rows = mv.length ? mv.map(function(m, n){ return row(L[m.i], n, m); }).join('') : '<tr><td colspan="9" class="ala-muted">ฟีดเดอร์นี้ไม่ต้องย้ายเฟส (หรือย้ายแล้วครบ)</td></tr>';
  var done = L.filter(function(x){ return x.st === 'done'; });
  var doneRows = done.map(function(x){
    var a = ACT[x.id], dm = a.t.slice(0,7), mi = monthIdx(dm); if (M[mi] === dm) mi++; var b4 = scada(cur, mi-1, 3), af = mi < M.length ? scada(cur, M.length-1, 3, mi) : null;
    var res = b4 && af ? pill(ubOf(b4.I))+' → '+pill(ubOf(af.I)) : '<span class="ala-muted">รอข้อมูล SCADA เดือนถัดไป</span>';
    return '<tr><td>'+esc(x.devdesc || '(ไม่มีชื่อใน SLD)')+'<br><span class="ala-muted">'+esc(x.dev || '')+'</span></td><td>'+chip(x.ph)+' → '+chip(a.to || '?')+'</td><td>'+x.kva+' kVA</td><td>'+esc(a.t)+'</td><td>'+res+'</td></tr>';
  }).join('');
  box.innerHTML = modeBar() +
    '<div class="ala-wrap"><div class="card"><h2>ฟีดเดอร์ '+AX.SUB+'</h2>'+side+'<p class="ala-muted" style="line-height:1.5">%UB เฉลี่ยขณะ Peak '+AX.MONTHS+' เดือน ถึงเดือนที่เลือก → หลังย้ายตามแผน</p></div><div>'+
    '<div class="grid kpis">'+
      kpi('%Unbalance ตอนนี้', big(ub0), 'A '+fmt(sc.I[0],0)+' · B '+fmt(sc.I[1],0)+' · C '+fmt(sc.I[2],0)+' A ('+sc.n+' เดือน)')+
      kpi('หลังย้ายตามแผน', big(ub1), 'เป้าหมาย < 10% (ดีมาก < 5%)')+
      kpi('ต้องย้าย', mv.length+'<small>ไลน์</small>', 'รวม '+fmt(mk,0)+' kVA')+
      kpi('ไลน์แยก 1 เฟส', L.length+'<small>ไลน์</small>', 'ย้ายแล้ว '+done.length+' · วัดกระแสแล้ว '+L.filter(function(x){return x.measured;}).length)+
    '</div>'+
    '<div class="ala-row2"><div class="card"><h2>กระแสแต่ละเฟส: ตอนนี้ → หลังย้าย</h2><div class="ala-bars">'+bars+'</div>'+
      '<h2 style="margin-top:14px">หม้อแปลง 1 เฟสที่ต่ออยู่ (kVA)</h2><div class="ala-bars">'+kbar+'</div><p class="ala-muted">หม้อแปลง 3 เฟส '+fmt(fd.kva['3P'],0)+' kVA</p></div>'+
      '<div class="card"><h2>แผนที่ฟีดเดอร์ '+cur+'</h2><div class="ala-mapw"><svg id="alaMap"></svg><div class="ala-zb"><button data-z="in" title="ซูมเข้า">+</button><button data-z="out" title="ซูมออก">−</button><button data-z="reset" title="ดูทั้งฟีดเดอร์">⟲</button><button data-z="bg" title="พื้นหลังแผนที่จริง (กดสลับ: ไม่มี → ถนน → ดาวเทียม)">🗺</button></div><div class="ala-zh">เลื่อนลูกกลิ้งเมาส์ / ถ่างสองนิ้ว = ซูม · ลาก = เลื่อน</div></div><div class="ala-lg"><span><i style="background:#9a929e"></i>3 เฟส</span><span><i style="background:var(--s1)"></i>เฟส A</span><span><i style="background:var(--s2)"></i>เฟส B</span><span><i style="background:var(--s3)"></i>เฟส C</span><span><i style="background:var(--text-primary);height:6px"></i>ไลน์ที่ต้องย้าย (เลขที่ต้นทาง)</span></div></div></div>'+
    '<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">แผนย้ายเฟส (เรียงตามลำดับที่ควรทำ)</h2><button class="ala-btn" id="alaPrint">🖨 พิมพ์ใบสั่งงาน</button></div>'+
      '<div class="tbl-wrap"><table class="ptable ala-tbl"><thead><tr><th>#</th><th>ไลน์แยก / จุดตัดใกล้สุดใน SLD</th><th>ย้ายเฟส</th><th>หม้อแปลง</th><th>สาย</th><th>กระแส (A) <button class="ala-help" title="วิธีหาค่ากระแส">?</button></th><th>%UB หลังทำ</th><th>สถานะ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+

function modeBar(){ return '<div class="ala-mode"><button data-m="ub"'+(mode==='ub'?' class="on"':'')+'>⚖️ Unbalance รายไลน์แยก</button><button data-m="loss"'+(mode==='loss'?' class="on"':'')+'>🔥 ค่าสูญเสีย · แรงดันตก · Capacitor</button></div>'; }
function bindMode(box){ box.querySelectorAll('.ala-mode button').forEach(function(e){ e.onclick = function(){ mode = e.dataset.m; sel = -1; lsel = -1; draw(); }; }); }
/* ----- ค่าสูญเสีย / แรงดันตก / Capacitor (สัมประสิทธิ์คำนวณไว้แล้วฝั่งเซิร์ฟเวอร์ คูณกระแส SCADA ตรงนี้) ----- */
function lossOf(fl, I){ var t = 0; fl.sections.forEach(function(s){ t += I[0]*I[0]*s[4][0] + I[1]*I[1]*s[4][1] + I[2]*I[2]*s[4][2]; }); return t/1000; }
function flowCalc(n, z){
  var fl = SLD.feeders[n].flow; if (!fl) return null;
  var sc = z.sc, I = sc.I, pf = sc.mw ? sc.mw/Math.sqrt(sc.mw*sc.mw + sc.mvar*sc.mvar) : 1, sn = Math.sqrt(Math.max(0, 1-pf*pf));
  var lsf = 0.3*sc.lf + 0.7*sc.lf*sc.lf;
  var secs = fl.sections.map(function(s, i){
    var kw = (I[0]*I[0]*s[4][0] + I[1]*I[1]*s[4][1] + I[2]*I[2]*s[4][2]) / 1000;
    return { i: i, c: s[0], ph: s[1], km: s[2], R: s[3], kw: kw, imax: Math.max(I[0]*s[5][0], I[1]*s[5][1], I[2]*s[5][2]), up: (s[1].length > 1 && s[3] > 0.2) ? kw*(1 - 0.18/s[3]) : 0, pts: s[6] };
  });
  var kw = 0, up = 0; secs.forEach(function(s){ kw += s.kw; up += s.up; });
  var vd = 0, wp = null;
  fl.vd.forEach(function(v){ for (var j = 0; j < 3; j++){ var x = I[j]*(v[2+j]*pf + v[5+j]*sn)/19050*100; if (x > vd) { vd = x; wp = [v[0], v[1]]; } } });
  var cap = null;
  if (pf < 0.97 && sc.mvar > 0) {
    var q = sc.mvar*1000/(3*AX.KV_PH), best = null;
    [300, 600, 900, 1200].forEach(function(sz){
      if (sz > sc.mvar*1000*0.7) return;
      var Ic = sz/(3*AX.KV_PH);
      fl.cap.forEach(function(c){ var d = 3*(2*Ic*q*c[3] - Ic*Ic*c[2]); if (!best || d > best.w) best = { w: d, kvar: sz, pt: [c[0], c[1]] }; });
    });
    if (best && best.w > 0) cap = { kvar: best.kvar, kw: best.w/1000, pt: best.pt, pf2: sc.mw/Math.sqrt(sc.mw*sc.mw + Math.pow(Math.max(0, sc.mvar - best.kvar/1000), 2)) };
  }
  var aft = z.mv.length ? z.mv[z.mv.length-1].I : (sc.adj || I);
  var ubs = Math.max(0, kw - lossOf(fl, aft));
  secs.sort(function(a, b){ return b.kw - a.kw; });
  return { secs: secs, kw: kw, pct: sc.mw ? kw/(sc.mw*10) : 0, kwh: kw*lsf*8760, lsf: lsf, vd: vd, wp: wp, pf: pf, cap: cap, up: up, ubs: ubs, mw: sc.mw, lf: sc.lf };
}

var SUB_POS = [8.42033, 98.7397];

/* ----- ซูม/เลื่อนแผนที่ (ล้อเมาส์, ลาก, ถ่างสองนิ้ว, ปุ่ม +/−) ----- */
var ZM = {}, FOCUS = null;
function zs(){ var k = mode + '|' + cur; return ZM[k] || (ZM[k] = { z: 1, x: 0, y: 0 }); }
function bindZoom(svg, redraw){
  if (svg._zb) return; svg._zb = 1;
  var raf = 0, req = function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); };
  var W = function(){ return svg.clientWidth || 700; }, H = 430;
  var zoomAt = function(mx, my, f){
    var s = zs(), nz = Math.min(60, Math.max(1, s.z * f)); if (nz === s.z) return;
    var cx = W()/2, cy = H/2;
    s.x = mx - cx - (mx - cx - s.x) * nz / s.z; s.y = my - cy - (my - cy - s.y) * nz / s.z; s.z = nz;
    if (nz === 1) { s.x = 0; s.y = 0; }
    req();
  };
  var pt = function(e){ var r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  svg.addEventListener('wheel', function(e){ e.preventDefault(); var p = pt(e); zoomAt(p[0], p[1], e.deltaY < 0 ? 1.3 : 1/1.3); }, { passive: false });
  var ptrs = {}, last = null, pinch = null;
  svg.addEventListener('pointerdown', function(e){ ptrs[e.pointerId] = pt(e); try { svg.setPointerCapture(e.pointerId); } catch (x) {} last = pt(e); pinch = null; });
  svg.addEventListener('pointermove', function(e){

    ptrs[e.pointerId] = pt(e);
    var ids = Object.keys(ptrs);
    if (ids.length >= 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0]-b[0], a[1]-b[1]), m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
      if (pinch) { zoomAt(m[0], m[1], d / pinch.d); var s = zs(); s.x += m[0] - pinch.m[0]; s.y += m[1] - pinch.m[1]; }
      pinch = { d: d, m: m }; return;
    }
    var p = pt(e); if (last) { var s2 = zs(); s2.x += p[0] - last[0]; s2.y += p[1] - last[1]; req(); } last = p;
  });

  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);

    var z = b.dataset.z;
    if (z === 'bg') { BG = BG === '' ? 'osm' : BG === 'osm' ? 'sat' : ''; req(); return; }
    if (z === 'reset') { var s = zs(); s.z = 1; s.x = 0; s.y = 0; req(); }
    else zoomAt(W()/2, H/2, z === 'in' ? 1.6 : 1/1.6);

}
/* ----- พื้นหลังแผนที่จริง (โหลดเมื่อกดปุ่ม 🗺 เท่านั้น) ----- */
var BG = '';
function bgBtn(svg){ var b = svg.parentNode.querySelector('[data-z="bg"]'); if (b) { b.classList.toggle('on', !!BG); b.title = BG === 'osm' ? 'ตอนนี้: แผนที่ถนน (กดเพื่อเปลี่ยนเป็นดาวเทียม)' : BG === 'sat' ? 'ตอนนี้: ดาวเทียม (กดเพื่อปิด)' : 'พื้นหลังแผนที่จริง (กดสลับ: ไม่มี → ถนน → ดาวเทียม)'; } }
function bgTiles(W, H, ox, oy, o1, a2, k, zz){
  if (!BG) return '';
  var inv = function(sx, sy){ var rx = (sx - W/2 - zz.x)/zz.z + W/2, ry = (sy - H/2 - zz.y)/zz.z + H/2; return [a2 - (ry - oy)/k, o1 + (rx - ox)/k]; };

  var tl = inv(0, 0), br = inv(W, H), Z = Math.max(5, Math.min(18, Math.round(Math.log(360*k*zz.z/256)/Math.LN2))), n = Math.pow(2, Z);
  var tx = function(lon){ return Math.floor((lon + 180)/360*n); }, ty = function(lat){ var r = lat*Math.PI/180; return Math.floor((1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*n); };

    out += '<image href="'+url+'" x="'+a[0].toFixed(1)+'" y="'+a[1].toFixed(1)+'" width="'+(b[0] - a[0] + 0.6).toFixed(1)+'" height="'+(b[1] - a[1] + 0.6).toFixed(1)+'" preserveAspectRatio="none"/>';

function map(fd, mv){
